  <text x="600" y="628" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="rgba(175,198,207,0.85)">premium range over spot</text>
  <text x="600" y="658" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="rgba(175,198,207,0.50)">depending on where and what you buy</text>

  <!-- Divider -->
  <line x1="200" y1="690" x2="1000" y2="690" stroke="rgba(88,214,255,0.12)" stroke-width="1"/>

  <!-- Three channel summary -->
  <text x="600" y="748" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="rgba(88,214,255,0.85)" font-weight="700">Online rounds: 3-8% &#160;&#183;&#160; Coin shops: 8-18%</text>
  <text x="600" y="784" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="rgba(77,255,184,0.80)" font-weight="700">Private sales: 1-5% &#160;&#183;&#160; Check/ACH saves 3-4%</text>

  <!-- Excerpt -->
  <text x="600" y="845" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="rgba(175,198,207,0.72)">The format you buy matters as much as the channel.</text>

  <!-- Bottom zone: CTA -->
  <rect x="240" y="930" width="720" height="72" rx="16" fill="rgba(7,20,28,0.85)" stroke="rgba(88,214,255,0.30)" stroke-width="1.5"/>
  <text x="600" y="972" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="rgba(175,198,207,0.70)">Full breakdown at</text>
  <text x="600" y="995" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="800" letter-spacing="1" fill="#58d6ff">fuseddistribution.com</text>

  <!-- Brand footer -->
  <text x="600" y="1140" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="900" letter-spacing="4" fill="rgba(88,214,255,0.28)">FUSEDDISTRIBUTION.COM</text>
