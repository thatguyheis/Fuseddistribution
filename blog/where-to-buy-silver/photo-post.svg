      <stop offset="0%" stop-color="#58d6ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#58d6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-tl" cx="0%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#4dffb8" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#4dffb8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1200" fill="#041018"/>
  <rect width="1200" height="1200" fill="url(#glow-c)"/>
  <rect width="1200" height="1200" fill="url(#glow-tl)"/>

  <!-- Grid lines -->
  <line x1="170" y1="0" x2="170" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="340" y1="0" x2="340" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="510" y1="0" x2="510" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="680" y1="0" x2="680" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="850" y1="0" x2="850" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="1020" y1="0" x2="1020" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>

  <!-- Rings -->
  <circle cx="600" cy="600" r="420" fill="none" stroke="#58d6ff" stroke-width="1" opacity="0.07"/>
  <circle cx="600" cy="600" r="280" fill="none" stroke="#58d6ff" stroke-width="1" opacity="0.10"/>

  <!-- Scatter dots -->
  <circle cx="138" cy="95" r="1.4" fill="#58d6ff" opacity="0.22"/>
  <circle cx="372" cy="55" r="1.6" fill="#4dffb8" opacity="0.26"/>
  <circle cx="935" cy="82" r="1.3" fill="#58d6ff" opacity="0.18"/>
  <circle cx="1075" cy="148" r="1.5" fill="#4dffb8" opacity="0.24"/>
  <circle cx="185" cy="1060" r="1.4" fill="#58d6ff" opacity="0.20"/>
  <circle cx="775" cy="1108" r="1.6" fill="#4dffb8" opacity="0.25"/>
  <circle cx="1120" cy="948" r="1.3" fill="#58d6ff" opacity="0.18"/>
  <circle cx="78" cy="630" r="1.5" fill="#4dffb8" opacity="0.20"/>
  <circle cx="492" cy="1148" r="1.4" fill="#58d6ff" opacity="0.21"/>
  <circle cx="1068" cy="572" r="1.2" fill="#4dffb8" opacity="0.17"/>

  <!-- Top zone: eyebrow + brand -->
  <text x="600" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="4" fill="rgba(88,214,255,0.55)">FUSED DISTRIBUTION</text>
  <rect x="410" y="124" width="380" height="48" rx="12" fill="rgba(88,214,255,0.08)" stroke="rgba(88,214,255,0.22)" stroke-width="1"/>
