  <text x="600" y="280" text-anchor="middle" font-family="Impact,sans-serif" font-size="76" letter-spacing="2" fill="rgba(175,198,207,0.70)">WHERE TO</text>
  <text x="600" y="364" text-anchor="middle" font-family="Impact,sans-serif" font-size="104" letter-spacing="2" fill="#58d6ff">BUY SILVER</text>
  <text x="600" y="428" text-anchor="middle" font-family="Impact,sans-serif" font-size="46" letter-spacing="1" fill="rgba(175,198,207,0.65)">3 CHANNELS COMPARED</text>

