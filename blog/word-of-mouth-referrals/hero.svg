<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow-center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58d6ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#58d6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-topleft" cx="0%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#4dffb8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4dffb8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1e2a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#071318" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#041018"/>
  <rect width="1200" height="630" fill="url(#glow-center)"/>
  <rect width="1200" height="630" fill="url(#glow-topleft)"/>

  <!-- Grid lines -->
  <line x1="170" y1="0" x2="170" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="340" y1="0" x2="340" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="510" y1="0" x2="510" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="680" y1="0" x2="680" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="850" y1="0" x2="850" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="1020" y1="0" x2="1020" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>

  <!-- Rings -->
  <circle cx="600" cy="315" r="255" fill="none" stroke="#58d6ff" stroke-width="1" opacity="0.07"/>
  <circle cx="600" cy="315" r="170" fill="none" stroke="#58d6ff" stroke-width="1" opacity="0.11"/>

  <!-- Scatter dots -->
  <circle cx="115" cy="82" r="1.5" fill="#58d6ff" opacity="0.22"/>
  <circle cx="388" cy="52" r="1" fill="#4dffb8" opacity="0.18"/>
  <circle cx="756" cy="78" r="1.5" fill="#58d6ff" opacity="0.20"/>
  <circle cx="954" cy="112" r="1" fill="#4dffb8" opacity="0.25"/>
  <circle cx="1082" cy="62" r="1.5" fill="#58d6ff" opacity="0.17"/>
  <circle cx="228" cy="518" r="1" fill="#4dffb8" opacity="0.19"/>
  <circle cx="838" cy="548" r="1.5" fill="#58d6ff" opacity="0.21"/>
  <circle cx="1044" cy="488" r="1" fill="#58d6ff" opacity="0.16"/>
  <circle cx="472" cy="568" r="1" fill="#4dffb8" opacity="0.20"/>
  <circle cx="670" cy="96" r="1" fill="#58d6ff" opacity="0.15"/>

  <!-- LEFT STAT CARD: 92% -->
  <rect x="42" y="180" width="272" height="270" rx="18" fill="url(#card-bg)" stroke="#58d6ff" stroke-width="1" stroke-opacity="0.18"/>
  <text x="178" y="236" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="11" font-weight="800" letter-spacing="0.12em" fill="#58d6ff" opacity="0.7">CONSUMER TRUST</text>
  <text x="178" y="323" text-anchor="middle" font-family="Impact, Haettenschweiler, Arial Narrow Bold, sans-serif" font-size="88" letter-spacing="0.02em" fill="#58d6ff">92%</text>
  <text x="178" y="362" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="13" fill="rgba(175,198,207,0.72)" letter-spacing="0.04em">trust referrals from</text>
  <text x="178" y="380" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="13" fill="rgba(175,198,207,0.72)" letter-spacing="0.04em">friends and family</text>

  <!-- CENTER: referral chain graphic -->
  <!-- Person 1 icon (circle + rect) -->
  <circle cx="520" cy="210" r="18" fill="rgba(88,214,255,0.15)" stroke="#58d6ff" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="520" y="216" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="16" fill="#58d6ff" opacity="0.6">&#9679;</text>
  <!-- Arrow right -->
  <line x1="542" y1="210" x2="578" y2="210" stroke="#58d6ff" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="4,3"/>
  <polygon points="578,205 586,210 578,215" fill="#58d6ff" opacity="0.4"/>
  <!-- Person 2 icon -->
  <circle cx="600" cy="210" r="18" fill="rgba(88,214,255,0.22)" stroke="#58d6ff" stroke-width="1.5" stroke-opacity="0.65"/>
  <text x="600" y="216" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="16" fill="#58d6ff" opacity="0.8">&#9679;</text>
  <!-- Arrow right -->
  <line x1="622" y1="210" x2="658" y2="210" stroke="#58d6ff" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="4,3"/>
  <polygon points="658,205 666,210 658,215" fill="#58d6ff" opacity="0.4"/>
  <!-- Person 3 icon -->
  <circle cx="680" cy="210" r="18" fill="rgba(77,255,184,0.15)" stroke="#4dffb8" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="680" y="216" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="16" fill="#4dffb8" opacity="0.6">&#9679;</text>

  <text x="600" y="256" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="11" fill="rgba(175,198,207,0.55)" letter-spacing="0.1em">REFERRAL CHAIN</text>

  <!-- Center headline -->
  <text x="600" y="308" text-anchor="middle" font-family="Impact, Haettenschweiler, Arial Narrow Bold, sans-serif" font-size="34" letter-spacing="0.06em" fill="#ecf8fb">WORD OF MOUTH</text>
  <text x="600" y="342" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="13" fill="rgba(175,198,207,0.65)" letter-spacing="0.06em">FOR LOCAL BUSINESSES</text>

  <!-- Divider -->
  <line x1="456" y1="362" x2="744" y2="362" stroke="rgba(88,214,255,0.22)" stroke-width="1"/>

  <!-- Three steps -->
  <rect x="448" y="374" width="304" height="30" rx="8" fill="rgba(88,214,255,0.08)" stroke="rgba(88,214,255,0.16)" stroke-width="1"/>
  <text x="464" y="394" font-family="Impact, sans-serif" font-size="13" fill="#58d6ff">1</text>
  <text x="482" y="394" font-family="Trebuchet MS, sans-serif" font-size="12" fill="rgba(175,198,207,0.7)" letter-spacing="0.04em">ASK AT 30-DAY FOLLOW-UP</text>
  <rect x="448" y="410" width="304" height="30" rx="8" fill="rgba(88,214,255,0.04)" stroke="rgba(88,214,255,0.10)" stroke-width="1"/>
  <text x="464" y="430" font-family="Impact, sans-serif" font-size="13" fill="rgba(88,214,255,0.6)">2</text>
  <text x="482" y="430" font-family="Trebuchet MS, sans-serif" font-size="12" fill="rgba(175,198,207,0.45)" letter-spacing="0.04em">THANK THE REFERRER</text>
  <rect x="448" y="446" width="304" height="30" rx="8" fill="rgba(88,214,255,0.04)" stroke="rgba(88,214,255,0.08)" stroke-width="1"/>
  <text x="464" y="466" font-family="Impact, sans-serif" font-size="13" fill="rgba(88,214,255,0.4)">3</text>
  <text x="482" y="466" font-family="Trebuchet MS, sans-serif" font-size="12" fill="rgba(175,198,207,0.32)" letter-spacing="0.04em">TRACK WHO SENDS YOU WORK</text>

  <!-- RIGHT STAT CARD: 4x -->
  <rect x="886" y="180" width="272" height="270" rx="18" fill="url(#card-bg)" stroke="#4dffb8" stroke-width="1" stroke-opacity="0.18"/>
  <text x="1022" y="236" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="11" font-weight="800" letter-spacing="0.12em" fill="#4dffb8" opacity="0.7">REFERRAL MULTIPLIER</text>
  <text x="1022" y="323" text-anchor="middle" font-family="Impact, Haettenschweiler, Arial Narrow Bold, sans-serif" font-size="88" letter-spacing="0.02em" fill="#4dffb8">4x</text>
  <text x="1022" y="362" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="13" fill="rgba(175,198,207,0.72)" letter-spacing="0.04em">more likely to refer</text>
  <text x="1022" y="380" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="13" fill="rgba(175,198,207,0.72)" letter-spacing="0.04em">if they were referred</text>
</svg>
