<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow-c" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58d6ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#041018" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-tl" cx="0%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#4dffb8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#041018" stop-opacity="0"/>
    </radialGradient>
    <path id="star-sm" d="M 0,-7 L 1.76,-2.43 L 6.66,-2.16 L 2.85,0.93 L 4.11,5.66 L 0,3 L -4.11,5.66 L -2.85,0.93 L -6.66,-2.16 L -1.76,-2.43 Z"/>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#041018"/>
  <rect width="1200" height="630" fill="url(#glow-c)"/>
  <rect width="1200" height="630" fill="url(#glow-tl)"/>

  <!-- Grid lines -->
  <line x1="170" y1="0" x2="170" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="340" y1="0" x2="340" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="510" y1="0" x2="510" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="680" y1="0" x2="680" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="850" y1="0" x2="850" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="1020" y1="0" x2="1020" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>

  <!-- Rings -->
  <circle cx="600" cy="315" r="255" fill="none" stroke="#58d6ff" stroke-width="1" opacity="0.07"/>
  <circle cx="600" cy="315" r="170" fill="none" stroke="#58d6ff" stroke-width="1" opacity="0.11"/>

  <!-- Scatter dots -->
  <circle cx="142" cy="88"  r="1.2" fill="#58d6ff" opacity="0.22"/>
  <circle cx="380" cy="52"  r="1.0" fill="#4dffb8" opacity="0.18"/>
  <circle cx="760" cy="74"  r="1.4" fill="#58d6ff" opacity="0.26"/>
  <circle cx="920" cy="120" r="1.1" fill="#4dffb8" opacity="0.20"/>
  <circle cx="1080" cy="55" r="1.3" fill="#58d6ff" opacity="0.17"/>
  <circle cx="88"  cy="400" r="1.0" fill="#4dffb8" opacity="0.22"/>
  <circle cx="1140" cy="380" r="1.2" fill="#58d6ff" opacity="0.19"/>
  <circle cx="460" cy="580" r="1.1" fill="#4dffb8" opacity="0.15"/>
  <circle cx="820" cy="560" r="1.3" fill="#58d6ff" opacity="0.20"/>

  <!-- Left stat card: 45% -->
  <rect x="42" y="190" width="280" height="120" rx="16" fill="rgba(7,20,28,0.85)" stroke="rgba(88,214,255,0.18)" stroke-width="1"/>
  <text x="182" y="245" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="52" fill="#58d6ff" text-anchor="middle" letter-spacing="1">45%</text>
  <text x="182" y="272" font-family="'Trebuchet MS','Segoe UI',sans-serif" font-size="13" fill="rgba(175,198,207,0.75)" text-anchor="middle">MORE LIKELY TO VISIT</text>
  <text x="182" y="290" font-family="'Trebuchet MS','Segoe UI',sans-serif" font-size="11" fill="rgba(175,198,207,0.45)" text-anchor="middle">when businesses respond</text>

  <!-- Right stat card: 89% -->
  <rect x="878" y="190" width="280" height="120" rx="16" fill="rgba(7,20,28,0.85)" stroke="rgba(77,255,184,0.18)" stroke-width="1"/>
  <text x="1018" y="245" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="52" fill="#4dffb8" text-anchor="middle" letter-spacing="1">89%</text>
  <text x="1018" y="272" font-family="'Trebuchet MS','Segoe UI',sans-serif" font-size="13" fill="rgba(175,198,207,0.75)" text-anchor="middle">READ YOUR RESPONSES</text>
  <text x="1018" y="290" font-family="'Trebuchet MS','Segoe UI',sans-serif" font-size="11" fill="rgba(175,198,207,0.45)" text-anchor="middle">before choosing a business</text>

  <!-- Center: headline -->
  <text x="600" y="220" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="44" fill="#ecf8fb" text-anchor="middle" letter-spacing="2">HOW TO RESPOND TO</text>
  <text x="600" y="270" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="44" fill="#58d6ff" text-anchor="middle" letter-spacing="2">NEGATIVE REVIEWS</text>

  <!-- Stars row -->
  <g transform="translate(546,308)" fill="#58d6ff" opacity="0.85">
    <use href="#star-sm"/>
    <use href="#star-sm" transform="translate(18,0)"/>
    <use href="#star-sm" transform="translate(36,0)"/>
    <use href="#star-sm" transform="translate(54,0)"/>
    <use href="#star-sm" transform="translate(72,0)" fill="#afc6cf" opacity="0.4"/>
  </g>

  <!-- Sub-headline -->
  <text x="600" y="350" font-family="'Trebuchet MS','Segoe UI',sans-serif" font-size="16" fill="rgba(175,198,207,0.75)" text-anchor="middle" letter-spacing="1">A LOCAL BUSINESS OWNER'S PLAYBOOK</text>

  <!-- Divider line -->
  <line x1="380" y1="370" x2="820" y2="370" stroke="rgba(88,214,255,0.2)" stroke-width="1"/>

  <!-- Brand -->
  <text x="600" y="420" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="20" fill="rgba(88,214,255,0.5)" text-anchor="middle" letter-spacing="4">FUSED</text>
  <text x="600" y="438" font-family="'Trebuchet MS','Segoe UI',sans-serif" font-size="10" fill="rgba(175,198,207,0.35)" text-anchor="middle" letter-spacing="3">TECHNOLOGY SOLUTIONS</text>
</svg>
