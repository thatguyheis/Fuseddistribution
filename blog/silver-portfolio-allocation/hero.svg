  <text x="600" y="210" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="40" fill="#ecf8fb" text-anchor="middle" letter-spacing="2">HOW MUCH SILVER</text>
  <text x="600" y="255" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="40" fill="#58d6ff" text-anchor="middle" letter-spacing="2">SHOULD YOU OWN?</text>
