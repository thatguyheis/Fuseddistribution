  <line x1="380" y1="315" x2="820" y2="315" stroke="rgba(88,214,255,0.18)" stroke-width="1"/>

  <text x="600" y="360" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="36" fill="#4dffb8" text-anchor="middle">5-15%</text>
  <text x="600" y="386" font-family="'Trebuchet MS','Segoe UI',sans-serif" font-size="13" fill="rgba(175,198,207,0.55)" text-anchor="middle">recommended precious metals range</text>

  <!-- Brand -->
  <text x="600" y="440" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="20" fill="rgba(88,214,255,0.5)" text-anchor="middle" letter-spacing="4">FUSED</text>
  <text x="600" y="458" font-family="'Trebuchet MS','Segoe UI',sans-serif" font-size="10" fill="rgba(175,198,207,0.35)" text-anchor="middle" letter-spacing="3">DISTRIBUTION</text>
</svg>
