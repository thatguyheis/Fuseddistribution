  <circle cx="600" cy="315" r="170" fill="none" stroke="#58d6ff" stroke-width="1" opacity="0.11"/>

  <!-- Scatter dots -->
  <circle cx="120" cy="70"  r="1.3" fill="#58d6ff" opacity="0.22"/>
  <circle cx="410" cy="45"  r="1.1" fill="#4dffb8" opacity="0.18"/>
  <circle cx="780" cy="65"  r="1.4" fill="#58d6ff" opacity="0.24"/>
  <circle cx="970" cy="110" r="1.0" fill="#4dffb8" opacity="0.17"/>
  <circle cx="1090" cy="50" r="1.2" fill="#58d6ff" opacity="0.20"/>
  <circle cx="65"  cy="420" r="1.1" fill="#4dffb8" opacity="0.19"/>
  <circle cx="1145" cy="390" r="1.3" fill="#58d6ff" opacity="0.18"/>
  <circle cx="490" cy="590" r="1.0" fill="#4dffb8" opacity="0.14"/>
  <circle cx="840" cy="575" r="1.2" fill="#58d6ff" opacity="0.20"/>

  <!-- Allocation bar graphic — left panel -->
  <rect x="42" y="150" width="280" height="280" rx="16" fill="rgba(7,20,28,0.85)" stroke="rgba(88,214,255,0.18)" stroke-width="1"/>
  <text x="182" y="188" font-family="'Trebuchet MS','Segoe UI',sans-serif" font-size="11" fill="rgba(175,198,207,0.55)" text-anchor="middle" letter-spacing="2">ALLOCATION GUIDE</text>
  <!-- bar rows -->
  <text x="60" y="218" font-family="'Trebuchet MS',sans-serif" font-size="10" fill="rgba(175,198,207,0.6)">CONSERVATIVE</text>
  <rect x="60" y="224" width="200" height="12" rx="3" fill="rgba(88,214,255,0.1)"/>
  <rect x="60" y="224" width="60" height="12" rx="3" fill="#58d6ff" opacity="0.7"/>
  <text x="126" y="234" font-family="'Trebuchet MS',sans-serif" font-size="9" fill="#ecf8fb">3-5%</text>

  <text x="60" y="260" font-family="'Trebuchet MS',sans-serif" font-size="10" fill="rgba(175,198,207,0.6)">MODERATE</text>
  <rect x="60" y="266" width="200" height="12" rx="3" fill="rgba(88,214,255,0.1)"/>
  <rect x="60" y="266" width="120" height="12" rx="3" fill="#58d6ff" opacity="0.85"/>
  <text x="186" y="276" font-family="'Trebuchet MS',sans-serif" font-size="9" fill="#ecf8fb">8-10%</text>

  <text x="60" y="302" font-family="'Trebuchet MS',sans-serif" font-size="10" fill="rgba(175,198,207,0.6)">GROWTH</text>
  <rect x="60" y="308" width="200" height="12" rx="3" fill="rgba(88,214,255,0.1)"/>
  <rect x="60" y="308" width="170" height="12" rx="3" fill="#4dffb8" opacity="0.8"/>
  <text x="236" y="318" font-family="'Trebuchet MS',sans-serif" font-size="9" fill="#ecf8fb">12-15%</text>
  <text x="182" y="370" font-family="'Trebuchet MS',sans-serif" font-size="10" fill="rgba(175,198,207,0.4)" text-anchor="middle">precious metals as % of portfolio</text>

  <!-- Right panel: coin stack visual -->
  <rect x="878" y="150" width="280" height="280" rx="16" fill="rgba(7,20,28,0.85)" stroke="rgba(77,255,184,0.18)" stroke-width="1"/>
  <text x="1018" y="188" font-family="'Trebuchet MS','Segoe UI',sans-serif" font-size="11" fill="rgba(77,255,184,0.7)" text-anchor="middle" letter-spacing="2">GOLD-SILVER RATIO</text>
  <text x="1018" y="265" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="72" fill="#4dffb8" text-anchor="middle">80</text>
  <text x="1018" y="295" font-family="'Trebuchet MS','Segoe UI',sans-serif" font-size="12" fill="rgba(175,198,207,0.65)" text-anchor="middle">RATIO ABOVE 80</text>
  <text x="1018" y="315" font-family="'Trebuchet MS','Segoe UI',sans-serif" font-size="12" fill="rgba(175,198,207,0.45)" text-anchor="middle">= silver historically</text>
  <text x="1018" y="333" font-family="'Trebuchet MS','Segoe UI',sans-serif" font-size="12" fill="rgba(175,198,207,0.45)" text-anchor="middle">undervalued vs gold</text>

