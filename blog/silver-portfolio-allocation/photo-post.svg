<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <radialGradient id="glow-c" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#58d6ff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#041018" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-tl" cx="0%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#4dffb8" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#041018" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="1200" fill="#041018"/>
  <rect width="1200" height="1200" fill="url(#glow-c)"/>
  <rect width="1200" height="1200" fill="url(#glow-tl)"/>

  <!-- Grid lines -->
  <line x1="170" y1="0" x2="170" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="340" y1="0" x2="340" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="510" y1="0" x2="510" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="680" y1="0" x2="680" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="850" y1="0" x2="850" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="1020" y1="0" x2="1020" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>

  <!-- Rings -->
  <circle cx="600" cy="600" r="420" fill="none" stroke="#58d6ff" stroke-width="1" opacity="0.06"/>
  <circle cx="600" cy="600" r="280" fill="none" stroke="#58d6ff" stroke-width="1" opacity="0.09"/>

  <!-- Scatter dots -->
  <circle cx="110" cy="145" r="1.3" fill="#58d6ff" opacity="0.22"/>
  <circle cx="390" cy="75"  r="1.0" fill="#4dffb8" opacity="0.18"/>
  <circle cx="810" cy="95"  r="1.4" fill="#58d6ff" opacity="0.20"/>
  <circle cx="1070" cy="175" r="1.1" fill="#4dffb8" opacity="0.17"/>
  <circle cx="85" cy="710" r="1.2" fill="#4dffb8" opacity="0.19"/>
  <circle cx="1115" cy="660" r="1.3" fill="#58d6ff" opacity="0.22"/>
  <circle cx="350" cy="1090" r="1.0" fill="#4dffb8" opacity="0.15"/>
  <circle cx="870" cy="1070" r="1.2" fill="#58d6ff" opacity="0.18"/>

  <!-- TOP ZONE -->
  <text x="600" y="100" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="22" fill="rgba(88,214,255,0.6)" text-anchor="middle" letter-spacing="5">FUSED DISTRIBUTION</text>
  <line x1="200" y1="120" x2="1000" y2="120" stroke="rgba(88,214,255,0.15)" stroke-width="1"/>
  <text x="600" y="165" font-family="'Trebuchet MS','Segoe UI',sans-serif" font-size="18" fill="rgba(175,198,207,0.55)" text-anchor="middle" letter-spacing="4">SILVER · INVESTING</text>

  <!-- CENTER ZONE: big stat -->
  <text x="600" y="430" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="200" fill="#4dffb8" text-anchor="middle" letter-spacing="2" opacity="0.95">5-15%</text>
  <text x="600" y="490" font-family="'Trebuchet MS','Segoe UI',sans-serif" font-size="24" fill="rgba(175,198,207,0.70)" text-anchor="middle" letter-spacing="2">RECOMMENDED PRECIOUS METALS RANGE</text>
  <text x="600" y="524" font-family="'Trebuchet MS','Segoe UI',sans-serif" font-size="18" fill="rgba(175,198,207,0.40)" text-anchor="middle" letter-spacing="2">OF YOUR TOTAL PORTFOLIO</text>

  <!-- Title block -->
  <text x="600" y="615" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="60" fill="#ecf8fb" text-anchor="middle" letter-spacing="2">HOW MUCH SILVER</text>
  <text x="600" y="684" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="60" fill="#58d6ff" text-anchor="middle" letter-spacing="2">SHOULD YOU OWN?</text>

  <line x1="200" y1="710" x2="1000" y2="710" stroke="rgba(88,214,255,0.12)" stroke-width="1"/>

  <!-- Sub detail -->
  <text x="600" y="770" font-family="'Trebuchet MS','Segoe UI',sans-serif" font-size="20" fill="rgba(175,198,207,0.60)" text-anchor="middle">Silver is 3x more volatile than gold. Size accordingly.</text>
  <text x="600" y="800" font-family="'Trebuchet MS','Segoe UI',sans-serif" font-size="20" fill="rgba(175,198,207,0.60)" text-anchor="middle">Gold-silver ratio above 80 signals silver is cheap vs gold.</text>

  <!-- BOTTOM ZONE: CTA box -->
  <rect x="160" y="1010" width="880" height="100" rx="20" fill="rgba(7,20,28,0.9)" stroke="rgba(77,255,184,0.30)" stroke-width="1.5"/>
  <text x="600" y="1053" font-family="'Trebuchet MS','Segoe UI',sans-serif" font-size="18" fill="rgba(175,198,207,0.6)" text-anchor="middle" letter-spacing="2">FULL BREAKDOWN AT</text>
  <text x="600" y="1085" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="24" fill="#4dffb8" text-anchor="middle" letter-spacing="1">FUSEDDISTRIBUTION.COM</text>
</svg>
