<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow-center" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#58d6ff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#041018" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-tl" cx="5%" cy="5%" r="55%">
      <stop offset="0%" stop-color="#4dffb8" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#041018" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="area-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#58d6ff" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#58d6ff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="line-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58d6ff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#4dffb8"/>
    </linearGradient>
    <filter id="dot-glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="chart-clip">
      <rect x="382" y="202" width="436" height="228"/>
    </clipPath>
  </defs>

  <!-- Base -->
  <rect width="1200" height="630" fill="#041018"/>
  <rect width="1200" height="630" fill="url(#glow-center)"/>
  <rect width="1200" height="630" fill="url(#glow-tl)"/>

  <!-- Grid lines -->
  <line x1="170"  y1="0" x2="170"  y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="340"  y1="0" x2="340"  y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="510"  y1="0" x2="510"  y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="680"  y1="0" x2="680"  y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="850"  y1="0" x2="850"  y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="1020" y1="0" x2="1020" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>

  <!-- Decorative rings -->
  <circle cx="600" cy="315" r="255" fill="none" stroke="#58d6ff" stroke-opacity="0.07" stroke-width="1"/>
  <circle cx="600" cy="315" r="170" fill="none" stroke="#58d6ff" stroke-opacity="0.11" stroke-width="1"/>

  <!-- Scatter dots -->
  <circle cx="285" cy="90"   r="1.5" fill="#58d6ff" fill-opacity="0.22"/>
  <circle cx="412" cy="522"  r="1"   fill="#4dffb8" fill-opacity="0.28"/>
  <circle cx="760" cy="68"   r="1.5" fill="#4dffb8" fill-opacity="0.20"/>
  <circle cx="938" cy="482"  r="1"   fill="#58d6ff" fill-opacity="0.25"/>
  <circle cx="152" cy="352"  r="1.5" fill="#4dffb8" fill-opacity="0.18"/>
  <circle cx="1054" cy="202" r="1"   fill="#58d6ff" fill-opacity="0.30"/>
  <circle cx="506" cy="592"  r="1.5" fill="#58d6ff" fill-opacity="0.15"/>
  <circle cx="826" cy="556"  r="1"   fill="#4dffb8" fill-opacity="0.22"/>
  <circle cx="356" cy="182"  r="1"   fill="#58d6ff" fill-opacity="0.20"/>
  <circle cx="692" cy="586"  r="1.5" fill="#4dffb8" fill-opacity="0.18"/>

  <!-- CENTER: Eyebrow -->
  <text x="600" y="188" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="11" font-weight="700"
        fill="rgba(88,214,255,0.52)" letter-spacing="3.5">CONSISTENT POSTING + AUTOMATION</text>

  <!-- CENTER: Chart container -->
  <rect x="382" y="200" width="436" height="230" rx="12"
        fill="rgba(7,18,28,0.55)" stroke="rgba(88,214,255,0.09)" stroke-width="1"/>

  <!-- CENTER: Chart horizontal grid -->
  <line x1="382" y1="258" x2="818" y2="258" stroke="rgba(88,214,255,0.07)" stroke-width="1"/>
  <line x1="382" y1="316" x2="818" y2="316" stroke="rgba(88,214,255,0.07)" stroke-width="1"/>
  <line x1="382" y1="374" x2="818" y2="374" stroke="rgba(88,214,255,0.07)" stroke-width="1"/>

  <!-- CENTER: Y-axis labels -->
  <text x="376" y="432" text-anchor="end" font-family="Arial, sans-serif" font-size="9"
        fill="rgba(175,198,207,0.40)">0</text>
  <text x="376" y="205" text-anchor="end" font-family="Arial, sans-serif" font-size="9"
        fill="rgba(175,198,207,0.40)">50K</text>

  <!-- CENTER: Area fill -->
  <polygon clip-path="url(#chart-clip)"
           points="382,430 432,416 484,400 538,375 592,346 646,312 700,272 754,236 818,210 818,430"
           fill="url(#area-fill)"/>

  <!-- CENTER: Growth line -->
  <polyline clip-path="url(#chart-clip)"
            points="382,430 432,416 484,400 538,375 592,346 646,312 700,272 754,236 818,210"
            fill="none" stroke="url(#line-grad)" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- CENTER: Endpoint -->
  <circle cx="818" cy="210" r="9" fill="rgba(77,255,184,0.14)" filter="url(#dot-glow)"/>
  <circle cx="818" cy="210" r="4" fill="#4dffb8"/>
  <text x="808" y="200" text-anchor="end"
        font-family="Impact, 'Arial Narrow Bold', sans-serif" font-size="17"
        fill="#4dffb8">+47K</text>

  <!-- CENTER: X-axis label -->
  <text x="600" y="450" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="9" font-weight="700"
        fill="rgba(88,214,255,0.38)" letter-spacing="2">FOLLOWERS OVER TIME</text>

  <!-- CENTER: Headline below chart -->
  <text x="600" y="490" text-anchor="middle"
        font-family="Impact, 'Arial Narrow Bold', sans-serif" font-size="30" letter-spacing="5"
        fill="rgba(236,248,251,0.90)">GROW YOUR FACEBOOK FOLLOWING</text>

  <text x="600" y="512" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="12"
        fill="rgba(175,198,207,0.52)" letter-spacing="2">SCHEDULE &nbsp; · &nbsp; AUTOMATE &nbsp; · &nbsp; MONETIZE</text>

  <!-- ── TOP-LEFT CARD (42, 95) ── -->
  <rect x="42" y="95" width="295" height="168" rx="16"
        fill="rgba(11,24,32,0.90)" stroke="rgba(88,214,255,0.20)" stroke-width="1"/>
  <text x="68" y="124" font-family="Arial, sans-serif" font-size="10" font-weight="700"
        fill="rgba(88,214,255,0.70)" letter-spacing="1.5">FACEBOOK GLOBAL REACH</text>
  <line x1="68" y1="132" x2="309" y2="132" stroke="rgba(88,214,255,0.12)" stroke-width="1"/>
  <text x="68" y="160" font-family="Arial, sans-serif" font-size="11"
        fill="rgba(175,198,207,0.72)">Monthly active users worldwide:</text>
  <text x="68" y="208" font-family="Impact, 'Arial Narrow Bold', sans-serif" font-size="50"
        fill="#58d6ff">3B+</text>
  <text x="68" y="232" font-family="Arial, sans-serif" font-size="11"
        fill="rgba(175,198,207,0.72)">Still the largest social platform</text>
  <text x="68" y="253" font-family="Arial, sans-serif" font-size="9"
        fill="rgba(88,214,255,0.38)" letter-spacing="1">META Q4 2024 EARNINGS REPORT</text>

  <!-- ── TOP-RIGHT CARD (863, 95) ── -->
  <rect x="863" y="95" width="295" height="168" rx="16"
        fill="rgba(11,24,32,0.90)" stroke="rgba(77,255,184,0.18)" stroke-width="1"/>
  <text x="889" y="124" font-family="Arial, sans-serif" font-size="10" font-weight="700"
        fill="rgba(77,255,184,0.70)" letter-spacing="1.5">POSTING FREQUENCY LIFT</text>
  <line x1="889" y1="132" x2="1130" y2="132" stroke="rgba(77,255,184,0.10)" stroke-width="1"/>
  <text x="889" y="160" font-family="Arial, sans-serif" font-size="11"
        fill="rgba(175,198,207,0.72)">Daily vs. weekly: more reach per post</text>
  <text x="889" y="212" font-family="Impact, 'Arial Narrow Bold', sans-serif" font-size="54"
        fill="#4dffb8">6×</text>
  <text x="889" y="236" font-family="Arial, sans-serif" font-size="11"
        fill="rgba(175,198,207,0.72)">more organic reach on average</text>
  <text x="889" y="253" font-family="Arial, sans-serif" font-size="9"
        fill="rgba(88,214,255,0.38)" letter-spacing="1">SOCIAL MEDIA TODAY / META ANALYTICS</text>

  <!-- ── BOTTOM-LEFT CARD (42, 388) ── -->
  <rect x="42" y="390" width="295" height="150" rx="16"
        fill="rgba(11,24,32,0.90)" stroke="rgba(88,214,255,0.20)" stroke-width="1"/>
  <text x="68" y="418" font-family="Arial, sans-serif" font-size="10" font-weight="700"
        fill="rgba(88,214,255,0.70)" letter-spacing="1.5">FACEBOOK LEAD ADS</text>
  <line x1="68" y1="426" x2="309" y2="426" stroke="rgba(88,214,255,0.12)" stroke-width="1"/>
  <text x="68" y="454" font-family="Arial, sans-serif" font-size="11"
        fill="rgba(175,198,207,0.72)">Avg. conversion rate:</text>
  <text x="68" y="496" font-family="Impact, 'Arial Narrow Bold', sans-serif" font-size="46"
        fill="#58d6ff">~12%</text>
  <text x="68" y="518" font-family="Arial, sans-serif" font-size="11"
        fill="rgba(175,198,207,0.72)">vs. 2.4% avg. landing page</text>
  <text x="68" y="532" font-family="Arial, sans-serif" font-size="9"
        fill="rgba(88,214,255,0.38)" letter-spacing="1">WORDSTREAM INDUSTRY BENCHMARKS</text>

  <!-- ── BOTTOM-RIGHT CARD (863, 388) ── -->
  <rect x="863" y="390" width="295" height="150" rx="16"
        fill="rgba(11,24,32,0.90)" stroke="rgba(77,255,184,0.18)" stroke-width="1"/>
  <text x="889" y="418" font-family="Arial, sans-serif" font-size="10" font-weight="700"
        fill="rgba(77,255,184,0.70)" letter-spacing="1.5">RETARGETING WINDOW</text>
  <line x1="889" y1="426" x2="1130" y2="426" stroke="rgba(77,255,184,0.10)" stroke-width="1"/>
  <text x="889" y="454" font-family="Arial, sans-serif" font-size="11"
        fill="rgba(175,198,207,0.72)">Retarget page engagers up to:</text>
  <text x="889" y="496" font-family="Impact, 'Arial Narrow Bold', sans-serif" font-size="46"
        fill="#4dffb8">365</text>
  <text x="889" y="518" font-family="Impact, 'Arial Narrow Bold', sans-serif" font-size="18"
        fill="rgba(236,248,251,0.70)">DAYS</text>
  <text x="889" y="532" font-family="Arial, sans-serif" font-size="9"
        fill="rgba(88,214,255,0.38)" letter-spacing="1">META ADS CUSTOM AUDIENCES</text>
</svg>
