<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow-center" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#58d6ff" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#041018" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-tl" cx="5%" cy="5%" r="55%">
      <stop offset="0%" stop-color="#4dffb8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#041018" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="free-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58d6ff"/>
      <stop offset="100%" stop-color="#4dffb8"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58d6ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4dffb8" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="text-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base -->
  <rect width="1200" height="630" fill="#041018"/>
  <rect width="1200" height="630" fill="url(#glow-center)"/>
  <rect width="1200" height="630" fill="url(#glow-tl)"/>

  <!-- Grid lines -->
  <line x1="170" y1="0" x2="170" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="340" y1="0" x2="340" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="510" y1="0" x2="510" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="680" y1="0" x2="680" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="850" y1="0" x2="850" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="1020" y1="0" x2="1020" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>

  <!-- Decorative rings -->
  <circle cx="600" cy="315" r="255" fill="none" stroke="#58d6ff" stroke-opacity="0.07" stroke-width="1"/>
  <circle cx="600" cy="315" r="170" fill="none" stroke="#58d6ff" stroke-opacity="0.11" stroke-width="1"/>

  <!-- Scatter dots -->
  <circle cx="282" cy="88"  r="1.5" fill="#58d6ff" fill-opacity="0.22"/>
  <circle cx="418" cy="520" r="1"   fill="#4dffb8" fill-opacity="0.28"/>
  <circle cx="764" cy="72"  r="1.5" fill="#4dffb8" fill-opacity="0.20"/>
  <circle cx="940" cy="480" r="1"   fill="#58d6ff" fill-opacity="0.25"/>
  <circle cx="150" cy="358" r="1.5" fill="#4dffb8" fill-opacity="0.18"/>
  <circle cx="1056" cy="200" r="1"  fill="#58d6ff" fill-opacity="0.30"/>
  <circle cx="504" cy="594" r="1.5" fill="#58d6ff" fill-opacity="0.15"/>
  <circle cx="830" cy="560" r="1"   fill="#4dffb8" fill-opacity="0.22"/>
  <circle cx="354" cy="180" r="1"   fill="#58d6ff" fill-opacity="0.20"/>
  <circle cx="690" cy="590" r="1.5" fill="#4dffb8" fill-opacity="0.18"/>

  <!-- CENTER DISPLAY -->
  <!-- Eyebrow label -->
  <text x="600" y="218" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="12" font-weight="700"
        fill="rgba(88,214,255,0.55)" letter-spacing="3.5">ZERO PRICE EFFECT</text>

  <!-- Main FREE text with glow -->
  <text x="600" y="370" text-anchor="middle"
        font-family="Impact, 'Arial Narrow Bold', sans-serif"
        font-size="168" letter-spacing="14"
        fill="url(#free-grad)" filter="url(#text-glow)">FREE</text>

  <!-- Subtitle -->
  <text x="600" y="408" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="13"
        fill="rgba(175,198,207,0.58)" letter-spacing="2">THE PRICE POINT THAT CHANGES BUYING BEHAVIOR</text>

  <!-- Accent line -->
  <rect x="448" y="418" width="304" height="1" rx="0.5" fill="url(#accent-line)"/>

  <!-- ── TOP-LEFT CARD (42, 95) ── -->
  <rect x="42" y="95" width="295" height="172" rx="16"
        fill="rgba(11,24,32,0.90)" stroke="rgba(88,214,255,0.20)" stroke-width="1"/>
  <text x="68" y="124" font-family="Arial, sans-serif" font-size="10" font-weight="700"
        fill="rgba(88,214,255,0.70)" letter-spacing="1.5">ARIELY EXPERIMENT · 2007</text>
  <line x1="68" y1="132" x2="309" y2="132" stroke="rgba(88,214,255,0.12)" stroke-width="1"/>
  <text x="68" y="157" font-family="Arial, sans-serif" font-size="11"
        fill="rgba(175,198,207,0.72)">Kiss priced at 1¢ — chose it:</text>
  <text x="68" y="185" font-family="Impact, 'Arial Narrow Bold', sans-serif" font-size="30"
        fill="rgba(236,248,251,0.82)">27%</text>
  <text x="68" y="210" font-family="Arial, sans-serif" font-size="11"
        fill="rgba(175,198,207,0.72)">Kiss priced FREE — chose it:</text>
  <text x="68" y="238" font-family="Impact, 'Arial Narrow Bold', sans-serif" font-size="30"
        fill="#4dffb8">69%</text>
  <text x="68" y="258" font-family="Arial, sans-serif" font-size="9"
        fill="rgba(88,214,255,0.38)" letter-spacing="1">MARKETING SCIENCE, VOL. 26 NO. 6</text>

  <!-- ── TOP-RIGHT CARD (863, 95) ── -->
  <rect x="863" y="95" width="295" height="172" rx="16"
        fill="rgba(11,24,32,0.90)" stroke="rgba(77,255,184,0.18)" stroke-width="1"/>
  <text x="889" y="124" font-family="Arial, sans-serif" font-size="10" font-weight="700"
        fill="rgba(77,255,184,0.70)" letter-spacing="1.5">AMAZON PRIME FREE TRIAL</text>
  <line x1="889" y1="132" x2="1130" y2="132" stroke="rgba(77,255,184,0.10)" stroke-width="1"/>
  <text x="889" y="160" font-family="Arial, sans-serif" font-size="11"
        fill="rgba(175,198,207,0.72)">Trial users who went paid:</text>
  <text x="889" y="210" font-family="Impact, 'Arial Narrow Bold', sans-serif" font-size="52"
        fill="#4dffb8">73%</text>
  <text x="889" y="234" font-family="Arial, sans-serif" font-size="11"
        fill="rgba(175,198,207,0.72)">vs. ~20% industry average</text>
  <text x="889" y="258" font-family="Arial, sans-serif" font-size="9"
        fill="rgba(88,214,255,0.38)" letter-spacing="1">CIRP CONSUMER RESEARCH, 2019</text>

  <!-- ── BOTTOM-LEFT CARD (42, 390) ── -->
  <rect x="42" y="388" width="295" height="152" rx="16"
        fill="rgba(11,24,32,0.90)" stroke="rgba(88,214,255,0.20)" stroke-width="1"/>
  <text x="68" y="416" font-family="Arial, sans-serif" font-size="10" font-weight="700"
        fill="rgba(88,214,255,0.70)" letter-spacing="1.5">IN-STORE SAMPLING</text>
  <line x1="68" y1="424" x2="309" y2="424" stroke="rgba(88,214,255,0.12)" stroke-width="1"/>
  <text x="68" y="450" font-family="Arial, sans-serif" font-size="11"
        fill="rgba(175,198,207,0.72)">Avg. sales lift on sampled items:</text>
  <text x="68" y="494" font-family="Impact, 'Arial Narrow Bold', sans-serif" font-size="46"
        fill="#58d6ff">2 – 4×</text>
  <text x="68" y="518" font-family="Arial, sans-serif" font-size="11"
        fill="rgba(175,198,207,0.72)">vs. non-sampled periods</text>
  <text x="68" y="532" font-family="Arial, sans-serif" font-size="9"
        fill="rgba(88,214,255,0.38)" letter-spacing="1">ACNIELSEN RETAIL RESEARCH</text>

  <!-- ── BOTTOM-RIGHT CARD (863, 388) ── -->
  <rect x="863" y="388" width="295" height="152" rx="16"
        fill="rgba(11,24,32,0.90)" stroke="rgba(77,255,184,0.18)" stroke-width="1"/>
  <text x="889" y="416" font-family="Arial, sans-serif" font-size="10" font-weight="700"
        fill="rgba(77,255,184,0.70)" letter-spacing="1.5">LOSS LEADER MATH</text>
  <line x1="889" y1="424" x2="1130" y2="424" stroke="rgba(77,255,184,0.10)" stroke-width="1"/>
  <text x="889" y="452" font-family="Arial, sans-serif" font-size="11"
        fill="rgba(175,198,207,0.72)">Cost to give it away:</text>
  <text x="889" y="486" font-family="Impact, 'Arial Narrow Bold', sans-serif" font-size="40"
        fill="#58d6ff">$5 – $20</text>
  <text x="889" y="510" font-family="Arial, sans-serif" font-size="11"
        fill="rgba(175,198,207,0.72)">Customer lifetime value:</text>
  <text x="889" y="532" font-family="Impact, 'Arial Narrow Bold', sans-serif" font-size="24"
        fill="#4dffb8">$200 – $2,000+</text>
</svg>
