<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" width="1200" height="630">
  <defs>
    <radialGradient id="bgTopLeft" cx="15%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#58d6ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#58d6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgBottomRight" cx="85%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#4dffb8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#4dffb8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58d6ff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#4dffb8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#58d6ff" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4dffb8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4dffb8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="avgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5d97a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f5d97a" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="buyGlow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lineGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowDown" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto">
      <polygon points="0,0 8,0 4,6" fill="#4dffb8" opacity="0.85"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#07131a"/>
  <rect width="1200" height="630" fill="url(#bgTopLeft)"/>
  <rect width="1200" height="630" fill="url(#bgBottomRight)"/>

  <!-- Chart area background -->
  <rect x="80" y="110" width="1040" height="360" rx="16" fill="rgba(7,18,26,0.7)" stroke="rgba(88,214,255,0.08)" stroke-width="1"/>

  <!-- Horizontal grid lines inside chart -->
  <line x1="80" y1="200" x2="1120" y2="200" stroke="rgba(88,214,255,0.06)" stroke-width="1"/>
  <line x1="80" y1="270" x2="1120" y2="270" stroke="rgba(88,214,255,0.06)" stroke-width="1"/>
  <line x1="80" y1="340" x2="1120" y2="340" stroke="rgba(88,214,255,0.06)" stroke-width="1"/>
  <line x1="80" y1="410" x2="1120" y2="410" stroke="rgba(88,214,255,0.06)" stroke-width="1"/>

  <!-- Y-axis labels -->
  <text x="68" y="204" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="rgba(175,198,207,0.4)" letter-spacing="0.04em">$35</text>
  <text x="68" y="274" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="rgba(175,198,207,0.4)" letter-spacing="0.04em">$28</text>
  <text x="68" y="344" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="rgba(175,198,207,0.4)" letter-spacing="0.04em">$22</text>
  <text x="68" y="414" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="rgba(175,198,207,0.4)" letter-spacing="0.04em">$16</text>

  <!-- Y-axis label -->
  <text x="38" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="rgba(175,198,207,0.3)" letter-spacing="0.1em" transform="rotate(-90,38,295)">SILVER PRICE / OZ</text>

  <!-- Price area fill (below the line) -->
  <!-- Path follows the price line then closes down to baseline -->
  <path d="M 130,360  C 180,330 220,290 265,260  C 310,230 335,295 380,340  C 425,385 460,310 510,255  C 560,200 590,230 640,210  C 690,190 720,280 770,310  C 820,340 855,260 905,215  C 950,175 980,220 1030,200  C 1065,187 1085,205 1090,205  L 1090,470  L 130,470 Z" fill="url(#areaGrad)"/>

  <!-- Price line -->
  <path d="M 130,360  C 180,330 220,290 265,260  C 310,230 335,295 380,340  C 425,385 460,310 510,255  C 560,200 590,230 640,210  C 690,190 720,280 770,310  C 820,340 855,260 905,215  C 950,175 980,220 1030,200  C 1065,187 1085,205 1090,205" fill="none" stroke="url(#lineGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#lineGlow)"/>

  <!-- Average cost line (horizontal dashed, gold color) -->
  <!-- Average of the buy points roughly at y=290 -->
  <line x1="130" y1="290" x2="1090" y2="290" stroke="rgba(245,215,100,0.45)" stroke-width="1.5" stroke-dasharray="10,6"/>

  <!-- AVG COST label -->
  <rect x="82" y="278" width="90" height="22" rx="5" fill="rgba(245,215,100,0.08)"/>
  <text x="127" y="293" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(245,215,100,0.7)" font-weight="800" letter-spacing="0.12em">AVG COST</text>

  <!-- Buy points: 6 regular vertical markers with arrows -->
  <!-- Buy point 1: x=130, price at line=360 -->
  <line x1="130" y1="362" x2="130" y2="430" stroke="rgba(77,255,184,0.5)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="122,428 138,428 130,440" fill="#4dffb8" opacity="0.8" filter="url(#buyGlow)"/>
  <circle cx="130" cy="360" r="6" fill="#4dffb8" opacity="0.9" filter="url(#buyGlow)"/>
  <circle cx="130" cy="360" r="3" fill="#07131a"/>
  <text x="130" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(77,255,184,0.65)" font-weight="800" letter-spacing="0.1em">BUY</text>
  <text x="130" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(77,255,184,0.45)" letter-spacing="0.06em">MO.1</text>

  <!-- Buy point 2: x=317, price=330 -->
  <line x1="317" y1="296" x2="317" y2="430" stroke="rgba(77,255,184,0.5)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="309,428 325,428 317,440" fill="#4dffb8" opacity="0.8" filter="url(#buyGlow)"/>
  <circle cx="317" cy="293" r="6" fill="#4dffb8" opacity="0.9" filter="url(#buyGlow)"/>
  <circle cx="317" cy="293" r="3" fill="#07131a"/>
  <text x="317" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(77,255,184,0.65)" font-weight="800" letter-spacing="0.1em">BUY</text>
  <text x="317" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(77,255,184,0.45)" letter-spacing="0.06em">MO.3</text>

  <!-- Buy point 3: x=510, price=255 -->
  <line x1="510" y1="257" x2="510" y2="430" stroke="rgba(77,255,184,0.5)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="502,428 518,428 510,440" fill="#4dffb8" opacity="0.8" filter="url(#buyGlow)"/>
  <circle cx="510" cy="255" r="6" fill="#4dffb8" opacity="0.9" filter="url(#buyGlow)"/>
  <circle cx="510" cy="255" r="3" fill="#07131a"/>
  <text x="510" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(77,255,184,0.65)" font-weight="800" letter-spacing="0.1em">BUY</text>
  <text x="510" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(77,255,184,0.45)" letter-spacing="0.06em">MO.5</text>

  <!-- Buy point 4: x=700, price=210 -->
  <line x1="700" y1="212" x2="700" y2="430" stroke="rgba(77,255,184,0.5)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="692,428 708,428 700,440" fill="#4dffb8" opacity="0.8" filter="url(#buyGlow)"/>
  <circle cx="700" cy="210" r="6" fill="#4dffb8" opacity="0.9" filter="url(#buyGlow)"/>
  <circle cx="700" cy="210" r="3" fill="#07131a"/>
  <text x="700" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(77,255,184,0.65)" font-weight="800" letter-spacing="0.1em">BUY</text>
  <text x="700" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(77,255,184,0.45)" letter-spacing="0.06em">MO.7</text>

  <!-- Buy point 5: x=883, price=225 -->
  <line x1="883" y1="227" x2="883" y2="430" stroke="rgba(77,255,184,0.5)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="875,428 891,428 883,440" fill="#4dffb8" opacity="0.8" filter="url(#buyGlow)"/>
  <circle cx="883" cy="224" r="6" fill="#4dffb8" opacity="0.9" filter="url(#buyGlow)"/>
  <circle cx="883" cy="224" r="3" fill="#07131a"/>
  <text x="883" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(77,255,184,0.65)" font-weight="800" letter-spacing="0.1em">BUY</text>
  <text x="883" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(77,255,184,0.45)" letter-spacing="0.06em">MO.9</text>

  <!-- Buy point 6: x=1090, price=205 -->
  <line x1="1090" y1="207" x2="1090" y2="430" stroke="rgba(77,255,184,0.5)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="1082,428 1098,428 1090,440" fill="#4dffb8" opacity="0.8" filter="url(#buyGlow)"/>
  <circle cx="1090" cy="205" r="6" fill="#4dffb8" opacity="0.9" filter="url(#buyGlow)"/>
  <circle cx="1090" cy="205" r="3" fill="#07131a"/>
  <text x="1090" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(77,255,184,0.65)" font-weight="800" letter-spacing="0.1em">BUY</text>
  <text x="1090" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="rgba(77,255,184,0.45)" letter-spacing="0.06em">MO.11</text>

  <!-- Title area above chart -->
  <!-- Eyebrow -->
  <rect x="80" y="54" width="230" height="30" rx="15" fill="rgba(88,214,255,0.08)" stroke="rgba(88,214,255,0.2)" stroke-width="1"/>
  <text x="195" y="74" text-anchor="middle" font-family="'Trebuchet MS', Arial, sans-serif" font-size="12" fill="rgba(88,214,255,0.8)" font-weight="800" letter-spacing="0.18em">SILVER · INVESTING</text>

  <!-- Main title -->
  <text x="600" y="72" text-anchor="middle" font-family="Impact, 'Arial Narrow Bold', Arial, sans-serif" font-size="38" fill="#ecf8fb" letter-spacing="0.06em">DOLLAR COST AVERAGING</text>

  <!-- Chart title top-right -->
  <text x="1120" y="135" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="rgba(175,198,207,0.3)" letter-spacing="0.14em" font-weight="700">SILVER PRICE OVER TIME (ILLUSTRATIVE)</text>

  <!-- Legend -->
  <line x1="82" y1="510" x2="120" y2="510" stroke="url(#lineGrad)" stroke-width="2.5"/>
  <text x="128" y="514" text-anchor="start" font-family="Arial, sans-serif" font-size="11" fill="rgba(175,198,207,0.6)" letter-spacing="0.06em">Market price</text>

  <line x1="240" y1="510" x2="278" y2="510" stroke="rgba(245,215,100,0.55)" stroke-width="1.5" stroke-dasharray="8,5"/>
  <text x="286" y="514" text-anchor="start" font-family="Arial, sans-serif" font-size="11" fill="rgba(175,198,207,0.6)" letter-spacing="0.06em">Average cost basis</text>

  <circle cx="460" cy="510" r="5" fill="#4dffb8" opacity="0.85"/>
  <text x="472" y="514" text-anchor="start" font-family="Arial, sans-serif" font-size="11" fill="rgba(175,198,207,0.6)" letter-spacing="0.06em">Fixed-interval purchase</text>

  <!-- Branding bottom right -->
  <text x="1120" y="600" text-anchor="end" font-family="'Trebuchet MS', Arial, sans-serif" font-size="11" fill="rgba(175,198,207,0.2)" letter-spacing="0.16em" font-weight="700">FUSEDDISTRIBUTION.COM</text>
</svg>
