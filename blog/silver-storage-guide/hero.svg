<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" aria-label="Four risk stat cards showing silver storage threats: theft at 10 to 12 minutes, fire at 1763 degrees Fahrenheit, discovery at 65 percent known persons, and moisture tarnish warning, surrounding a large central 4">
  <defs>
    <radialGradient id="glow-c" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58d6ff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#58d6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-tl" cx="0%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#4dffb8" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#4dffb8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="num-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#58d6ff"/>
      <stop offset="100%" stop-color="#4dffb8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#041018"/>

  <!-- Glows -->
  <ellipse cx="600" cy="315" rx="400" ry="270" fill="url(#glow-c)"/>
  <ellipse cx="0" cy="0" rx="360" ry="310" fill="url(#glow-tl)"/>

  <!-- Grid lines -->
  <line x1="170" y1="0" x2="170" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="340" y1="0" x2="340" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="510" y1="0" x2="510" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="680" y1="0" x2="680" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="850" y1="0" x2="850" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="1020" y1="0" x2="1020" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>

  <!-- Decorative rings -->
  <circle cx="600" cy="315" r="255" fill="none" stroke="#58d6ff" stroke-width="1" stroke-opacity="0.07"/>
  <circle cx="600" cy="315" r="170" fill="none" stroke="#58d6ff" stroke-width="1" stroke-opacity="0.11"/>

  <!-- Scatter dots -->
  <circle cx="120" cy="80"  r="1.5" fill="#58d6ff" opacity="0.25"/>
  <circle cx="385" cy="48"  r="1"   fill="#4dffb8" opacity="0.20"/>
  <circle cx="740" cy="28"  r="1.5" fill="#58d6ff" opacity="0.18"/>
  <circle cx="1055" cy="95" r="1"   fill="#4dffb8" opacity="0.22"/>
  <circle cx="225" cy="552" r="1.5" fill="#58d6ff" opacity="0.20"/>
  <circle cx="895" cy="578" r="1"   fill="#4dffb8" opacity="0.25"/>
  <circle cx="480" cy="598" r="1.5" fill="#58d6ff" opacity="0.15"/>
  <circle cx="1098" cy="318" r="1"  fill="#58d6ff" opacity="0.20"/>
  <circle cx="58"  cy="400" r="1.5" fill="#4dffb8" opacity="0.18"/>
  <circle cx="660" cy="592" r="1"   fill="#58d6ff" opacity="0.22"/>
  <circle cx="310" cy="595" r="1"   fill="#4dffb8" opacity="0.17"/>
  <circle cx="920" cy="42"  r="1.5" fill="#58d6ff" opacity="0.19"/>

  <!-- Center: eyebrow label -->
  <text x="600" y="210" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="12" font-weight="800"
        letter-spacing="4" fill="rgba(175,198,207,0.55)">HOW TO STORE SILVER</text>

  <!-- Center: large "4" -->
  <text x="600" y="378" text-anchor="middle"
        font-family="Impact, 'Arial Narrow Bold', sans-serif" font-size="200"
        fill="url(#num-grad)" opacity="0.92">4</text>

  <!-- Center: sublabel -->
  <text x="600" y="412" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="12" font-weight="800"
        letter-spacing="4" fill="rgba(88,214,255,0.55)">RISKS TO KNOW</text>

  <!-- Top-left card: THEFT (42, 138) -->
  <rect x="42" y="138" width="295" height="162" rx="16"
        fill="rgba(11,24,32,0.90)" stroke="rgba(88,214,255,0.20)" stroke-width="1"/>
  <text x="70" y="174" font-family="Arial, sans-serif" font-size="10" font-weight="800"
        fill="rgba(88,214,255,0.58)" letter-spacing="2">THEFT</text>
  <text x="70" y="218" font-family="Impact, 'Arial Narrow Bold', sans-serif" font-size="46"
        fill="rgba(236,248,251,0.95)">10-12</text>
  <text x="70" y="237" font-family="Arial, sans-serif" font-size="11"
        fill="rgba(175,198,207,0.78)">minutes avg. burglar</text>
  <text x="70" y="254" font-family="Arial, sans-serif" font-size="11"
        fill="rgba(175,198,207,0.78)">spends inside your home</text>
  <text x="70" y="280" font-family="Arial, sans-serif" font-size="9"
        fill="rgba(88,214,255,0.38)" letter-spacing="1.5">SAFEHOME.ORG</text>

  <!-- Top-right card: DISCOVERY (863, 138) -->
  <rect x="863" y="138" width="295" height="162" rx="16"
        fill="rgba(11,24,32,0.90)" stroke="rgba(88,214,255,0.20)" stroke-width="1"/>
  <text x="891" y="174" font-family="Arial, sans-serif" font-size="10" font-weight="800"
        fill="rgba(88,214,255,0.58)" letter-spacing="2">DISCOVERY</text>
  <text x="891" y="218" font-family="Impact, 'Arial Narrow Bold', sans-serif" font-size="46"
        fill="rgba(236,248,251,0.95)">65%</text>
  <text x="891" y="237" font-family="Arial, sans-serif" font-size="11"
        fill="rgba(175,198,207,0.78)">of caught burglars were</text>
  <text x="891" y="254" font-family="Arial, sans-serif" font-size="11"
        fill="rgba(175,198,207,0.78)">known to the victim</text>
  <text x="891" y="280" font-family="Arial, sans-serif" font-size="9"
        fill="rgba(88,214,255,0.38)" letter-spacing="1.5">FBI / THE ZEBRA 2026</text>

  <!-- Bottom-left card: FIRE (55, 420) -->
  <rect x="55" y="420" width="295" height="162" rx="16"
        fill="rgba(11,24,32,0.90)" stroke="rgba(88,214,255,0.20)" stroke-width="1"/>
  <text x="83" y="456" font-family="Arial, sans-serif" font-size="10" font-weight="800"
        fill="rgba(88,214,255,0.58)" letter-spacing="2">FIRE</text>
  <text x="83" y="500" font-family="Impact, 'Arial Narrow Bold', sans-serif" font-size="46"
        fill="rgba(236,248,251,0.95)">1,763°F</text>
  <text x="83" y="519" font-family="Arial, sans-serif" font-size="11"
        fill="rgba(175,198,207,0.78)">silver's melting point —</text>
  <text x="83" y="536" font-family="Arial, sans-serif" font-size="11"
        fill="rgba(175,198,207,0.78)">house fires can reach this</text>
  <text x="83" y="562" font-family="Arial, sans-serif" font-size="9"
        fill="rgba(88,214,255,0.38)" letter-spacing="1.5">METALS MINT</text>

  <!-- Bottom-right card: MOISTURE (877, 420) -->
  <rect x="877" y="420" width="295" height="162" rx="16"
        fill="rgba(11,24,32,0.90)" stroke="rgba(88,214,255,0.20)" stroke-width="1"/>
  <text x="905" y="456" font-family="Arial, sans-serif" font-size="10" font-weight="800"
        fill="rgba(88,214,255,0.58)" letter-spacing="2">MOISTURE</text>
  <text x="905" y="500" font-family="Impact, 'Arial Narrow Bold', sans-serif" font-size="40"
        fill="rgba(236,248,251,0.95)">TARNISH</text>
  <text x="905" y="519" font-family="Arial, sans-serif" font-size="11"
        fill="rgba(175,198,207,0.78)">cosmetic for bullion, but</text>
  <text x="905" y="536" font-family="Arial, sans-serif" font-size="11"
        fill="rgba(175,198,207,0.78)">matters for collectible coins</text>
  <text x="905" y="562" font-family="Arial, sans-serif" font-size="9"
        fill="rgba(88,214,255,0.38)" letter-spacing="1.5">SILVER STORAGE BASICS</text>
</svg>
