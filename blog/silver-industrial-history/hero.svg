<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow-center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58d6ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#58d6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-topleft" cx="0%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#4dffb8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4dffb8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1e2a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#071318" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="bar-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58d6ff"/>
      <stop offset="100%" stop-color="#4dffb8"/>
    </linearGradient>
    <linearGradient id="bar-dim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4dffb8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#58d6ff" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#041018"/>
  <rect width="1200" height="630" fill="url(#glow-center)"/>
  <rect width="1200" height="630" fill="url(#glow-topleft)"/>

  <!-- Grid lines -->
  <line x1="170" y1="0" x2="170" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="340" y1="0" x2="340" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="510" y1="0" x2="510" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="680" y1="0" x2="680" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="850" y1="0" x2="850" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="1020" y1="0" x2="1020" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>

  <!-- Rings -->
  <circle cx="600" cy="315" r="255" fill="none" stroke="#58d6ff" stroke-width="1" opacity="0.07"/>
  <circle cx="600" cy="315" r="170" fill="none" stroke="#58d6ff" stroke-width="1" opacity="0.11"/>

  <!-- Scatter dots -->
  <circle cx="118" cy="76" r="1.5" fill="#58d6ff" opacity="0.22"/>
  <circle cx="382" cy="58" r="1" fill="#4dffb8" opacity="0.18"/>
  <circle cx="752" cy="84" r="1.5" fill="#58d6ff" opacity="0.20"/>
  <circle cx="948" cy="106" r="1" fill="#4dffb8" opacity="0.25"/>
  <circle cx="1072" cy="68" r="1.5" fill="#58d6ff" opacity="0.17"/>
  <circle cx="222" cy="532" r="1" fill="#4dffb8" opacity="0.19"/>
  <circle cx="840" cy="544" r="1.5" fill="#58d6ff" opacity="0.21"/>
  <circle cx="1044" cy="498" r="1" fill="#58d6ff" opacity="0.16"/>
  <circle cx="468" cy="568" r="1" fill="#4dffb8" opacity="0.20"/>
  <circle cx="658" cy="96" r="1" fill="#58d6ff" opacity="0.15"/>

  <!-- LEFT STAT CARD: 654M oz -->
  <rect x="42" y="162" width="278" height="306" rx="18" fill="url(#card-bg)" stroke="#58d6ff" stroke-width="1" stroke-opacity="0.18"/>
  <text x="181" y="218" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="11" font-weight="800" letter-spacing="0.12em" fill="#58d6ff" opacity="0.7">2023 INDUSTRIAL DEMAND</text>
  <text x="181" y="300" text-anchor="middle" font-family="Impact, Haettenschweiler, Arial Narrow Bold, sans-serif" font-size="64" letter-spacing="0.02em" fill="#58d6ff">654M</text>
  <text x="181" y="332" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="14" fill="rgba(175,198,207,0.8)" letter-spacing="0.04em">troy ounces</text>
  <text x="181" y="356" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="13" fill="rgba(175,198,207,0.55)" letter-spacing="0.04em">a new record</text>
  <line x1="66" y1="378" x2="296" y2="378" stroke="rgba(88,214,255,0.15)" stroke-width="1"/>
  <text x="181" y="400" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="11" fill="rgba(175,198,207,0.45)" letter-spacing="0.04em">Silver Institute, 2024</text>

  <!-- CENTER: Industrial breakdown + headline -->
  <!-- Mini demand breakdown bars -->
  <text x="600" y="196" text-anchor="middle" font-family="Impact, Haettenschweiler, Arial Narrow Bold, sans-serif" font-size="13" letter-spacing="0.12em" fill="rgba(88,214,255,0.7)">DEMAND BY APPLICATION</text>

  <!-- Electronics 38% -->
  <text x="470" y="230" font-family="Trebuchet MS, sans-serif" font-size="11" fill="rgba(175,198,207,0.55)" font-weight="700" letter-spacing="0.06em">ELECTRONICS</text>
  <rect x="566" y="219" width="166" height="14" rx="7" fill="rgba(88,214,255,0.08)"/>
  <rect x="566" y="219" width="63" height="14" rx="7" fill="url(#bar-grad)"/>
  <text x="734" y="231" font-family="Trebuchet MS, sans-serif" font-size="11" font-weight="700" fill="#ecf8fb">38%</text>

  <!-- Solar 25% -->
  <text x="470" y="258" font-family="Trebuchet MS, sans-serif" font-size="11" fill="rgba(175,198,207,0.55)" font-weight="700" letter-spacing="0.06em">SOLAR ENERGY</text>
  <rect x="566" y="247" width="166" height="14" rx="7" fill="rgba(88,214,255,0.08)"/>
  <rect x="566" y="247" width="41" height="14" rx="7" fill="url(#bar-dim)"/>
  <text x="734" y="259" font-family="Trebuchet MS, sans-serif" font-size="11" font-weight="700" fill="#ecf8fb">25%</text>

  <!-- Other 25% -->
  <text x="470" y="286" font-family="Trebuchet MS, sans-serif" font-size="11" fill="rgba(175,198,207,0.55)" font-weight="700" letter-spacing="0.06em">OTHER INDUSTRIAL</text>
  <rect x="566" y="275" width="166" height="14" rx="7" fill="rgba(88,214,255,0.08)"/>
  <rect x="566" y="275" width="41" height="14" rx="7" fill="rgba(88,214,255,0.35)"/>
  <text x="734" y="287" font-family="Trebuchet MS, sans-serif" font-size="11" font-weight="700" fill="#ecf8fb">25%</text>

  <!-- Photography 2% -->
  <text x="470" y="314" font-family="Trebuchet MS, sans-serif" font-size="11" fill="rgba(175,198,207,0.55)" font-weight="700" letter-spacing="0.06em">PHOTOGRAPHY</text>
  <rect x="566" y="303" width="166" height="14" rx="7" fill="rgba(88,214,255,0.08)"/>
  <rect x="566" y="303" width="4" height="14" rx="7" fill="rgba(88,214,255,0.22)"/>
  <text x="734" y="315" font-family="Trebuchet MS, sans-serif" font-size="11" font-weight="700" fill="#ecf8fb">2%</text>

  <!-- Center headline -->
  <text x="600" y="373" text-anchor="middle" font-family="Impact, Haettenschweiler, Arial Narrow Bold, sans-serif" font-size="30" letter-spacing="0.06em" fill="#ecf8fb">SILVER IN INDUSTRY</text>
  <text x="600" y="397" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="13" fill="rgba(175,198,207,0.65)" letter-spacing="0.06em">FROM DAGUERREOTYPES TO SOLAR PANELS</text>

  <!-- Divider -->
  <line x1="456" y1="418" x2="744" y2="418" stroke="rgba(88,214,255,0.22)" stroke-width="1"/>

  <!-- Key fact rows -->
  <rect x="448" y="430" width="304" height="28" rx="8" fill="rgba(88,214,255,0.08)" stroke="rgba(88,214,255,0.16)" stroke-width="1"/>
  <text x="464" y="449" font-family="Trebuchet MS, sans-serif" font-size="12" fill="rgba(175,198,207,0.7)" letter-spacing="0.03em">Photography: 30% peak → 2% today</text>

  <rect x="448" y="464" width="304" height="28" rx="8" fill="rgba(88,214,255,0.04)" stroke="rgba(88,214,255,0.10)" stroke-width="1"/>
  <text x="464" y="483" font-family="Trebuchet MS, sans-serif" font-size="12" fill="rgba(175,198,207,0.45)" letter-spacing="0.03em">Solar overtaking electronics by 2025</text>

  <!-- RIGHT STAT CARD: 38% electronics -->
  <rect x="880" y="162" width="278" height="306" rx="18" fill="url(#card-bg)" stroke="#4dffb8" stroke-width="1" stroke-opacity="0.18"/>
  <text x="1019" y="218" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="11" font-weight="800" letter-spacing="0.12em" fill="#4dffb8" opacity="0.7">ELECTRONICS SHARE</text>
  <text x="1019" y="300" text-anchor="middle" font-family="Impact, Haettenschweiler, Arial Narrow Bold, sans-serif" font-size="88" letter-spacing="0.02em" fill="#4dffb8">38%</text>
  <text x="1019" y="340" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="13" fill="rgba(175,198,207,0.72)" letter-spacing="0.04em">of industrial demand</text>
  <text x="1019" y="358" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="13" fill="rgba(175,198,207,0.72)" letter-spacing="0.04em">248 million ounces</text>
  <text x="1019" y="384" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="11" fill="rgba(175,198,207,0.45)" letter-spacing="0.04em">Silver Institute, 2024</text>
</svg>
