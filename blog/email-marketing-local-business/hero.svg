  <text x="889" y="518" font-family="Impact, 'Arial Narrow Bold', sans-serif" font-size="16"
        fill="rgba(236,248,251,0.60)">/MONTH</text>
  <text x="889" y="532" font-family="Arial, sans-serif" font-size="9"
