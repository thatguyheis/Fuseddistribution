<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow-c" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58d6ff" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#58d6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-tl" cx="0%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#4dffb8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#4dffb8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar-junk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4dffb8" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#4dffb8" stop-opacity="0.70"/>
    </linearGradient>
    <linearGradient id="bar-generic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58d6ff" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#58d6ff" stop-opacity="0.70"/>
    </linearGradient>
    <linearGradient id="bar-eagles" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58d6ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#58d6ff" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="bar-proof" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,160,70,0.65)"/>
      <stop offset="100%" stop-color="rgba(255,100,50,0.45)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#041018"/>
  <rect width="1200" height="630" fill="url(#glow-c)"/>
  <rect width="1200" height="630" fill="url(#glow-tl)"/>

  <!-- Decorative rings -->
  <circle cx="600" cy="315" r="255" fill="none" stroke="#58d6ff" stroke-opacity="0.07" stroke-width="1"/>
  <circle cx="600" cy="315" r="170" fill="none" stroke="#58d6ff" stroke-opacity="0.11" stroke-width="1"/>

  <!-- Scatter dots -->
  <circle cx="82"  cy="58"  r="1.5" fill="#58d6ff" opacity="0.22"/>
  <circle cx="1140" cy="95" r="1"   fill="#4dffb8" opacity="0.20"/>
  <circle cx="42"  cy="300" r="1.5" fill="#4dffb8" opacity="0.18"/>
  <circle cx="1168" cy="420" r="1"  fill="#58d6ff" opacity="0.25"/>
  <circle cx="630" cy="28"  r="1.5" fill="#4dffb8" opacity="0.15"/>
  <circle cx="200" cy="575" r="1"   fill="#58d6ff" opacity="0.20"/>
  <circle cx="980" cy="595" r="1.5" fill="#4dffb8" opacity="0.18"/>
  <circle cx="1100" cy="200" r="1"  fill="#58d6ff" opacity="0.22"/>
  <circle cx="75"  cy="480" r="1"   fill="#4dffb8" opacity="0.15"/>
  <circle cx="350" cy="610" r="1.5" fill="#58d6ff" opacity="0.18"/>

  <!-- Title block -->
  <text x="600" y="58" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="26" font-weight="700"
        fill="#ecf8fb" letter-spacing="0.5">Silver Premium by Product Type</text>
  <text x="600" y="86" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="13"
        fill="rgba(175,198,207,0.70)" letter-spacing="1.5">% ABOVE SPOT PRICE</text>

  <!-- Chart area vertical grid lines (at 0%, 20%, 40%, 60%, 80%) -->
  <!-- Scale: 770px for 80%, 9.625px per %, left edge x=280 -->
  <line x1="280"  y1="114" x2="280"  y2="450" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
  <line x1="472"  y1="114" x2="472"  y2="450" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="4,5"/>
  <line x1="665"  y1="114" x2="665"  y2="450" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="4,5"/>
  <line x1="857"  y1="114" x2="857"  y2="450" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="4,5"/>
  <line x1="1050" y1="114" x2="1050" y2="450" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="4,5"/>

  <!-- X-axis tick labels -->
  <text x="280"  y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="rgba(175,198,207,0.55)">0%</text>
  <text x="472"  y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="rgba(175,198,207,0.55)">20%</text>
  <text x="665"  y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="rgba(175,198,207,0.55)">40%</text>
  <text x="857"  y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="rgba(175,198,207,0.55)">60%</text>
  <text x="1050" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="rgba(175,198,207,0.55)">80%+</text>

  <!-- Bar track backgrounds -->
  <rect x="280" y="120" width="770" height="62" rx="7" fill="rgba(255,255,255,0.025)"/>
  <rect x="280" y="202" width="770" height="62" rx="7" fill="rgba(255,255,255,0.025)"/>
  <rect x="280" y="284" width="770" height="62" rx="7" fill="rgba(255,255,255,0.025)"/>
  <rect x="280" y="366" width="770" height="62" rx="7" fill="rgba(255,255,255,0.025)"/>

  <!-- Bar 1: Junk Silver — 3% to 8% (x=309, width=48) -->
  <rect x="309" y="120" width="48" height="62" rx="7" fill="url(#bar-junk)"/>

  <!-- Bar 2: Generic Rounds — 8% to 15% (x=357, width=67) -->
  <rect x="357" y="202" width="67" height="62" rx="7" fill="url(#bar-generic)"/>

  <!-- Bar 3: Silver Eagles — 18% to 28% (x=453, width=96) -->
  <rect x="453" y="284" width="96" height="62" rx="7" fill="url(#bar-eagles)"/>

  <!-- Bar 4: Proof/Collector — 30% to 80%+ (x=569, width=481) -->
  <rect x="569" y="366" width="481" height="62" rx="7" fill="url(#bar-proof)"/>

  <!-- "BEST VALUE" badge above bar 1 -->
  <rect x="309" y="103" width="82" height="17" rx="4" fill="rgba(77,255,184,0.14)"/>
  <text x="350" y="116" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="10" font-weight="700"
        fill="#4dffb8" letter-spacing="1">BEST VALUE</text>

  <!-- Category labels (right-aligned at x=270) -->
  <text x="270" y="157" text-anchor="end"
        font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ecf8fb">Junk Silver</text>
  <text x="270" y="239" text-anchor="end"
        font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ecf8fb">Generic Rounds</text>
  <text x="270" y="321" text-anchor="end"
        font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ecf8fb">Silver Eagles</text>
  <text x="270" y="403" text-anchor="end"
        font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ecf8fb">Proof / Collector</text>

  <!-- Range labels (after each bar) -->
  <text x="365" y="157" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#4dffb8">3–8%</text>
  <text x="432" y="239" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#58d6ff">8–15%</text>
  <text x="557" y="321" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="rgba(88,214,255,0.80)">18–28%</text>
  <text x="1058" y="403" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="rgba(255,160,70,0.90)">30–80%+</text>

  <!-- Fused Reserve callout bar at bottom -->
  <rect x="280" y="495" width="770" height="52" rx="10"
        fill="rgba(11,24,32,0.75)" stroke="rgba(77,255,184,0.22)" stroke-width="1"/>
  <text x="600" y="517" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="12" font-weight="700"
        fill="#4dffb8" letter-spacing="1">FUSED RESERVE</text>
  <text x="600" y="535" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="12"
        fill="rgba(175,198,207,0.70)">Monthly silver subscription sourced at competitive premiums. No long-term commitment.</text>

  <!-- Source note -->
  <text x="600" y="578" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="11"
        fill="rgba(175,198,207,0.40)">Premiums vary by dealer, quantity, and market conditions. Data as of May 2026.</text>
</svg>
