<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow-center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58d6ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#58d6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-topleft" cx="0%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#4dffb8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4dffb8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1e2a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#071318" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="bar-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58d6ff"/>
      <stop offset="100%" stop-color="#4dffb8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#041018"/>
  <rect width="1200" height="630" fill="url(#glow-center)"/>
  <rect width="1200" height="630" fill="url(#glow-topleft)"/>

  <!-- Grid lines -->
  <line x1="170" y1="0" x2="170" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="340" y1="0" x2="340" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="510" y1="0" x2="510" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="680" y1="0" x2="680" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="850" y1="0" x2="850" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="1020" y1="0" x2="1020" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>

  <!-- Rings -->
  <circle cx="600" cy="315" r="255" fill="none" stroke="#58d6ff" stroke-width="1" opacity="0.07"/>
  <circle cx="600" cy="315" r="170" fill="none" stroke="#58d6ff" stroke-width="1" opacity="0.11"/>

  <!-- Scatter dots -->
  <circle cx="108" cy="82" r="1.5" fill="#58d6ff" opacity="0.22"/>
  <circle cx="388" cy="54" r="1" fill="#4dffb8" opacity="0.18"/>
  <circle cx="748" cy="78" r="1.5" fill="#58d6ff" opacity="0.20"/>
  <circle cx="952" cy="112" r="1" fill="#4dffb8" opacity="0.25"/>
  <circle cx="1068" cy="62" r="1.5" fill="#58d6ff" opacity="0.17"/>
  <circle cx="228" cy="528" r="1" fill="#4dffb8" opacity="0.19"/>
  <circle cx="836" cy="548" r="1.5" fill="#58d6ff" opacity="0.21"/>
  <circle cx="1052" cy="496" r="1" fill="#58d6ff" opacity="0.16"/>
  <circle cx="472" cy="574" r="1" fill="#4dffb8" opacity="0.20"/>
  <circle cx="662" cy="92" r="1" fill="#58d6ff" opacity="0.15"/>

  <!-- LEFT STAT CARD: 7x -->
  <rect x="42" y="170" width="278" height="290" rx="18" fill="url(#card-bg)" stroke="#58d6ff" stroke-width="1" stroke-opacity="0.18"/>
  <text x="181" y="228" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="11" font-weight="800" letter-spacing="0.12em" fill="#58d6ff" opacity="0.7">PROFILE CLICKS</text>
  <text x="181" y="320" text-anchor="middle" font-family="Impact, Haettenschweiler, Arial Narrow Bold, sans-serif" font-size="88" letter-spacing="0.02em" fill="#58d6ff">7x</text>
  <text x="181" y="360" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="13" fill="rgba(175,198,207,0.72)" letter-spacing="0.04em">more clicks for</text>
  <text x="181" y="378" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="13" fill="rgba(175,198,207,0.72)" letter-spacing="0.04em">complete profiles</text>
  <text x="181" y="396" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="11" fill="rgba(175,198,207,0.45)" letter-spacing="0.04em">(Google, 2024)</text>

  <!-- CENTER: GBP dashboard mockup + headline -->
  <!-- Dashboard frame -->
  <rect x="456" y="164" width="288" height="200" rx="14" fill="rgba(7,20,28,0.88)" stroke="rgba(88,214,255,0.22)" stroke-width="1"/>
  <!-- Top bar -->
  <rect x="456" y="164" width="288" height="36" rx="14" fill="rgba(11,30,42,0.92)"/>
  <rect x="456" y="184" width="288" height="16" fill="rgba(11,30,42,0.92)"/>
  <text x="600" y="188" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="11" fill="rgba(175,198,207,0.5)" letter-spacing="0.08em">INSIGHTS DASHBOARD</text>

  <!-- Mini metric bars in dashboard -->
  <text x="474" y="224" font-family="Trebuchet MS, sans-serif" font-size="10" fill="rgba(175,198,207,0.55)" font-weight="700" letter-spacing="0.06em">VIEWS</text>
  <rect x="524" y="213" width="200" height="10" rx="5" fill="rgba(88,214,255,0.08)"/>
  <rect x="524" y="213" width="160" height="10" rx="5" fill="url(#bar-grad)"/>

  <text x="474" y="252" font-family="Trebuchet MS, sans-serif" font-size="10" fill="rgba(175,198,207,0.55)" font-weight="700" letter-spacing="0.06em">CALLS</text>
  <rect x="524" y="241" width="200" height="10" rx="5" fill="rgba(88,214,255,0.08)"/>
  <rect x="524" y="241" width="84" height="10" rx="5" fill="rgba(88,214,255,0.55)"/>

  <text x="474" y="280" font-family="Trebuchet MS, sans-serif" font-size="10" fill="rgba(175,198,207,0.55)" font-weight="700" letter-spacing="0.06em">DIRECTIONS</text>
  <rect x="524" y="269" width="200" height="10" rx="5" fill="rgba(88,214,255,0.08)"/>
  <rect x="524" y="269" width="108" height="10" rx="5" fill="rgba(77,255,184,0.55)"/>

  <text x="474" y="308" font-family="Trebuchet MS, sans-serif" font-size="10" fill="rgba(175,198,207,0.55)" font-weight="700" letter-spacing="0.06em">WEBSITE</text>
  <rect x="524" y="297" width="200" height="10" rx="5" fill="rgba(88,214,255,0.08)"/>
  <rect x="524" y="297" width="132" height="10" rx="5" fill="rgba(88,214,255,0.38)"/>

  <text x="474" y="336" font-family="Trebuchet MS, sans-serif" font-size="10" fill="rgba(175,198,207,0.55)" font-weight="700" letter-spacing="0.06em">DISCOVERY</text>
  <rect x="524" y="325" width="200" height="10" rx="5" fill="rgba(88,214,255,0.08)"/>
  <rect x="524" y="325" width="148" height="10" rx="5" fill="rgba(77,255,184,0.40)"/>

  <!-- Center headline -->
  <text x="600" y="408" text-anchor="middle" font-family="Impact, Haettenschweiler, Arial Narrow Bold, sans-serif" font-size="30" letter-spacing="0.06em" fill="#ecf8fb">GBP INSIGHTS</text>
  <text x="600" y="432" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="13" fill="rgba(175,198,207,0.65)" letter-spacing="0.06em">WHAT THE NUMBERS MEAN</text>

  <!-- Divider -->
  <line x1="456" y1="452" x2="744" y2="452" stroke="rgba(88,214,255,0.22)" stroke-width="1"/>

  <!-- Key fact rows -->
  <rect x="448" y="464" width="304" height="28" rx="8" fill="rgba(88,214,255,0.08)" stroke="rgba(88,214,255,0.16)" stroke-width="1"/>
  <text x="464" y="483" font-family="Trebuchet MS, sans-serif" font-size="12" fill="rgba(175,198,207,0.7)" letter-spacing="0.03em">76% visit within 24h of local search</text>

  <rect x="448" y="498" width="304" height="28" rx="8" fill="rgba(88,214,255,0.04)" stroke="rgba(88,214,255,0.10)" stroke-width="1"/>
  <text x="464" y="517" font-family="Trebuchet MS, sans-serif" font-size="12" fill="rgba(175,198,207,0.45)" letter-spacing="0.03em">64% use GBP to find contact info</text>

  <!-- RIGHT STAT CARD: 42% -->
  <rect x="880" y="170" width="278" height="290" rx="18" fill="url(#card-bg)" stroke="#4dffb8" stroke-width="1" stroke-opacity="0.18"/>
  <text x="1019" y="228" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="11" font-weight="800" letter-spacing="0.12em" fill="#4dffb8" opacity="0.7">MORE DIRECTIONS</text>
  <text x="1019" y="320" text-anchor="middle" font-family="Impact, Haettenschweiler, Arial Narrow Bold, sans-serif" font-size="88" letter-spacing="0.02em" fill="#4dffb8">42%</text>
  <text x="1019" y="360" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="13" fill="rgba(175,198,207,0.72)" letter-spacing="0.04em">more direction requests</text>
  <text x="1019" y="378" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="13" fill="rgba(175,198,207,0.72)" letter-spacing="0.04em">with photos added</text>
  <text x="1019" y="396" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="11" fill="rgba(175,198,207,0.45)" letter-spacing="0.04em">(Google, 2024)</text>
</svg>
