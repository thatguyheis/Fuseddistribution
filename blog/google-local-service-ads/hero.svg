  <circle cx="380" cy="54"  r="1.5" fill="#4dffb8" opacity="0.18"/>
  <circle cx="520" cy="142" r="1"   fill="#58d6ff" opacity="0.25"/>
  <circle cx="760" cy="72"  r="1.4" fill="#58d6ff" opacity="0.20"/>
  <circle cx="920" cy="118" r="1.2" fill="#4dffb8" opacity="0.16"/>
  <circle cx="1055" cy="58" r="1"   fill="#58d6ff" opacity="0.22"/>
  <circle cx="188" cy="510" r="1.3" fill="#4dffb8" opacity="0.18"/>
  <circle cx="440" cy="560" r="1.2" fill="#58d6ff" opacity="0.20"/>
  <circle cx="820" cy="540" r="1.5" fill="#58d6ff" opacity="0.17"/>
  <circle cx="1080" cy="490" r="1"  fill="#4dffb8" opacity="0.22"/>

  <!-- Left card: verification info -->
  <rect x="42" y="210" width="270" height="200" rx="14" fill="rgba(7,20,28,0.82)" stroke="rgba(88,214,255,0.16)" stroke-width="1"/>
  <rect x="42" y="210" width="270" height="4" rx="2" fill="#4dffb8" opacity="0.6"/>
  <text x="177" y="248" text-anchor="middle" font-family="Impact, Arial Narrow Bold, sans-serif" font-size="11" letter-spacing="2" fill="#4dffb8" opacity="0.8">GOOGLE GUARANTEED</text>
