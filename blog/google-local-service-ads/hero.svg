  <text x="600" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" letter-spacing="3" fill="rgba(175,198,207,0.65)">AVG COST PER LEAD &#183; HOME SERVICES</text>

  <!-- Stars row below stat -->
  <use href="#star-sm" transform="translate(564,498)" fill="#4dffb8" opacity="0.7"/>
  <use href="#star-sm" transform="translate(582,498)" fill="#4dffb8" opacity="0.7"/>
  <use href="#star-sm" transform="translate(600,498)" fill="#4dffb8" opacity="0.7"/>
  <use href="#star-sm" transform="translate(618,498)" fill="#4dffb8" opacity="0.7"/>
  <use href="#star-sm" transform="translate(636,498)" fill="#4dffb8" opacity="0.35"/>
  <text x="600" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="rgba(175,198,207,0.5)" letter-spacing="1">4.8 STARS DRIVES HIGHER LSA PLACEMENT</text>

  <!-- Right card: position info -->
  <rect x="888" y="210" width="270" height="200" rx="14" fill="rgba(7,20,28,0.82)" stroke="rgba(88,214,255,0.16)" stroke-width="1"/>
  <rect x="888" y="210" width="270" height="4" rx="2" fill="#58d6ff" opacity="0.6"/>
  <text x="1023" y="248" text-anchor="middle" font-family="Impact, Arial Narrow Bold, sans-serif" font-size="11" letter-spacing="2" fill="#58d6ff" opacity="0.8">SEARCH PLACEMENT</text>
  <text x="1023" y="314" text-anchor="middle" font-family="Impact, Arial Narrow Bold, sans-serif" font-size="72" letter-spacing="-2" fill="#58d6ff">#1</text>
  <text x="1023" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="rgba(175,198,207,0.7)">Above all Google Ads</text>
  <text x="1023" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="rgba(175,198,207,0.7)">Above all organic results</text>
  <text x="1023" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="rgba(88,214,255,0.55)">Verification required</text>

  <!-- Bottom brand bar -->
  <rect x="0" y="590" width="1200" height="40" fill="rgba(4,16,24,0.9)"/>
  <text x="600" y="614" text-anchor="middle" font-family="Impact, Arial Narrow Bold, sans-serif" font-size="13" letter-spacing="4" fill="rgba(88,214,255,0.5)">FUSEDDISTRIBUTION.COM</text>
