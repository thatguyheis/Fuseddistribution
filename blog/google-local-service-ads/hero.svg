  <text x="177" y="336" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="rgba(175,198,207,0.7)">Background checked</text>
  <text x="177" y="354" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="rgba(175,198,207,0.7)">Licensed &#183; Insured</text>
  <text x="177" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="rgba(88,214,255,0.55)">Up to $2,000 guarantee</text>

  <!-- Center: main headline -->
  <text x="600" y="186" text-anchor="middle" font-family="Impact, Arial Narrow Bold, sans-serif" font-size="13" letter-spacing="4" fill="#4dffb8" opacity="0.85">PAY PER LEAD &#183; NOT PER CLICK</text>
  <text x="600" y="268" text-anchor="middle" font-family="Impact, Arial Narrow Bold, sans-serif" font-size="68" letter-spacing="2" fill="#ecf8fb">GOOGLE LOCAL</text>
  <text x="600" y="338" text-anchor="middle" font-family="Impact, Arial Narrow Bold, sans-serif" font-size="68" letter-spacing="2" fill="#ecf8fb">SERVICE ADS</text>

  <!-- Big stat -->
