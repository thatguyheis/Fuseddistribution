<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <radialGradient id="glow-c" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#58d6ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#58d6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-tl" cx="5%" cy="5%" r="55%">
      <stop offset="0%" stop-color="#4dffb8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4dffb8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1200" fill="#041018"/>
  <rect width="1200" height="1200" fill="url(#glow-c)"/>
  <rect width="1200" height="1200" fill="url(#glow-tl)"/>

  <!-- Grid lines -->
  <line x1="170" y1="0" x2="170" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="340" y1="0" x2="340" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="510" y1="0" x2="510" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="680" y1="0" x2="680" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="850" y1="0" x2="850" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="1020" y1="0" x2="1020" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>

  <!-- Rings -->
  <circle cx="600" cy="600" r="420" fill="none" stroke="#58d6ff" stroke-opacity="0.07" stroke-width="1"/>
  <circle cx="600" cy="600" r="280" fill="none" stroke="#58d6ff" stroke-opacity="0.10" stroke-width="1"/>

  <!-- Scatter dots -->
  <circle cx="90" cy="110" r="1.5" fill="#58d6ff" fill-opacity="0.22"/>
  <circle cx="265" cy="78" r="1.2" fill="#4dffb8" fill-opacity="0.18"/>
  <circle cx="525" cy="92" r="1" fill="#58d6ff" fill-opacity="0.20"/>
  <circle cx="825" cy="65" r="1.5" fill="#4dffb8" fill-opacity="0.17"/>
  <circle cx="1055" cy="102" r="1.2" fill="#58d6ff" fill-opacity="0.22"/>
  <circle cx="145" cy="1082" r="1.5" fill="#58d6ff" fill-opacity="0.18"/>
  <circle cx="705" cy="1098" r="1.2" fill="#4dffb8" fill-opacity="0.15"/>
  <circle cx="1085" cy="1062" r="1" fill="#58d6ff" fill-opacity="0.20"/>

  <!-- Top zone: category + brand -->
  <text x="600" y="100" text-anchor="middle" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="18" letter-spacing="5" fill="rgba(88,214,255,0.55)">SILVER &#183; STORAGE</text>
  <text x="600" y="158" text-anchor="middle" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="44" letter-spacing="6" fill="rgba(88,214,255,0.90)">FUSED</text>

  <!-- Divider -->
  <line x1="200" y1="180" x2="1000" y2="180" stroke="rgba(88,214,255,0.15)" stroke-width="1"/>

  <!-- Center zone: title -->
  <text x="600" y="290" text-anchor="middle" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="72" letter-spacing="2" fill="#ecf8fb">PREVENT</text>
  <text x="600" y="372" text-anchor="middle" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="72" letter-spacing="2" fill="#58d6ff">SILVER</text>
  <text x="600" y="454" text-anchor="middle" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="72" letter-spacing="2" fill="#ecf8fb">TARNISH</text>

  <!-- Divider -->
  <line x1="300" y1="486" x2="900" y2="486" stroke="rgba(88,214,255,0.20)" stroke-width="1"/>

  <!-- Key stat: humidity target -->
  <text x="600" y="620" text-anchor="middle" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="200" fill="#58d6ff" letter-spacing="2">&lt;50%</text>
  <text x="600" y="672" text-anchor="middle" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="28" letter-spacing="3" fill="rgba(175,198,207,0.85)">RELATIVE HUMIDITY TARGET</text>
  <text x="600" y="708" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="16" letter-spacing="2" fill="rgba(175,198,207,0.50)">American Numismatic Association Guidelines</text>

  <!-- Supporting stat chips -->
  <rect x="100" y="748" width="290" height="80" rx="10" fill="rgba(88,214,255,0.06)" stroke="rgba(88,214,255,0.18)" stroke-width="1"/>
  <text x="245" y="782" text-anchor="middle" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="32" fill="#4dffb8">6-12</text>
  <text x="245" y="808" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="12" fill="rgba(175,198,207,0.65)" letter-spacing="1">months per strip</text>

  <rect x="455" y="748" width="290" height="80" rx="10" fill="rgba(88,214,255,0.06)" stroke="rgba(88,214,255,0.18)" stroke-width="1"/>
  <text x="600" y="782" text-anchor="middle" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="32" fill="#58d6ff">.999</text>
  <text x="600" y="808" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="12" fill="rgba(175,198,207,0.65)" letter-spacing="1">fine silver purity</text>

  <rect x="810" y="748" width="290" height="80" rx="10" fill="rgba(88,214,255,0.06)" stroke="rgba(88,214,255,0.18)" stroke-width="1"/>
  <text x="955" y="782" text-anchor="middle" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="32" fill="#4dffb8">5x</text>
  <text x="955" y="808" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="12" fill="rgba(175,198,207,0.65)" letter-spacing="1">slower with capsule+strip</text>

  <!-- Excerpt line -->
  <line x1="200" y1="868" x2="1000" y2="868" stroke="rgba(88,214,255,0.12)" stroke-width="1"/>
  <text x="600" y="928" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="22" fill="rgba(175,198,207,0.75)">Rubber, cardboard, and wood all accelerate</text>
  <text x="600" y="960" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="22" fill="rgba(175,198,207,0.75)">silver sulfide formation. Here's what works.</text>

  <!-- Bottom CTA shape -->
  <rect x="200" y="1028" width="800" height="100" rx="16" fill="rgba(4,16,24,0.85)" stroke="#58d6ff" stroke-opacity="0.35" stroke-width="1"/>
  <text x="600" y="1068" text-anchor="middle" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="14" letter-spacing="3" fill="rgba(88,214,255,0.70)">FULL GUIDE AT</text>
  <text x="600" y="1102" text-anchor="middle" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="22" letter-spacing="2" fill="#58d6ff">fuseddistribution.com</text>
</svg>
