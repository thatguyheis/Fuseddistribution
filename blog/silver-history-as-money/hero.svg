<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow-c" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58d6ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#041018" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-tl" cx="0%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#4dffb8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#041018" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="num-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#58d6ff"/>
      <stop offset="100%" stop-color="#4dffb8"/>
    </linearGradient>
    <linearGradient id="timeline-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58d6ff" stop-opacity="0.30"/>
      <stop offset="50%" stop-color="#4dffb8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#58d6ff" stop-opacity="0.30"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#041018"/>
  <ellipse cx="600" cy="315" rx="400" ry="270" fill="url(#glow-c)"/>
  <ellipse cx="0" cy="0" rx="360" ry="310" fill="url(#glow-tl)"/>

  <!-- Grid lines -->
  <line x1="170"  y1="0" x2="170"  y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="340"  y1="0" x2="340"  y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="510"  y1="0" x2="510"  y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="680"  y1="0" x2="680"  y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="850"  y1="0" x2="850"  y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="1020" y1="0" x2="1020" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>

  <!-- Decorative rings -->
  <circle cx="600" cy="315" r="255" fill="none" stroke="#58d6ff" stroke-width="1" stroke-opacity="0.07"/>
  <circle cx="600" cy="315" r="170" fill="none" stroke="#58d6ff" stroke-width="1" stroke-opacity="0.11"/>

  <!-- Scatter dots -->
  <circle cx="120" cy="80"   r="1.5" fill="#58d6ff" opacity="0.25"/>
  <circle cx="385" cy="48"   r="1"   fill="#4dffb8" opacity="0.20"/>
  <circle cx="740" cy="28"   r="1.5" fill="#58d6ff" opacity="0.18"/>
  <circle cx="1055" cy="95"  r="1"   fill="#4dffb8" opacity="0.22"/>
  <circle cx="225" cy="552"  r="1.5" fill="#58d6ff" opacity="0.20"/>
  <circle cx="895" cy="578"  r="1"   fill="#4dffb8" opacity="0.25"/>
  <circle cx="480" cy="598"  r="1.5" fill="#58d6ff" opacity="0.15"/>
  <circle cx="1098" cy="318" r="1"   fill="#58d6ff" opacity="0.20"/>
  <circle cx="58"  cy="400"  r="1.5" fill="#4dffb8" opacity="0.18"/>
  <circle cx="660" cy="592"  r="1"   fill="#58d6ff" opacity="0.22"/>
  <circle cx="310" cy="595"  r="1"   fill="#4dffb8" opacity="0.17"/>
  <circle cx="920" cy="42"   r="1.5" fill="#58d6ff" opacity="0.19"/>

  <!-- CENTER panel -->
  <rect x="358" y="148" width="484" height="334" rx="18"
        fill="rgba(7,18,28,0.58)" stroke="rgba(88,214,255,0.09)" stroke-width="1"/>

  <!-- CENTER: Eyebrow -->
  <text x="600" y="188" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="11" font-weight="700"
        fill="rgba(175,198,207,0.52)" letter-spacing="4">HISTORY OF SILVER AS MONEY</text>

  <!-- CENTER: Big number -->
  <text x="600" y="308" text-anchor="middle"
        font-family="Impact, 'Arial Narrow Bold', sans-serif" font-size="138"
        fill="url(#num-grad)" opacity="0.95">4,000</text>

  <!-- CENTER: Subtitle -->
  <text x="600" y="342" text-anchor="middle"
        font-family="Impact, 'Arial Narrow Bold', sans-serif" font-size="28" letter-spacing="5"
        fill="rgba(236,248,251,0.80)">YEARS AS MONEY</text>

  <!-- CENTER: Timeline bar -->
  <rect x="392" y="368" width="416" height="3" rx="2" fill="url(#timeline-grad)"/>

  <!-- Timeline nodes with labels -->
  <!-- Node 1: ~600 BC -->
  <circle cx="416" cy="370" r="5" fill="#58d6ff" opacity="0.85"/>
  <text x="416" y="392" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="9" font-weight="700"
        fill="rgba(88,214,255,0.70)" letter-spacing="1">~600 BC</text>
  <text x="416" y="404" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="8"
        fill="rgba(175,198,207,0.45)">LYDIA</text>

  <!-- Node 2: 268 AD -->
  <circle cx="530" cy="370" r="5" fill="#4dffb8" opacity="0.75"/>
  <text x="530" y="392" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="9" font-weight="700"
        fill="rgba(77,255,184,0.70)" letter-spacing="1">268 AD</text>
  <text x="530" y="404" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="8"
        fill="rgba(175,198,207,0.45)">ROME</text>

  <!-- Node 3: ~1600 -->
  <circle cx="666" cy="370" r="5" fill="#58d6ff" opacity="0.85"/>
  <text x="666" y="392" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="9" font-weight="700"
        fill="rgba(88,214,255,0.70)" letter-spacing="1">~1600</text>
  <text x="666" y="404" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="8"
        fill="rgba(175,198,207,0.45)">SPAIN</text>

  <!-- Node 4: 1965 -->
  <circle cx="792" cy="370" r="5" fill="#4dffb8" opacity="0.75"/>
  <text x="792" y="392" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="9" font-weight="700"
        fill="rgba(77,255,184,0.70)" letter-spacing="1">1965</text>
  <text x="792" y="404" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="8"
        fill="rgba(175,198,207,0.45)">USA</text>

  <!-- CENTER: source note -->
  <text x="600" y="458" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="9"
        fill="rgba(88,214,255,0.30)" letter-spacing="1.5">FROM LYDIA TO THE KENNEDY HALF DOLLAR</text>

  <!-- ── TOP-LEFT CARD (42, 138) ── -->
  <rect x="42" y="138" width="295" height="162" rx="16"
        fill="rgba(11,24,32,0.90)" stroke="rgba(88,214,255,0.20)" stroke-width="1"/>
  <text x="70" y="174" font-family="Arial, sans-serif" font-size="10" font-weight="800"
        fill="rgba(88,214,255,0.58)" letter-spacing="2">FIRST SILVER COINS</text>
  <line x1="70" y1="182" x2="309" y2="182" stroke="rgba(88,214,255,0.12)" stroke-width="1"/>
  <text x="70" y="210" font-family="Arial, sans-serif" font-size="11"
        fill="rgba(175,198,207,0.72)">Lydian electrum coins:</text>
  <text x="70" y="248" font-family="Impact, 'Arial Narrow Bold', sans-serif" font-size="42"
        fill="rgba(236,248,251,0.95)">~600 BC</text>
  <text x="70" y="268" font-family="Arial, sans-serif" font-size="11"
        fill="rgba(175,198,207,0.72)">Ionia, modern-day Turkey</text>
  <text x="70" y="285" font-family="Arial, sans-serif" font-size="9"
        fill="rgba(88,214,255,0.38)" letter-spacing="1.5">ANCIENT NUMISMATIC RECORDS</text>

  <!-- ── TOP-RIGHT CARD (863, 138) ── -->
  <rect x="863" y="138" width="295" height="162" rx="16"
        fill="rgba(11,24,32,0.90)" stroke="rgba(88,214,255,0.20)" stroke-width="1"/>
  <text x="891" y="174" font-family="Arial, sans-serif" font-size="10" font-weight="800"
        fill="rgba(88,214,255,0.58)" letter-spacing="2">US SILVER STANDARD</text>
  <line x1="891" y1="182" x2="1130" y2="182" stroke="rgba(88,214,255,0.12)" stroke-width="1"/>
  <text x="891" y="210" font-family="Arial, sans-serif" font-size="11"
        fill="rgba(175,198,207,0.72)">Morgan and Peace dollars:</text>
  <text x="891" y="248" font-family="Impact, 'Arial Narrow Bold', sans-serif" font-size="32"
        fill="rgba(236,248,251,0.95)">1878-1964</text>
  <text x="891" y="268" font-family="Arial, sans-serif" font-size="11"
        fill="rgba(175,198,207,0.72)">173 years of silver coinage</text>
  <text x="891" y="285" font-family="Arial, sans-serif" font-size="9"
        fill="rgba(88,214,255,0.38)" letter-spacing="1.5">US MINT</text>

  <!-- ── BOTTOM-LEFT CARD (42, 420) ── -->
  <rect x="42" y="420" width="295" height="162" rx="16"
        fill="rgba(11,24,32,0.90)" stroke="rgba(88,214,255,0.20)" stroke-width="1"/>
  <text x="70" y="456" font-family="Arial, sans-serif" font-size="10" font-weight="800"
        fill="rgba(88,214,255,0.58)" letter-spacing="2">ROMAN DEBASEMENT</text>
  <line x1="70" y1="464" x2="309" y2="464" stroke="rgba(88,214,255,0.12)" stroke-width="1"/>
  <text x="70" y="492" font-family="Arial, sans-serif" font-size="11"
        fill="rgba(175,198,207,0.72)">Denarius silver content:</text>
  <text x="70" y="530" font-family="Impact, 'Arial Narrow Bold', sans-serif" font-size="38"
        fill="rgba(236,248,251,0.95)">95% &rarr; 5%</text>
  <text x="70" y="550" font-family="Arial, sans-serif" font-size="11"
        fill="rgba(175,198,207,0.72)">1 AD to 268 AD</text>
  <text x="70" y="567" font-family="Arial, sans-serif" font-size="9"
        fill="rgba(88,214,255,0.38)" letter-spacing="1.5">JOURNAL OF ROMAN ARCHAEOLOGY</text>

  <!-- ── BOTTOM-RIGHT CARD (863, 420) ── -->
  <rect x="863" y="420" width="295" height="162" rx="16"
        fill="rgba(11,24,32,0.90)" stroke="rgba(77,255,184,0.18)" stroke-width="1"/>
  <text x="891" y="456" font-family="Arial, sans-serif" font-size="10" font-weight="800"
        fill="rgba(77,255,184,0.70)" letter-spacing="2">PRE-1965 US COINS</text>
  <line x1="891" y1="464" x2="1130" y2="464" stroke="rgba(77,255,184,0.10)" stroke-width="1"/>
  <text x="891" y="492" font-family="Arial, sans-serif" font-size="11"
        fill="rgba(175,198,207,0.72)">Silver content per coin:</text>
  <text x="891" y="530" font-family="Impact, 'Arial Narrow Bold', sans-serif" font-size="56"
        fill="#4dffb8">90%</text>
  <text x="891" y="550" font-family="Arial, sans-serif" font-size="11"
        fill="rgba(175,198,207,0.72)">dimes, quarters, dollars</text>
  <text x="891" y="567" font-family="Arial, sans-serif" font-size="9"
        fill="rgba(88,214,255,0.38)" letter-spacing="1.5">US COINAGE ACT 1965</text>
</svg>
