<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" width="1200" height="630">
  <defs>
    <radialGradient id="glowLeft" cx="20%" cy="45%" r="38%">
      <stop offset="0%" stop-color="#58d6ff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#58d6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="80%" cy="55%" r="38%">
      <stop offset="0%" stop-color="#4dffb8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#4dffb8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58d6ff"/>
      <stop offset="100%" stop-color="#4dffb8"/>
    </linearGradient>
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#58d6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58d6ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4dffb8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="silverPillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ddeef5"/>
      <stop offset="100%" stop-color="#8ab8c8"/>
    </linearGradient>
    <filter id="brandGlow">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#07131a"/>
  <rect width="1200" height="630" fill="url(#glowLeft)"/>
  <rect width="1200" height="630" fill="url(#glowRight)"/>

  <!-- Repeating vertical grid (like the site body::before) -->
  <line x1="95" y1="0" x2="95" y2="630" stroke="rgba(255,255,255,0.018)" stroke-width="1"/>
  <line x1="190" y1="0" x2="190" y2="630" stroke="rgba(255,255,255,0.018)" stroke-width="1"/>
  <line x1="285" y1="0" x2="285" y2="630" stroke="rgba(255,255,255,0.018)" stroke-width="1"/>
  <line x1="380" y1="0" x2="380" y2="630" stroke="rgba(255,255,255,0.018)" stroke-width="1"/>
  <line x1="475" y1="0" x2="475" y2="630" stroke="rgba(255,255,255,0.018)" stroke-width="1"/>
  <line x1="570" y1="0" x2="570" y2="630" stroke="rgba(255,255,255,0.018)" stroke-width="1"/>
  <line x1="665" y1="0" x2="665" y2="630" stroke="rgba(255,255,255,0.018)" stroke-width="1"/>
  <line x1="760" y1="0" x2="760" y2="630" stroke="rgba(255,255,255,0.018)" stroke-width="1"/>
  <line x1="855" y1="0" x2="855" y2="630" stroke="rgba(255,255,255,0.018)" stroke-width="1"/>
  <line x1="950" y1="0" x2="950" y2="630" stroke="rgba(255,255,255,0.018)" stroke-width="1"/>
  <line x1="1045" y1="0" x2="1045" y2="630" stroke="rgba(255,255,255,0.018)" stroke-width="1"/>
  <line x1="1140" y1="0" x2="1140" y2="630" stroke="rgba(255,255,255,0.018)" stroke-width="1"/>

  <!-- Center panel card -->
  <rect x="160" y="80" width="880" height="470" rx="28" fill="rgba(7,17,23,0.88)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- Top eyebrow inside card -->
  <rect x="490" y="122" width="220" height="30" rx="15" fill="rgba(88,214,255,0.08)" stroke="rgba(88,214,255,0.2)" stroke-width="1"/>
  <text x="600" y="142" text-anchor="middle" font-family="'Trebuchet MS', Arial, sans-serif" font-size="12" fill="rgba(88,214,255,0.8)" font-weight="800" letter-spacing="0.2em">WELCOME TO</text>

  <!-- FUSED wordmark -->
  <text x="600" y="268" text-anchor="middle" font-family="Impact, 'Arial Narrow Bold', Arial, sans-serif" font-size="148" fill="url(#brandGrad)" letter-spacing="0.1em" filter="url(#brandGlow)" opacity="0.95">FUSED</text>

  <!-- Horizontal rule -->
  <line x1="220" y1="300" x2="980" y2="300" stroke="rgba(88,214,255,0.1)" stroke-width="1"/>

  <!-- Two content pillars -->
  <!-- Left: Silver Reserve -->
  <g>
    <!-- Silver coin icon -->
    <circle cx="362" cy="370" r="32" fill="url(#silverPillGrad)" opacity="0.85"/>
    <circle cx="362" cy="370" r="32" fill="none" stroke="rgba(220,238,245,0.2)" stroke-width="1.5"/>
    <text x="362" y="366" text-anchor="middle" font-family="Impact, 'Arial Narrow Bold', Arial, sans-serif" font-size="16" fill="rgba(5,12,18,0.7)" letter-spacing="0.06em">AG</text>
    <text x="362" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="rgba(5,12,18,0.55)" font-weight="800" letter-spacing="0.1em">SILVER</text>

    <text x="362" y="430" text-anchor="middle" font-family="Impact, 'Arial Narrow Bold', Arial, sans-serif" font-size="18" fill="#ecf8fb" letter-spacing="0.06em">SILVER RESERVE</text>
    <text x="362" y="450" text-anchor="middle" font-family="'Trebuchet MS', Arial, sans-serif" font-size="11" fill="rgba(175,198,207,0.55)" letter-spacing="0.1em">Investing · Stacking · Strategy</text>
  </g>

  <!-- Center vertical divider -->
  <line x1="600" y1="318" x2="600" y2="488" stroke="url(#dividerGrad)" stroke-width="1"/>

  <!-- Right: Technology Solutions -->
  <g>
    <!-- Tech icon: simple browser/screen outline -->
    <rect x="568" y="340" width="64" height="48" rx="6" fill="none" stroke="rgba(88,214,255,0.45)" stroke-width="2"/>
    <line x1="568" y1="354" x2="632" y2="354" stroke="rgba(88,214,255,0.3)" stroke-width="1.5"/>
    <circle cx="578" cy="347" r="2.5" fill="rgba(88,214,255,0.5)"/>
    <circle cx="588" cy="347" r="2.5" fill="rgba(88,214,255,0.35)"/>
    <circle cx="598" cy="347" r="2.5" fill="rgba(88,214,255,0.2)"/>
    <!-- Screen content lines -->
    <line x1="578" y1="366" x2="622" y2="366" stroke="rgba(88,214,255,0.2)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="578" y1="374" x2="614" y2="374" stroke="rgba(88,214,255,0.15)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="578" y1="382" x2="618" y2="382" stroke="rgba(88,214,255,0.15)" stroke-width="1.5" stroke-linecap="round"/>

    <text x="838" y="430" text-anchor="middle" font-family="Impact, 'Arial Narrow Bold', Arial, sans-serif" font-size="18" fill="#ecf8fb" letter-spacing="0.06em">TECHNOLOGY</text>
    <text x="838" y="450" text-anchor="middle" font-family="'Trebuchet MS', Arial, sans-serif" font-size="11" fill="rgba(175,198,207,0.55)" letter-spacing="0.1em">Websites · Google · Local Business</text>
  </g>

  <!-- Reposition tech icon to be centered over its label -->
  <!-- Override above group with correct position -->
  <rect x="806" y="340" width="64" height="48" rx="6" fill="none" stroke="rgba(88,214,255,0.45)" stroke-width="2"/>
  <line x1="806" y1="354" x2="870" y2="354" stroke="rgba(88,214,255,0.3)" stroke-width="1.5"/>
  <circle cx="816" cy="347" r="2.5" fill="rgba(88,214,255,0.5)"/>
  <circle cx="826" cy="347" r="2.5" fill="rgba(88,214,255,0.35)"/>
  <circle cx="836" cy="347" r="2.5" fill="rgba(88,214,255,0.2)"/>
  <line x1="816" y1="366" x2="860" y2="366" stroke="rgba(88,214,255,0.2)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="816" y1="374" x2="852" y2="374" stroke="rgba(88,214,255,0.15)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="816" y1="382" x2="856" y2="382" stroke="rgba(88,214,255,0.15)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Bottom tagline -->
  <text x="600" y="505" text-anchor="middle" font-family="'Trebuchet MS', Arial, sans-serif" font-size="13" fill="rgba(175,198,207,0.35)" letter-spacing="0.2em" font-weight="700">FUSEDDISTRIBUTION.COM</text>
</svg>
