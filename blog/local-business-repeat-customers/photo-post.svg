  <text x="600" y="963" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="18" font-weight="800" letter-spacing="0.08em" fill="rgba(88,214,255,0.85)">Full breakdown at fuseddistribution.com</text>

