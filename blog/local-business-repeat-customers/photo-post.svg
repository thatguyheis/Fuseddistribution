  <text x="955" y="700" text-anchor="middle" font-family="Impact, sans-serif" font-size="44" fill="#58d6ff">3</text>
  <text x="955" y="730" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="13" fill="rgba(175,198,207,0.65)">steps to build</text>
  <text x="955" y="748" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="13" fill="rgba(175,198,207,0.65)">a follow-up system</text>

