<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow-center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58d6ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#58d6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-topleft" cx="0%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#4dffb8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4dffb8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1e2a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#071318" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#041018"/>
  <rect width="1200" height="630" fill="url(#glow-center)"/>
  <rect width="1200" height="630" fill="url(#glow-topleft)"/>

  <!-- Grid lines -->
  <line x1="170" y1="0" x2="170" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="340" y1="0" x2="340" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="510" y1="0" x2="510" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="680" y1="0" x2="680" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="850" y1="0" x2="850" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="1020" y1="0" x2="1020" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>

  <!-- Rings -->
  <circle cx="600" cy="315" r="255" fill="none" stroke="#58d6ff" stroke-width="1" opacity="0.07"/>
  <circle cx="600" cy="315" r="170" fill="none" stroke="#58d6ff" stroke-width="1" opacity="0.11"/>

  <!-- Scatter dots -->
  <circle cx="128" cy="76" r="1.5" fill="#58d6ff" opacity="0.22"/>
  <circle cx="412" cy="48" r="1" fill="#4dffb8" opacity="0.18"/>
  <circle cx="748" cy="82" r="1.5" fill="#58d6ff" opacity="0.20"/>
  <circle cx="960" cy="108" r="1" fill="#4dffb8" opacity="0.25"/>
  <circle cx="1074" cy="58" r="1.5" fill="#58d6ff" opacity="0.17"/>
  <circle cx="218" cy="522" r="1" fill="#4dffb8" opacity="0.19"/>
  <circle cx="844" cy="554" r="1.5" fill="#58d6ff" opacity="0.21"/>
  <circle cx="1038" cy="482" r="1" fill="#58d6ff" opacity="0.16"/>
  <circle cx="478" cy="574" r="1" fill="#4dffb8" opacity="0.20"/>
  <circle cx="664" cy="92" r="1" fill="#58d6ff" opacity="0.15"/>

  <!-- LEFT STAT CARD: 67% -->
  <rect x="42" y="180" width="272" height="270" rx="18" fill="url(#card-bg)" stroke="#58d6ff" stroke-width="1" stroke-opacity="0.18"/>
  <text x="178" y="236" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="11" font-weight="800" letter-spacing="0.12em" fill="#58d6ff" opacity="0.7">REPEAT CUSTOMERS</text>
  <text x="178" y="323" text-anchor="middle" font-family="Impact, Haettenschweiler, Arial Narrow Bold, sans-serif" font-size="88" letter-spacing="0.02em" fill="#58d6ff">67%</text>
  <text x="178" y="362" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="13" fill="rgba(175,198,207,0.72)" letter-spacing="0.04em">more spent vs</text>
  <text x="178" y="380" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="13" fill="rgba(175,198,207,0.72)" letter-spacing="0.04em">first-time buyers</text>

  <!-- CENTER: retention loop graphic + headline -->
  <!-- Loop arrows (simplified circular arrows suggesting retention) -->
  <path d="M 600 170 A 70 70 0 1 1 530 240" fill="none" stroke="#58d6ff" stroke-width="2" stroke-opacity="0.4"/>
  <polygon points="524,232 530,248 540,236" fill="#58d6ff" opacity="0.4"/>
  <text x="600" y="252" text-anchor="middle" font-family="Impact, Haettenschweiler, Arial Narrow Bold, sans-serif" font-size="16" fill="#4dffb8" opacity="0.8" letter-spacing="0.06em">RETENTION</text>

  <!-- Center headline -->
  <text x="600" y="320" text-anchor="middle" font-family="Impact, Haettenschweiler, Arial Narrow Bold, sans-serif" font-size="36" letter-spacing="0.06em" fill="#ecf8fb">REPEAT BUYERS</text>
  <text x="600" y="356" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="14" fill="rgba(175,198,207,0.65)" letter-spacing="0.06em">THE FOLLOW-UP ADVANTAGE</text>

  <!-- Divider -->
  <line x1="470" y1="374" x2="730" y2="374" stroke="rgba(88,214,255,0.22)" stroke-width="1"/>

  <!-- Three-step rows -->
  <rect x="452" y="386" width="296" height="30" rx="8" fill="rgba(88,214,255,0.08)" stroke="rgba(88,214,255,0.16)" stroke-width="1"/>
  <text x="468" y="406" font-family="Impact, sans-serif" font-size="13" fill="#58d6ff">1</text>
  <text x="486" y="406" font-family="Trebuchet MS, sans-serif" font-size="12" fill="rgba(175,198,207,0.7)" letter-spacing="0.04em">FOLLOW UP SAME DAY</text>
  <rect x="452" y="422" width="296" height="30" rx="8" fill="rgba(88,214,255,0.04)" stroke="rgba(88,214,255,0.10)" stroke-width="1"/>
  <text x="468" y="442" font-family="Impact, sans-serif" font-size="13" fill="rgba(88,214,255,0.6)">2</text>
  <text x="486" y="442" font-family="Trebuchet MS, sans-serif" font-size="12" fill="rgba(175,198,207,0.45)" letter-spacing="0.04em">CHECK IN AT 30 DAYS</text>
  <rect x="452" y="458" width="296" height="30" rx="8" fill="rgba(88,214,255,0.04)" stroke="rgba(88,214,255,0.08)" stroke-width="1"/>
  <text x="468" y="478" font-family="Impact, sans-serif" font-size="13" fill="rgba(88,214,255,0.4)">3</text>
  <text x="486" y="478" font-family="Trebuchet MS, sans-serif" font-size="12" fill="rgba(175,198,207,0.32)" letter-spacing="0.04em">ASK FOR REFERRAL</text>

  <!-- RIGHT STAT CARD: 5x -->
  <rect x="886" y="180" width="272" height="270" rx="18" fill="url(#card-bg)" stroke="#4dffb8" stroke-width="1" stroke-opacity="0.18"/>
  <text x="1022" y="236" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="11" font-weight="800" letter-spacing="0.12em" fill="#4dffb8" opacity="0.7">ACQUISITION COST</text>
  <text x="1022" y="323" text-anchor="middle" font-family="Impact, Haettenschweiler, Arial Narrow Bold, sans-serif" font-size="88" letter-spacing="0.02em" fill="#4dffb8">5x</text>
  <text x="1022" y="362" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="13" fill="rgba(175,198,207,0.72)" letter-spacing="0.04em">more to find a new</text>
  <text x="1022" y="380" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="13" fill="rgba(175,198,207,0.72)" letter-spacing="0.04em">customer vs keep one</text>
</svg>
