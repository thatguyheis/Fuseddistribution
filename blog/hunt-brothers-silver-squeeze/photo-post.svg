<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <radialGradient id="glow-c" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#58d6ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#58d6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-tl" cx="0%" cy="0%" r="65%">
      <stop offset="0%" stop-color="#4dffb8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#4dffb8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1200" fill="#041018"/>
  <rect width="1200" height="1200" fill="url(#glow-c)"/>
  <rect width="1200" height="1200" fill="url(#glow-tl)"/>

  <!-- Grid lines -->
  <line x1="170" y1="0" x2="170" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="340" y1="0" x2="340" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="510" y1="0" x2="510" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="680" y1="0" x2="680" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="850" y1="0" x2="850" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="1020" y1="0" x2="1020" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>

  <!-- Rings -->
  <circle cx="600" cy="520" r="340" fill="none" stroke="#58d6ff" stroke-width="1" stroke-opacity="0.07"/>
  <circle cx="600" cy="520" r="220" fill="none" stroke="#58d6ff" stroke-width="1" stroke-opacity="0.11"/>

  <!-- Scatter dots -->
  <circle cx="130" cy="90" r="1.5" fill="#58d6ff" opacity="0.22"/>
  <circle cx="400" cy="60" r="1" fill="#4dffb8" opacity="0.26"/>
  <circle cx="880" cy="80" r="1.5" fill="#58d6ff" opacity="0.18"/>
  <circle cx="1070" cy="240" r="1" fill="#4dffb8" opacity="0.20"/>
  <circle cx="80" cy="590" r="1.5" fill="#58d6ff" opacity="0.18"/>
  <circle cx="1110" cy="720" r="1" fill="#4dffb8" opacity="0.15"/>
  <circle cx="190" cy="920" r="1.5" fill="#58d6ff" opacity="0.14"/>
  <circle cx="1050" cy="940" r="1" fill="#58d6ff" opacity="0.18"/>
  <circle cx="460" cy="1090" r="1.5" fill="#4dffb8" opacity="0.15"/>
  <circle cx="800" cy="1075" r="1" fill="#58d6ff" opacity="0.17"/>

  <!-- TOP ZONE: Eyebrow + brand -->
  <rect x="280" y="60" width="640" height="38" rx="19" fill="rgba(88,214,255,0.08)" stroke="rgba(88,214,255,0.22)" stroke-width="1"/>
  <text x="600" y="85" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="12" font-weight="800" letter-spacing="3" fill="#58d6ff">SILVER &#183; HISTORY &#183; 1980</text>

  <text x="600" y="145" text-anchor="middle" font-family="Impact,Haettenschweiler,sans-serif" font-size="28" letter-spacing="6" fill="rgba(88,214,255,0.6)">FUSED</text>

  <!-- CENTER ZONE: Big stat -->
  <text x="600" y="380" text-anchor="middle" font-family="Impact,Haettenschweiler,sans-serif" font-size="180" letter-spacing="2" fill="#58d6ff">$49</text>

  <text x="600" y="435" text-anchor="middle" font-family="Impact,Haettenschweiler,sans-serif" font-size="30" letter-spacing="2" fill="#ecf8fb">PER OZ SILVER PEAK</text>
  <text x="600" y="472" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="19" fill="rgba(175,198,207,0.7)">January 18, 1980 &#183; All-time nominal high</text>

  <!-- Divider -->
  <line x1="200" y1="510" x2="1000" y2="510" stroke="rgba(88,214,255,0.18)" stroke-width="1"/>

  <!-- Title block -->
  <text x="600" y="578" text-anchor="middle" font-family="Impact,Haettenschweiler,sans-serif" font-size="48" letter-spacing="1.5" fill="#ecf8fb">THE HUNT BROTHERS'</text>
  <text x="600" y="632" text-anchor="middle" font-family="Impact,Haettenschweiler,sans-serif" font-size="48" letter-spacing="1.5" fill="#58d6ff">SILVER SQUEEZE</text>
  <text x="600" y="686" text-anchor="middle" font-family="Impact,Haettenschweiler,sans-serif" font-size="42" letter-spacing="1.5" fill="rgba(236,248,251,0.8)">OF 1980</text>

  <!-- Excerpt line -->
  <text x="600" y="758" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="21" fill="rgba(175,198,207,0.75)">Two brothers. 100 million ounces.</text>
  <text x="600" y="786" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="21" fill="rgba(175,198,207,0.75)">One day that nearly broke the market.</text>

  <!-- Three mini stats -->
  <rect x="80" y="845" width="310" height="100" rx="14" fill="rgba(88,214,255,0.06)" stroke="rgba(88,214,255,0.14)" stroke-width="1"/>
  <text x="235" y="885" text-anchor="middle" font-family="Impact,Haettenschweiler,sans-serif" font-size="32" fill="#58d6ff">100M OZ</text>
  <text x="235" y="910" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="13" fill="rgba(175,198,207,0.7)">silver accumulated</text>
  <text x="235" y="930" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="12" fill="rgba(175,198,207,0.5)">1/3 of world supply</text>

  <rect x="445" y="845" width="310" height="100" rx="14" fill="rgba(255,100,100,0.06)" stroke="rgba(255,100,100,0.18)" stroke-width="1"/>
  <text x="600" y="885" text-anchor="middle" font-family="Impact,Haettenschweiler,sans-serif" font-size="32" fill="rgba(255,140,140,0.9)">$10.80</text>
  <text x="600" y="910" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="13" fill="rgba(175,198,207,0.7)">Silver Thursday</text>
  <text x="600" y="930" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="12" fill="rgba(175,198,207,0.5)">March 27, 1980</text>

  <rect x="810" y="845" width="310" height="100" rx="14" fill="rgba(88,214,255,0.06)" stroke="rgba(88,214,255,0.14)" stroke-width="1"/>
  <text x="965" y="885" text-anchor="middle" font-family="Impact,Haettenschweiler,sans-serif" font-size="32" fill="#4dffb8">31 YRS</text>
  <text x="965" y="910" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="13" fill="rgba(175,198,207,0.7)">to revisit $49</text>
  <text x="965" y="930" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="12" fill="rgba(175,198,207,0.5)">not until April 2011</text>

  <!-- BOTTOM ZONE: CTA -->
  <rect x="200" y="1000" width="800" height="60" rx="14" fill="rgba(88,214,255,0.05)" stroke="rgba(88,214,255,0.25)" stroke-width="1.5"/>
  <text x="600" y="1037" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="18" font-weight="700" fill="#58d6ff" letter-spacing="1">Full breakdown at fuseddistribution.com</text>

  <text x="600" y="1108" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="14" fill="rgba(175,198,207,0.4)">fuseddistribution.com/blog/hunt-brothers-silver-squeeze/</text>
</svg>
