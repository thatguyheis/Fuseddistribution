  <text x="600" y="442" text-anchor="middle" font-family="'Trebuchet MS', sans-serif" font-size="15" fill="rgba(175,198,207,0.65)" letter-spacing="2">WHAT THE FINE PRINT ACTUALLY SAYS</text>

