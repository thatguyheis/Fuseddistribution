<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow-c" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#58d6ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#58d6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-tl" cx="8%" cy="10%" r="50%">
      <stop offset="0%" stop-color="#4dffb8" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#4dffb8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#041018"/>
  <rect width="1200" height="630" fill="url(#glow-c)"/>
  <rect width="1200" height="630" fill="url(#glow-tl)"/>

  <!-- Grid lines -->
  <line x1="170" y1="0" x2="170" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="340" y1="0" x2="340" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="510" y1="0" x2="510" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="680" y1="0" x2="680" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="850" y1="0" x2="850" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="1020" y1="0" x2="1020" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>

  <!-- Rings -->
  <circle cx="600" cy="315" r="255" fill="none" stroke="#58d6ff" stroke-opacity="0.07" stroke-width="1"/>
  <circle cx="600" cy="315" r="170" fill="none" stroke="#58d6ff" stroke-opacity="0.11" stroke-width="1"/>

  <!-- Scatter dots -->
  <circle cx="92" cy="66" r="1.5" fill="#58d6ff" fill-opacity="0.22"/>
  <circle cx="230" cy="44" r="1.2" fill="#4dffb8" fill-opacity="0.18"/>
  <circle cx="445" cy="82" r="1" fill="#58d6ff" fill-opacity="0.20"/>
  <circle cx="760" cy="52" r="1.5" fill="#4dffb8" fill-opacity="0.15"/>
  <circle cx="930" cy="90" r="1.2" fill="#58d6ff" fill-opacity="0.25"/>
  <circle cx="1110" cy="48" r="1" fill="#4dffb8" fill-opacity="0.20"/>
  <circle cx="160" cy="530" r="1.5" fill="#58d6ff" fill-opacity="0.18"/>
  <circle cx="470" cy="575" r="1.2" fill="#4dffb8" fill-opacity="0.15"/>
  <circle cx="870" cy="548" r="1" fill="#58d6ff" fill-opacity="0.22"/>
  <circle cx="1075" cy="515" r="1.5" fill="#4dffb8" fill-opacity="0.17"/>

  <!-- Left card: humidity threshold -->
  <rect x="42" y="170" width="272" height="170" rx="12" fill="rgba(4,16,24,0.78)" stroke="#58d6ff" stroke-opacity="0.18" stroke-width="1"/>
  <text x="178" y="208" text-anchor="middle" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="13" letter-spacing="2" fill="rgba(88,214,255,0.70)">HUMIDITY TARGET</text>
  <text x="178" y="260" text-anchor="middle" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="52" fill="#58d6ff" letter-spacing="1">&lt;50%</text>
  <text x="178" y="286" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="12" fill="rgba(175,198,207,0.70)" letter-spacing="1">RELATIVE HUMIDITY</text>
  <text x="178" y="306" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="11" fill="rgba(175,198,207,0.50)" letter-spacing="1">ANA Guidelines</text>

  <!-- Right card: strip lifespan -->
  <rect x="886" y="170" width="272" height="170" rx="12" fill="rgba(4,16,24,0.78)" stroke="#4dffb8" stroke-opacity="0.18" stroke-width="1"/>
  <text x="1022" y="208" text-anchor="middle" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="13" letter-spacing="2" fill="rgba(77,255,184,0.70)">STRIP LIFESPAN</text>
  <text x="1022" y="260" text-anchor="middle" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="52" fill="#4dffb8" letter-spacing="1">12</text>
  <text x="1022" y="283" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="13" fill="rgba(175,198,207,0.75)" letter-spacing="1">MONTHS SEALED</text>
  <text x="1022" y="303" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="11" fill="rgba(175,198,207,0.50)" letter-spacing="1">3M Anti-Tarnish Strip</text>

  <!-- Center main content -->
  <text x="600" y="185" text-anchor="middle" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="17" letter-spacing="4" fill="rgba(88,214,255,0.60)">FUSED DISTRIBUTION</text>
  <text x="600" y="250" text-anchor="middle" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="50" letter-spacing="2" fill="#ecf8fb">PREVENT SILVER</text>
  <text x="600" y="300" text-anchor="middle" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="50" letter-spacing="2" fill="#58d6ff">TARNISH</text>

  <!-- Divider line -->
  <line x1="400" y1="322" x2="800" y2="322" stroke="#58d6ff" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Sub-content below divider -->
  <text x="600" y="358" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="16" letter-spacing="2" fill="rgba(175,198,207,0.80)">ANTI-TARNISH STRIPS &#183; VCI CAPSULES &#183; WHAT TO AVOID</text>

  <text x="600" y="400" text-anchor="middle" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="32" letter-spacing="1" fill="rgba(175,198,207,0.70)">RUBBER &#183; CARDBOARD &#183; NEWSPAPER</text>
  <text x="600" y="428" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="13" letter-spacing="2" fill="rgba(175,198,207,0.45)">ALL ACCELERATE SILVER SULFIDE FORMATION</text>

  <!-- Fine silver note -->
  <rect x="380" y="460" width="440" height="46" rx="8" fill="rgba(88,214,255,0.05)" stroke="rgba(88,214,255,0.14)" stroke-width="1"/>
  <text x="600" y="479" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="13" fill="rgba(175,198,207,0.75)" letter-spacing="1">Silver sulfide (Ag&#8322;S) forms from H&#8322;S + moisture</text>
  <text x="600" y="498" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="12" fill="rgba(175,198,207,0.50)" letter-spacing="1">Preventable with proper sealing and humidity control</text>

  <!-- Bottom brand line -->
  <text x="600" y="568" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="12" letter-spacing="3" fill="rgba(88,214,255,0.40)">fuseddistribution.com</text>
</svg>
