  <text x="600" y="148" text-anchor="middle" font-family="Impact, Haettenschweiler, Arial Narrow Bold, sans-serif" font-size="52" letter-spacing="0.12em" fill="#ecf8fb" opacity="0.95">FUSED</text>
  <line x1="300" y1="168" x2="900" y2="168" stroke="rgba(88,214,255,0.18)" stroke-width="1"/>

