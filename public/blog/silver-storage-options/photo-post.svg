  <circle cx="408" cy="68" r="1" fill="#4dffb8" opacity="0.18"/>
  <circle cx="756" cy="78" r="1.5" fill="#58d6ff" opacity="0.20"/>
  <circle cx="956" cy="116" r="1" fill="#4dffb8" opacity="0.25"/>
  <circle cx="1078" cy="66" r="1.5" fill="#58d6ff" opacity="0.17"/>
