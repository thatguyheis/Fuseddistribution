  <rect x="250" y="922" width="700" height="72" rx="20" fill="rgba(88,214,255,0.06)" stroke="#58d6ff" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="600" y="965" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="18" font-weight="800" letter-spacing="0.08em" fill="rgba(88,214,255,0.85)">Full breakdown at fuseddistribution.com</text>

  <!-- Brand watermark -->
  <text x="600" y="1080" text-anchor="middle" font-family="Impact, sans-serif" font-size="28" letter-spacing="0.14em" fill="rgba(88,214,255,0.25)">FUSED DISTRIBUTION</text>
