  <text x="950" y="692" text-anchor="middle" font-family="Impact, sans-serif" font-size="28" fill="#4dffb8">VAULT</text>
  <text x="950" y="720" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="14" fill="rgba(175,198,207,0.65)">~$240/yr insured</text>
  <text x="950" y="742" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="12" fill="rgba(175,198,207,0.45)">Best $25K+</text>

