  <path d="M 600 155 L 648 178 L 648 230 C 648 262 626 288 600 298 C 574 288 552 262 552 230 L 552 178 Z" fill="rgba(88,214,255,0.08)" stroke="#58d6ff" stroke-width="1.8" stroke-opacity="0.5"/>
  <text x="600" y="240" text-anchor="middle" font-family="Impact, sans-serif" font-size="36" fill="#58d6ff" opacity="0.7">S</text>

