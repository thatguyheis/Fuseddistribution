  <circle cx="402" cy="56" r="1" fill="#4dffb8" opacity="0.18"/>
  <circle cx="736" cy="74" r="1.5" fill="#58d6ff" opacity="0.20"/>
  <circle cx="952" cy="118" r="1" fill="#4dffb8" opacity="0.25"/>
  <circle cx="1082" cy="62" r="1.5" fill="#58d6ff" opacity="0.17"/>
