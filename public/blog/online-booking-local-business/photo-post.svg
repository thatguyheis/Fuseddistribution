<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <radialGradient id="glow-c" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58d6ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#58d6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-tl" cx="0%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#4dffb8" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#4dffb8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1200" fill="#041018"/>
  <rect width="1200" height="1200" fill="url(#glow-c)"/>
  <rect width="1200" height="1200" fill="url(#glow-tl)"/>

  <!-- Grid lines -->
  <line x1="170" y1="0" x2="170" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="340" y1="0" x2="340" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="510" y1="0" x2="510" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="680" y1="0" x2="680" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="850" y1="0" x2="850" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="1020" y1="0" x2="1020" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>

  <!-- Rings -->
  <circle cx="600" cy="600" r="480" fill="none" stroke="#58d6ff" stroke-width="1" stroke-opacity="0.06"/>
  <circle cx="600" cy="600" r="320" fill="none" stroke="#58d6ff" stroke-width="1" stroke-opacity="0.09"/>

  <!-- Scatter dots -->
  <circle cx="120" cy="140" r="1.5" fill="#58d6ff" fill-opacity="0.22"/>
  <circle cx="320" cy="980" r="1" fill="#4dffb8" fill-opacity="0.18"/>
  <circle cx="500" cy="80" r="1.5" fill="#58d6ff" fill-opacity="0.20"/>
  <circle cx="800" cy="1100" r="1" fill="#4dffb8" fill-opacity="0.25"/>
  <circle cx="940" cy="100" r="1.5" fill="#58d6ff" fill-opacity="0.18"/>
  <circle cx="1080" cy="860" r="1" fill="#4dffb8" fill-opacity="0.22"/>
  <circle cx="200" cy="640" r="1.2" fill="#58d6ff" fill-opacity="0.15"/>
  <circle cx="1010" cy="500" r="1" fill="#58d6ff" fill-opacity="0.20"/>

  <!-- Top zone: category + brand -->
  <text x="600" y="90" font-family="Trebuchet MS, sans-serif" font-size="18" letter-spacing="0.22em" fill="rgba(175,198,207,0.55)" text-anchor="middle">LOCAL BUSINESS</text>
  <text x="600" y="148" font-family="Impact, Arial Narrow, sans-serif" font-size="48" letter-spacing="0.10em" fill="#58d6ff" text-anchor="middle">FUSED</text>
  <text x="600" y="176" font-family="Trebuchet MS, sans-serif" font-size="13" letter-spacing="0.18em" fill="rgba(175,198,207,0.45)" text-anchor="middle">TECHNOLOGY SOLUTIONS</text>

  <!-- Divider -->
  <line x1="200" y1="198" x2="1000" y2="198" stroke="rgba(88,214,255,0.18)" stroke-width="1"/>

  <!-- Big stat number -->
  <text x="600" y="400" font-family="Impact, Arial Narrow, sans-serif" font-size="260" letter-spacing="0.02em" fill="#58d6ff" text-anchor="middle" opacity="0.95">40%</text>
  <text x="600" y="462" font-family="Trebuchet MS, sans-serif" font-size="26" letter-spacing="0.08em" fill="rgba(175,198,207,0.75)" text-anchor="middle">OF SERVICE BOOKINGS HAPPEN AFTER HOURS</text>
  <text x="600" y="498" font-family="Trebuchet MS, sans-serif" font-size="16" fill="rgba(175,198,207,0.45)" text-anchor="middle">Square, 2024 &#183; millions of USA service businesses</text>

  <!-- Secondary stat row -->
  <rect x="100" y="548" width="440" height="120" rx="16" fill="rgba(7,20,28,0.75)" stroke="rgba(77,255,184,0.14)" stroke-width="1"/>
  <text x="320" y="612" font-family="Impact, Arial Narrow, sans-serif" font-size="64" letter-spacing="0.02em" fill="#4dffb8" text-anchor="middle">29%</text>
  <text x="320" y="646" font-family="Trebuchet MS, sans-serif" font-size="13" fill="rgba(175,198,207,0.65)" text-anchor="middle">fewer no-shows with reminders</text>

  <rect x="660" y="548" width="440" height="120" rx="16" fill="rgba(7,20,28,0.75)" stroke="rgba(88,214,255,0.14)" stroke-width="1"/>
  <text x="880" y="612" font-family="Impact, Arial Narrow, sans-serif" font-size="64" letter-spacing="0.02em" fill="#58d6ff" text-anchor="middle">67%</text>
  <text x="880" y="646" font-family="Trebuchet MS, sans-serif" font-size="13" fill="rgba(175,198,207,0.65)" text-anchor="middle">prefer online booking vs calling</text>

  <!-- Post title block -->
  <text x="600" y="760" font-family="Impact, Arial Narrow, sans-serif" font-size="46" letter-spacing="0.03em" fill="#ecf8fb" text-anchor="middle">YOUR PHONE IS MISSING</text>
  <text x="600" y="818" font-family="Impact, Arial Narrow, sans-serif" font-size="46" letter-spacing="0.03em" fill="#ecf8fb" text-anchor="middle">4 IN 10 APPOINTMENTS</text>
  <text x="600" y="880" font-family="Trebuchet MS, sans-serif" font-size="20" fill="rgba(175,198,207,0.65)" text-anchor="middle">Free online booking captures customers while you sleep.</text>
  <text x="600" y="910" font-family="Trebuchet MS, sans-serif" font-size="20" fill="rgba(175,198,207,0.65)" text-anchor="middle">Setup takes under an hour. No monthly fee for solo owners.</text>

  <!-- Divider -->
  <line x1="200" y1="960" x2="1000" y2="960" stroke="rgba(88,214,255,0.14)" stroke-width="1"/>

  <!-- CTA button -->
  <rect x="340" y="990" width="520" height="72" rx="18" fill="rgba(88,214,255,0.08)" stroke="rgba(88,214,255,0.30)" stroke-width="1.5"/>
  <text x="600" y="1034" font-family="Trebuchet MS, sans-serif" font-size="15" letter-spacing="0.10em" fill="rgba(175,198,207,0.75)" text-anchor="middle">Full breakdown at fuseddistribution.com</text>

  <!-- Footer brand -->
  <text x="600" y="1142" font-family="Impact, Arial Narrow, sans-serif" font-size="20" letter-spacing="0.12em" fill="rgba(88,214,255,0.45)" text-anchor="middle">FUSEDDISTRIBUTION.COM</text>
</svg>
