<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="fc-cyan" cx="58%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#58d6ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#58d6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fc-green" cx="12%" cy="18%" r="36%">
      <stop offset="0%" stop-color="#4dffb8" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#4dffb8" stop-opacity="0"/>
    </radialGradient>
    <path id="star-fc" d="M 0,-7 L 1.76,-2.43 L 6.66,-2.16 L 2.85,0.93 L 4.11,5.66 L 0,3 L -4.11,5.66 L -2.85,0.93 L -6.66,-2.16 L -1.76,-2.43 Z"/>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#041018"/>
  <rect width="1200" height="630" fill="url(#fc-cyan)"/>
  <rect width="1200" height="630" fill="url(#fc-green)"/>

  <!-- Grid lines -->
  <line x1="170" y1="0" x2="170" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="340" y1="0" x2="340" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="510" y1="0" x2="510" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="680" y1="0" x2="680" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="850" y1="0" x2="850" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="1020" y1="0" x2="1020" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>

  <!-- Rings -->
  <circle cx="600" cy="315" r="255" fill="none" stroke="#58d6ff" stroke-width="1" opacity="0.07"/>
  <circle cx="600" cy="315" r="170" fill="none" stroke="#58d6ff" stroke-width="1" opacity="0.11"/>

  <!-- Scatter dots -->
  <circle cx="128" cy="95"   r="1.3" fill="#58d6ff" opacity="0.22"/>
  <circle cx="355" cy="62"   r="1.5" fill="#4dffb8" opacity="0.18"/>
  <circle cx="490" cy="148"  r="1"   fill="#58d6ff" opacity="0.25"/>
  <circle cx="745" cy="78"   r="1.4" fill="#58d6ff" opacity="0.20"/>
  <circle cx="935" cy="122"  r="1.2" fill="#4dffb8" opacity="0.16"/>
  <circle cx="1068" cy="65"  r="1"   fill="#58d6ff" opacity="0.22"/>
  <circle cx="195" cy="505"  r="1.3" fill="#4dffb8" opacity="0.18"/>
  <circle cx="462" cy="555"  r="1.2" fill="#58d6ff" opacity="0.20"/>
  <circle cx="812" cy="535"  r="1.5" fill="#58d6ff" opacity="0.17"/>
  <circle cx="1072" cy="498" r="1"   fill="#4dffb8" opacity="0.22"/>

  <!-- Left card: coin size comparison -->
  <rect x="42" y="185" width="272" height="240" rx="14" fill="rgba(7,20,28,0.82)" stroke="rgba(88,214,255,0.16)" stroke-width="1"/>
  <rect x="42" y="185" width="272" height="4" rx="2" fill="#4dffb8" opacity="0.6"/>
  <text x="178" y="222" text-anchor="middle" font-family="Impact, Arial Narrow Bold, sans-serif" font-size="11" letter-spacing="2" fill="#4dffb8" opacity="0.8">PREMIUM COMPARISON</text>
  <text x="178" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="rgba(175,198,207,0.75)">1 oz coin: ~12% over spot</text>
  <text x="178" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="rgba(175,198,207,0.75)">1/2 oz coin: ~25% over spot</text>
  <text x="178" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="rgba(175,198,207,0.75)">1/4 oz coin: ~55% over spot</text>
  <rect x="70" y="324" width="216" height="1" rx="1" fill="rgba(88,214,255,0.15)"/>
  <text x="178" y="360" text-anchor="middle" font-family="Impact, Arial Narrow Bold, sans-serif" font-size="28" fill="#58d6ff">~130%</text>
  <text x="178" y="384" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="rgba(175,198,207,0.6)">1/10 oz over spot</text>
  <text x="178" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="rgba(88,214,255,0.5)">Same .999 fine silver</text>

  <!-- Center: main content -->
  <text x="600" y="180" text-anchor="middle" font-family="Impact, Arial Narrow Bold, sans-serif" font-size="13" letter-spacing="4" fill="#4dffb8" opacity="0.85">SILVER BUYING GUIDE &#183; 2026</text>
  <text x="600" y="256" text-anchor="middle" font-family="Impact, Arial Narrow Bold, sans-serif" font-size="66" letter-spacing="2" fill="#ecf8fb">FRACTIONAL</text>
  <text x="600" y="322" text-anchor="middle" font-family="Impact, Arial Narrow Bold, sans-serif" font-size="66" letter-spacing="2" fill="#ecf8fb">SILVER COINS</text>

  <!-- Big stat -->
  <text x="600" y="426" text-anchor="middle" font-family="Impact, Arial Narrow Bold, sans-serif" font-size="104" letter-spacing="-2" fill="#58d6ff">15-40%</text>
  <text x="600" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" letter-spacing="3" fill="rgba(175,198,207,0.65)">HIGHER PREMIUM PER OZ VS 1 OZ COINS</text>

  <!-- Star row -->
  <use href="#star-fc" transform="translate(564,492)" fill="#4dffb8" opacity="0.6"/>
  <use href="#star-fc" transform="translate(582,492)" fill="#4dffb8" opacity="0.6"/>
  <use href="#star-fc" transform="translate(600,492)" fill="#4dffb8" opacity="0.6"/>
  <use href="#star-fc" transform="translate(618,492)" fill="#4dffb8" opacity="0.6"/>
  <use href="#star-fc" transform="translate(636,492)" fill="#4dffb8" opacity="0.6"/>
  <text x="600" y="514" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="rgba(175,198,207,0.5)" letter-spacing="1">WHEN THE EXTRA COST IS WORTH PAYING</text>

  <!-- Right card: use cases -->
  <rect x="886" y="185" width="272" height="240" rx="14" fill="rgba(7,20,28,0.82)" stroke="rgba(88,214,255,0.16)" stroke-width="1"/>
  <rect x="886" y="185" width="272" height="4" rx="2" fill="#58d6ff" opacity="0.6"/>
  <text x="1022" y="222" text-anchor="middle" font-family="Impact, Arial Narrow Bold, sans-serif" font-size="11" letter-spacing="2" fill="#58d6ff" opacity="0.8">BEST USE CASES</text>
  <text x="1022" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="rgba(175,198,207,0.75)">Barter reserves</text>
  <text x="1022" y="284" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="rgba(175,198,207,0.75)">Gifting</text>
  <text x="1022" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="rgba(175,198,207,0.75)">Denomination flexibility</text>
  <rect x="910" y="326" width="224" height="1" rx="1" fill="rgba(88,214,255,0.15)"/>
  <text x="1022" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="rgba(175,198,207,0.6)">Start with 1 oz products.</text>
  <text x="1022" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="rgba(175,198,207,0.6)">Add fractional after</text>
  <text x="1022" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="rgba(175,198,207,0.6)">building a base.</text>

  <!-- Bottom brand bar -->
  <rect x="0" y="590" width="1200" height="40" fill="rgba(4,16,24,0.9)"/>
  <text x="600" y="614" text-anchor="middle" font-family="Impact, Arial Narrow Bold, sans-serif" font-size="13" letter-spacing="4" fill="rgba(88,214,255,0.5)">FUSEDDISTRIBUTION.COM</text>
</svg>
