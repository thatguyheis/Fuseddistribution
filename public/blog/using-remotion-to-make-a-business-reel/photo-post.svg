<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071a2c"/><stop offset="1" stop-color="#102d46"/></linearGradient><style>.brand{font:700 30px Arial,sans-serif;letter-spacing:5px;fill:#8ee6cd}.eyebrow{font:700 23px Arial,sans-serif;letter-spacing:3px;fill:#adc3d5}.hook{font:700 63px Arial,sans-serif;fill:white}.step{font:700 34px Arial,sans-serif;fill:white;letter-spacing:1px}.number{font:700 28px Arial,sans-serif;fill:#071a2c}.note{font:500 24px Arial,sans-serif;fill:#b9ccda}</style></defs><rect width="1080" height="1920" fill="url(#bg)"/><circle cx="914" cy="190" r="170" fill="#8ee6cd" opacity=".10"/><circle cx="135" cy="1545" r="215" fill="#8ee6cd" opacity=".08"/><text x="96" y="155" class="brand">FUSED DISTRIBUTION</text><text x="96" y="285" class="eyebrow">REMOTION BUSINESS REELS</text><text x="96" y="410" class="hook">Want reusable</text><text x="96" y="498" class="hook">business reels?</text><path d="M96 650 H984" stroke="#8ee6cd" stroke-width="4" opacity=".75"/><text x="96" y="760" class="eyebrow">A SIMPLE PRODUCTION PATH</text><g transform="translate(96 840)"><rect width="888" height="132" rx="28" fill="#142d46" stroke="#8ee6cd" stroke-width="3"/><circle cx="68" cy="66" r="30" fill="#8ee6cd"/><text x="68" y="77" text-anchor="middle" class="number">1</text><text x="132" y="79" class="step">QUESTION  →  SCENES</text></g><g transform="translate(96 1045)"><rect width="888" height="132" rx="28" fill="#142d46" stroke="#8ee6cd" stroke-width="3"/><circle cx="68" cy="66" r="30" fill="#8ee6cd"/><text x="68" y="77" text-anchor="middle" class="number">2</text><text x="132" y="79" class="step">TIME  →  RENDER</text></g><g transform="translate(96 1250)"><rect width="888" height="132" rx="28" fill="#142d46" stroke="#8ee6cd" stroke-width="3"/><circle cx="68" cy="66" r="30" fill="#8ee6cd"/><text x="68" y="77" text-anchor="middle" class="number">3</text><text x="132" y="79" class="step">REVIEW  →  PUBLISH</text></g><text x="96" y="1535" class="note">Conceptual workflow illustration. Steps vary by project.</text><rect x="96" y="1660" width="888" height="112" rx="24" fill="#8ee6cd"/><text x="540" y="1730" text-anchor="middle" class="step" fill="#071a2c">ONE CLEAR IDEA. ONE REVIEWED REEL.</text></svg>