<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"><rect width="1080" height="1080" fill="#081c29"/><text x="62" y="84" fill="#58d6ff" font-family="Arial" font-size="23">Fused Distribution</text><text x="62" y="150" fill="#f2f8fb" font-family="Arial" font-size="43" font-weight="700">Document shipment damage</text><text x="62" y="198" fill="#b7cbd4" font-family="Arial" font-size="22">Save evidence. Confirm the exact service rules.</text><g font-family="Arial"><rect x="62" y="275" width="956" height="150" rx="18" fill="#122d40"/><text x="92" y="330" fill="#58d6ff" font-size="25" font-weight="700">01  PHOTOGRAPH</text><text x="92" y="375" fill="#ecf5fa" font-size="23">Record the parcel and contents as found</text><rect x="62" y="455" width="956" height="150" rx="18" fill="#122d40"/><text x="92" y="510" fill="#58d6ff" font-size="25" font-weight="700">02  COMPARE</text><text x="92" y="555" fill="#ecf5fa" font-size="23">Check the invoice and packing list</text><rect x="62" y="635" width="956" height="150" rx="18" fill="#122d40"/><text x="92" y="690" fill="#58d6ff" font-size="25" font-weight="700">03  PRESERVE</text><text x="92" y="735" fill="#ecf5fa" font-size="23">Keep the item and all packaging</text><rect x="62" y="815" width="956" height="150" rx="18" fill="#122d40"/><text x="92" y="870" fill="#58d6ff" font-size="25" font-weight="700">04  CONFIRM</text><text x="92" y="915" fill="#ecf5fa" font-size="23">Ask which service terms apply</text></g></svg>