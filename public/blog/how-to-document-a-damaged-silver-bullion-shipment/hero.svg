<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#081c29"/><text x="86" y="82" fill="#58d6ff" font-family="Arial" font-size="25">Fused Distribution</text><text x="86" y="158" fill="#f2f8fb" font-family="Arial" font-size="52" font-weight="700">Document a damaged shipment</text><text x="86" y="210" fill="#b7cbd4" font-family="Arial" font-size="28">Keep observations, evidence and claim steps distinct</text><g font-family="Arial"><rect x="88" y="270" width="1424" height="116" rx="18" fill="#122d40"/><text x="122" y="317" fill="#58d6ff" font-size="30" font-weight="700">01  PHOTOGRAPH</text><text x="480" y="339" fill="#ecf5fa" font-size="27">Record parcel and contents as found</text><rect x="88" y="410" width="1424" height="116" rx="18" fill="#122d40"/><text x="122" y="457" fill="#58d6ff" font-size="30" font-weight="700">02  COMPARE</text><text x="480" y="479" fill="#ecf5fa" font-size="27">Check the invoice and packing list</text><rect x="88" y="550" width="1424" height="116" rx="18" fill="#122d40"/><text x="122" y="597" fill="#58d6ff" font-size="30" font-weight="700">03  PRESERVE</text><text x="480" y="619" fill="#ecf5fa" font-size="27">Save the item and packaging</text><rect x="88" y="690" width="1424" height="116" rx="18" fill="#122d40"/><text x="122" y="737" fill="#58d6ff" font-size="30" font-weight="700">04  CONFIRM</text><text x="480" y="759" fill="#ecf5fa" font-size="27">Ask which service rules apply</text></g></svg>