<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080"><rect width="1080" height="1080" fill="#081c29"/><g font-family="Arial"><text x="80" y="90" fill="#58d6ff" font-size="26">Fused Distribution</text><text x="80" y="180" fill="white" font-size="48" font-weight="700">Check your booking links</text><text x="80" y="235" fill="#bad0dd" font-size="28">Follow the path your customer takes</text><rect x="80" y="290" width="920" height="110" rx="16" fill="#173346"/><text x="115" y="334" fill="#58d6ff" font-size="30">FIND THE BUTTON</text><text x="115" y="372" fill="white" font-size="26">Start from the public website</text><rect x="80" y="425" width="920" height="110" rx="16" fill="#173346"/><text x="115" y="469" fill="#58d6ff" font-size="30">CHECK THE DESTINATION</text><text x="115" y="507" fill="white" font-size="26">Confirm the service and calendar</text><rect x="80" y="560" width="920" height="110" rx="16" fill="#173346"/><text x="115" y="604" fill="#58d6ff" font-size="30">TEST THE NEXT STEP</text><text x="115" y="642" fill="white" font-size="26">Use an agreed safe test</text><rect x="80" y="695" width="920" height="110" rx="16" fill="#173346"/><text x="115" y="739" fill="#58d6ff" font-size="30">VERIFY THE FIX</text><text x="115" y="777" fill="white" font-size="26">Repeat the customer path</text></g></svg>