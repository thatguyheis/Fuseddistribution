<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <radialGradient id="glow-c" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#58d6ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#58d6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-tl" cx="5%" cy="5%" r="55%">
      <stop offset="0%" stop-color="#4dffb8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4dffb8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1200" fill="#041018"/>
  <rect width="1200" height="1200" fill="url(#glow-c)"/>
  <rect width="1200" height="1200" fill="url(#glow-tl)"/>

  <!-- Grid lines -->
  <line x1="170" y1="0" x2="170" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="340" y1="0" x2="340" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="510" y1="0" x2="510" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="680" y1="0" x2="680" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="850" y1="0" x2="850" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="1020" y1="0" x2="1020" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>

  <!-- Rings -->
  <circle cx="600" cy="600" r="420" fill="none" stroke="#58d6ff" stroke-opacity="0.07" stroke-width="1"/>
  <circle cx="600" cy="600" r="280" fill="none" stroke="#58d6ff" stroke-opacity="0.10" stroke-width="1"/>

  <!-- Scatter dots -->
  <circle cx="88" cy="112" r="1.5" fill="#58d6ff" fill-opacity="0.22"/>
  <circle cx="260" cy="78" r="1.2" fill="#4dffb8" fill-opacity="0.18"/>
  <circle cx="520" cy="95" r="1" fill="#58d6ff" fill-opacity="0.20"/>
  <circle cx="820" cy="68" r="1.5" fill="#4dffb8" fill-opacity="0.17"/>
  <circle cx="1050" cy="105" r="1.2" fill="#58d6ff" fill-opacity="0.22"/>
  <circle cx="140" cy="1080" r="1.5" fill="#58d6ff" fill-opacity="0.18"/>
  <circle cx="700" cy="1100" r="1.2" fill="#4dffb8" fill-opacity="0.15"/>
  <circle cx="1080" cy="1060" r="1" fill="#58d6ff" fill-opacity="0.20"/>

  <!-- Top zone: category eyebrow + brand mark -->
  <text x="600" y="100" text-anchor="middle" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="18" letter-spacing="5" fill="rgba(88,214,255,0.55)">SOCIAL MEDIA &#183; VIDEO MARKETING</text>
  <text x="600" y="158" text-anchor="middle" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="44" letter-spacing="6" fill="rgba(88,214,255,0.90)">FUSED</text>

  <!-- Divider -->
  <line x1="200" y1="180" x2="1000" y2="180" stroke="rgba(88,214,255,0.15)" stroke-width="1"/>

  <!-- Center zone: title -->
  <text x="600" y="290" text-anchor="middle" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="68" letter-spacing="2" fill="#ecf8fb">SHORT-FORM</text>
  <text x="600" y="368" text-anchor="middle" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="68" letter-spacing="2" fill="#ecf8fb">VIDEO FOR</text>
  <text x="600" y="446" text-anchor="middle" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="68" letter-spacing="2" fill="#58d6ff">LOCAL BUSINESS</text>

  <!-- Divider -->
  <line x1="300" y1="478" x2="900" y2="478" stroke="rgba(88,214,255,0.20)" stroke-width="1"/>

  <!-- Key stat: big number -->
  <text x="600" y="610" text-anchor="middle" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="220" fill="#58d6ff" letter-spacing="2">22%</text>
  <text x="600" y="660" text-anchor="middle" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="30" letter-spacing="3" fill="rgba(175,198,207,0.85)">MORE REACH ON INSTAGRAM REELS</text>
  <text x="600" y="695" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="16" letter-spacing="2" fill="rgba(175,198,207,0.50)">Socialinsider, 2024 Instagram Benchmark Report</text>

  <!-- Supporting stat chips -->
  <rect x="140" y="740" width="270" height="80" rx="10" fill="rgba(88,214,255,0.06)" stroke="rgba(88,214,255,0.18)" stroke-width="1"/>
  <text x="275" y="774" text-anchor="middle" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="32" fill="#4dffb8">170M</text>
  <text x="275" y="800" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="12" fill="rgba(175,198,207,0.65)" letter-spacing="1">TikTok USA users</text>

  <rect x="465" y="740" width="270" height="80" rx="10" fill="rgba(88,214,255,0.06)" stroke="rgba(88,214,255,0.18)" stroke-width="1"/>
  <text x="600" y="774" text-anchor="middle" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="32" fill="#58d6ff">91%</text>
  <text x="600" y="800" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="12" fill="rgba(175,198,207,0.65)" letter-spacing="1">consumers want more video</text>

  <rect x="790" y="740" width="270" height="80" rx="10" fill="rgba(88,214,255,0.06)" stroke="rgba(88,214,255,0.18)" stroke-width="1"/>
  <text x="925" y="774" text-anchor="middle" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="32" fill="#4dffb8">#1</text>
  <text x="925" y="800" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="12" fill="rgba(175,198,207,0.65)" letter-spacing="1">ROI format 4 years running</text>

  <!-- Excerpt line -->
  <line x1="200" y1="860" x2="1000" y2="860" stroke="rgba(88,214,255,0.12)" stroke-width="1"/>
  <text x="600" y="920" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="22" fill="rgba(175,198,207,0.75)">5 video types that consistently drive</text>
  <text x="600" y="952" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="22" fill="rgba(175,198,207,0.75)">local customers. No production crew needed.</text>

  <!-- Bottom CTA shape -->
  <rect x="200" y="1020" width="800" height="100" rx="16" fill="rgba(4,16,24,0.85)" stroke="#58d6ff" stroke-opacity="0.35" stroke-width="1"/>
  <text x="600" y="1062" text-anchor="middle" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="14" letter-spacing="3" fill="rgba(88,214,255,0.70)">FULL BREAKDOWN AT</text>
  <text x="600" y="1096" text-anchor="middle" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="22" letter-spacing="2" fill="#58d6ff">fuseddistribution.com</text>
</svg>
