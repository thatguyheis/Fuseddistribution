  <text x="1022" y="208" text-anchor="middle" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="14" letter-spacing="2" fill="rgba(77,255,184,0.70)">#1 ROI FORMAT</text>
  <text x="1022" y="258" text-anchor="middle" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="52" fill="#4dffb8" letter-spacing="1">4</text>
