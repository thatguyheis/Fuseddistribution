  <text x="600" y="396" text-anchor="middle" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="96" fill="#58d6ff" letter-spacing="2">22%</text>
  <text x="600" y="428" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="15" letter-spacing="3" fill="rgba(175,198,207,0.75)">MORE REACH ON INSTAGRAM REELS</text>
