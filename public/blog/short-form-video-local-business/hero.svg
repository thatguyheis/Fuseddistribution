  <text x="178" y="208" text-anchor="middle" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="14" letter-spacing="2" text-transform="uppercase" fill="rgba(88,214,255,0.70)">TIKTOK USA</text>
