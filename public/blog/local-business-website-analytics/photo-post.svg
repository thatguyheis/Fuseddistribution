<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <radialGradient id="glow-c" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#58d6ff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#58d6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-tl" cx="0%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#4dffb8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4dffb8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1200" fill="#041018"/>
  <rect width="1200" height="1200" fill="url(#glow-c)"/>
  <rect width="1200" height="1200" fill="url(#glow-tl)"/>

  <!-- Grid lines -->
  <line x1="170" y1="0" x2="170" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="340" y1="0" x2="340" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="510" y1="0" x2="510" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="680" y1="0" x2="680" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="850" y1="0" x2="850" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="1020" y1="0" x2="1020" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>

  <!-- Rings -->
  <circle cx="600" cy="600" r="420" fill="none" stroke="#58d6ff" stroke-width="1" opacity="0.07"/>
  <circle cx="600" cy="600" r="280" fill="none" stroke="#58d6ff" stroke-width="1" opacity="0.10"/>

  <!-- Scatter dots -->
  <circle cx="142" cy="110" r="1.4" fill="#58d6ff" opacity="0.22"/>
  <circle cx="380" cy="68" r="1.6" fill="#4dffb8" opacity="0.26"/>
  <circle cx="920" cy="90" r="1.3" fill="#58d6ff" opacity="0.18"/>
  <circle cx="1080" cy="160" r="1.5" fill="#4dffb8" opacity="0.24"/>
  <circle cx="198" cy="1050" r="1.4" fill="#58d6ff" opacity="0.20"/>
  <circle cx="760" cy="1100" r="1.6" fill="#4dffb8" opacity="0.25"/>
  <circle cx="1110" cy="940" r="1.3" fill="#58d6ff" opacity="0.18"/>
  <circle cx="84" cy="620" r="1.5" fill="#4dffb8" opacity="0.20"/>
  <circle cx="498" cy="1140" r="1.4" fill="#58d6ff" opacity="0.21"/>
  <circle cx="1060" cy="580" r="1.2" fill="#4dffb8" opacity="0.17"/>

  <!-- Top zone: eyebrow + brand -->
  <text x="600" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="4" fill="rgba(88,214,255,0.55)">FUSED TECHNOLOGY SOLUTIONS</text>
  <rect x="430" y="124" width="340" height="48" rx="12" fill="rgba(88,214,255,0.08)" stroke="rgba(88,214,255,0.22)" stroke-width="1"/>
  <text x="600" y="155" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#58d6ff">WEBSITES &#183; ANALYTICS</text>

