  <text x="600" y="286" text-anchor="middle" font-family="Impact,sans-serif" font-size="86" letter-spacing="2" fill="#ecf8fb">WEBSITE</text>
  <text x="600" y="376" text-anchor="middle" font-family="Impact,sans-serif" font-size="86" letter-spacing="2" fill="#58d6ff">ANALYTICS</text>
  <text x="600" y="440" text-anchor="middle" font-family="Impact,sans-serif" font-size="56" letter-spacing="1" fill="rgba(175,198,207,0.75)">FOR LOCAL BUSINESS</text>

  <!-- Divider -->
  <line x1="200" y1="472" x2="1000" y2="472" stroke="rgba(88,214,255,0.18)" stroke-width="1"/>

  <!-- Big stat -->
  <text x="600" y="606" text-anchor="middle" font-family="Impact,sans-serif" font-size="200" fill="#58d6ff" opacity="0.95">39%</text>
  <text x="600" y="660" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="rgba(175,198,207,0.85)">of small businesses track their website data</text>
  <text x="600" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="rgba(175,198,207,0.50)">Clutch, Small Business Website Survey 2024</text>

  <!-- Divider -->
  <line x1="200" y1="720" x2="1000" y2="720" stroke="rgba(88,214,255,0.12)" stroke-width="1"/>

  <!-- Excerpt text -->
  <text x="600" y="775" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="rgba(175,198,207,0.80)">GA4 + Search Console are both free.</text>
  <text x="600" y="810" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="rgba(175,198,207,0.80)">Setup takes 15 minutes.</text>
  <text x="600" y="845" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="rgba(175,198,207,0.75)">Phone clicks reveal your real lead count.</text>

