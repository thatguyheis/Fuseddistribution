  <rect x="902" y="330" width="240" height="150" rx="18" fill="rgba(7,18,26,0.85)" stroke="rgba(88,214,255,0.15)" stroke-width="1"/>
  <text x="1022" y="368" text-anchor="middle" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="13" letter-spacing="3" fill="rgba(88,214,255,0.55)">Q&amp;A SECTION</text>
  <text x="1022" y="428" text-anchor="middle" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="38" fill="#58d6ff">SEED IT</text>
  <text x="1022" y="462" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="12" fill="rgba(175,198,207,0.50)">answer before customers ask</text>

  <!-- Bottom divider and footer -->
