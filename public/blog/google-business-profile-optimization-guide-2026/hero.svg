  <rect x="582" y="436" width="225" height="36" rx="10" fill="rgba(88,214,255,0.06)" stroke="rgba(88,214,255,0.18)" stroke-width="1"/>
  <text x="694" y="459" text-anchor="middle" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="15" letter-spacing="2" fill="rgba(88,214,255,0.80)">WEEKLY SYSTEM</text>

