  <rect x="902" y="100" width="240" height="210" rx="18" fill="rgba(7,18,26,0.85)" stroke="rgba(88,214,255,0.20)" stroke-width="1.2"/>
  <text x="1022" y="148" text-anchor="middle" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="13" letter-spacing="3" fill="rgba(88,214,255,0.65)">WITH PHOTOS</text>
  <text x="1022" y="216" text-anchor="middle" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="90" fill="#4dffb8">42%</text>
  <text x="1022" y="252" text-anchor="middle" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="15" letter-spacing="2" fill="rgba(175,198,207,0.75)">MORE DIRECTIONS</text>
  <text x="1022" y="288" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="12" fill="rgba(175,198,207,0.50)">update photos monthly</text>

