<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#58d6ff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#041018" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="card-glow-r" cx="78%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#4dffb8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#041018" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58d6ff"/>
      <stop offset="100%" stop-color="#4dffb8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#041018"/>
