  <line x1="150" y1="0" x2="150" y2="630" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="630" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="450" y1="0" x2="450" y2="630" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="750" y1="0" x2="750" y2="630" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="900" y1="0" x2="900" y2="630" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="1050" y1="0" x2="1050" y2="630" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>

  <circle cx="80"  cy="58"  r="1.4" fill="#58d6ff" fill-opacity="0.22"/>
  <circle cx="220" cy="40"  r="1.2" fill="#4dffb8" fill-opacity="0.18"/>
  <circle cx="975" cy="48"  r="1.4" fill="#58d6ff" fill-opacity="0.20"/>
  <circle cx="1118" cy="68" r="1.2" fill="#4dffb8" fill-opacity="0.18"/>
  <circle cx="95"  cy="574" r="1.2" fill="#58d6ff" fill-opacity="0.18"/>
  <circle cx="1105" cy="568" r="1.4" fill="#4dffb8" fill-opacity="0.15"/>

  <!-- Top eyebrow -->
