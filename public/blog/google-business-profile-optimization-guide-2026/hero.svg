  <text x="600" y="158" text-anchor="middle" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="28" letter-spacing="4" fill="rgba(175,198,207,0.60)">OPTIMIZATION GUIDE</text>
  <text x="600" y="248" text-anchor="middle" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="78" letter-spacing="2" fill="#ecf8fb">GOOGLE</text>
  <text x="600" y="330" text-anchor="middle" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="78" letter-spacing="2" fill="#58d6ff">BUSINESS</text>
  <text x="600" y="412" text-anchor="middle" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="78" letter-spacing="2" fill="#4dffb8">PROFILE</text>

