  <text x="600" y="534" text-anchor="middle" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="13" letter-spacing="4" fill="rgba(88,214,255,0.35)">FUSEDDISTRIBUTION.COM</text>
