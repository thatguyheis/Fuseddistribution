<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Measure cost per new customer</title>
  <desc id="desc">A conceptual diagram showing campaign costs divided by first-time customers to estimate cost per acquired customer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131a"/><stop offset="1" stop-color="#102b38"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#58d6ff"/><stop offset="1" stop-color="#4dffb8"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#bg)"/>
  <circle cx="1050" cy="85" r="170" fill="#58d6ff" opacity=".06"/>
  <circle cx="120" cy="550" r="200" fill="#4dffb8" opacity=".04"/>
  <text x="72" y="70" fill="#58d6ff" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="6">FUSED DISTRIBUTION  /  BUSINESS GROWTH</text>
  <text x="72" y="150" fill="#f0fbff" font-family="Arial,sans-serif" font-size="52" font-weight="700">Know your cost per new customer</text>
  <text x="75" y="194" fill="#b5cbd3" font-family="Arial,sans-serif" font-size="22">A weekly check that connects one campaign to first-time buyers</text>

  <g transform="translate(72 252)">
    <rect width="270" height="236" rx="24" fill="#0d202b" stroke="#58d6ff" stroke-opacity=".6" stroke-width="2"/>
    <path d="M105 58h60l20 20v68H85V78z" fill="#142f3b" stroke="#58d6ff" stroke-width="3"/>
    <path d="M165 58v24h20M101 99h68M101 116h56" fill="none" stroke="#b5cbd3" stroke-width="4" stroke-linecap="round"/>
    <circle cx="135" cy="166" r="30" fill="url(#accent)"/>
    <text x="135" y="176" fill="#07131a" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700">$</text>
    <text x="135" y="218" fill="#f0fbff" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700">SPEND</text>
  </g>
  <text x="382" y="390" fill="#58d6ff" font-family="Arial,sans-serif" font-size="48" font-weight="700">÷</text>
  <g transform="translate(455 252)">
    <rect width="270" height="236" rx="24" fill="#0d202b" stroke="#58d6ff" stroke-opacity=".6" stroke-width="2"/>
    <circle cx="135" cy="110" r="32" fill="#58d6ff"/>
    <circle cx="86" cy="126" r="23" fill="#4dffb8" opacity=".92"/>
    <circle cx="184" cy="126" r="23" fill="#4dffb8" opacity=".92"/>
    <path d="M75 182c3-25 21-39 46-39m28 0c25 0 43 14 46 39" fill="none" stroke="#b5cbd3" stroke-width="9" stroke-linecap="round"/>
    <text x="135" y="218" fill="#f0fbff" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700">NEW BUYERS</text>
  </g>
  <text x="765" y="390" fill="#58d6ff" font-family="Arial,sans-serif" font-size="48" font-weight="700">=</text>
  <g transform="translate(855 252)">
    <rect width="270" height="236" rx="24" fill="#0d202b" stroke="#4dffb8" stroke-opacity=".85" stroke-width="3"/>
    <path d="M86 75h93l34 38-79 79-48-48z" fill="#102e39" stroke="url(#accent)" stroke-width="8" stroke-linejoin="round"/>
    <circle cx="173" cy="100" r="8" fill="#b5cbd3"/>
    <text x="133" y="145" fill="#f0fbff" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="700">$</text>
    <text x="135" y="218" fill="#f0fbff" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700">PER CUSTOMER</text>
  </g>
  <rect x="72" y="535" width="475" height="42" rx="21" fill="#122b36" stroke="#58d6ff" stroke-opacity=".45"/>
  <text x="309" y="563" fill="#b5cbd3" text-anchor="middle" font-family="Arial,sans-serif" font-size="18">CONCEPTUAL FORMULA  •  NOT A BENCHMARK</text>
  <text x="1125" y="562" fill="#58d6ff" text-anchor="end" font-family="Arial,sans-serif" font-size="18" font-weight="700">FUSED</text>
</svg>
