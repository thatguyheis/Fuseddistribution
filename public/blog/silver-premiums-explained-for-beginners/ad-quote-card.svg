<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <radialGradient id="qc-glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#58d6ff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#58d6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1200" fill="#041018"/>
  <rect width="1200" height="1200" fill="url(#qc-glow)"/>

  <!-- Grid lines -->
  <line x1="0" y1="400" x2="1200" y2="400" stroke="rgba(88,214,255,0.04)" stroke-width="1"/>
  <line x1="0" y1="800" x2="1200" y2="800" stroke="rgba(88,214,255,0.04)" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="1200" stroke="rgba(88,214,255,0.04)" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="1200" stroke="rgba(88,214,255,0.04)" stroke-width="1"/>

  <!-- Giant quote mark -->
  <text x="140" y="330" font-family="Georgia, serif" font-size="280" fill="rgba(88,214,255,0.30)">&#8220;</text>

  <!-- Quote -->
  <text x="600" y="430" text-anchor="middle" font-family="Georgia, serif" font-size="58" font-style="italic" fill="#ecf8fb">The spot price is</text>
  <text x="600" y="515" text-anchor="middle" font-family="Georgia, serif" font-size="58" font-style="italic" fill="#ecf8fb">never your price.</text>
  <text x="600" y="640" text-anchor="middle" font-family="Georgia, serif" font-size="58" font-style="italic" fill="#58d6ff">The premium is where</text>
  <text x="600" y="725" text-anchor="middle" font-family="Georgia, serif" font-size="58" font-style="italic" fill="#58d6ff">beginners save money</text>
  <text x="600" y="810" text-anchor="middle" font-family="Georgia, serif" font-size="58" font-style="italic" fill="#58d6ff">or give it away.</text>

  <!-- Divider -->
  <line x1="450" y1="880" x2="750" y2="880" stroke="rgba(77,255,184,0.35)" stroke-width="2"/>

  <!-- Attribution -->
  <text x="600" y="945" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="28" fill="rgba(175,198,207,0.70)">Silver Premiums Explained for Beginners</text>
  <text x="600" y="990" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="24" fill="rgba(88,214,255,0.55)">fuseddistribution.com/blog</text>

  <!-- Bottom brand -->
  <text x="1150" y="1150" text-anchor="end" font-family="'Trebuchet MS',sans-serif" font-size="22" fill="rgba(88,214,255,0.50)">fuseddistribution.com</text>
  <text x="50" y="1150" text-anchor="start" font-family="'Trebuchet MS',sans-serif" font-size="20" fill="rgba(77,255,184,0.35)">FUSED RESERVE</text>
</svg>
