<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630"><rect width="1200" height="630" fill="#07141c"/><text x="60" y="70" fill="#58d6ff" font-family="Arial" font-size="20" font-weight="700">FUSED DISTRIBUTION / PRACTICAL GUIDE</text><text x="60" y="140" fill="#ecf8fb" font-family="Arial" font-size="42" font-weight="700">401(k) to Silver IRA</text><text x="60" y="185" fill="#ecf8fb" font-family="Arial" font-size="30">What to check before a rollover</text><g font-family="Arial" font-size="24" font-weight="700"><rect x="60" y="260" width="330" height="180" rx="18" fill="#123746" stroke="#58d6ff" stroke-width="3"/><text x="90" y="315" fill="#58d6ff">1  ELIGIBILITY</text><text x="90" y="355" fill="#ecf8fb" font-size="20">Ask the plan</text><text x="90" y="385" fill="#ecf8fb" font-size="20">administrator first</text><rect x="435" y="260" width="330" height="180" rx="18" fill="#123746" stroke="#58d6ff" stroke-width="3"/><text x="465" y="315" fill="#58d6ff">2  TRANSFER</text><text x="465" y="355" fill="#ecf8fb" font-size="20">Compare direct</text><text x="465" y="385" fill="#ecf8fb" font-size="20">and 60 day paths</text><rect x="810" y="260" width="330" height="180" rx="18" fill="#123746" stroke="#58d6ff" stroke-width="3"/><text x="840" y="315" fill="#58d6ff">3  CUSTODY</text><text x="840" y="355" fill="#ecf8fb" font-size="20">Confirm silver</text><text x="840" y="385" fill="#ecf8fb" font-size="20">and storage terms</text></g><text x="60" y="550" fill="#b8d4dc" font-family="Arial" font-size="20">Educational checklist. Confirm current rules and plan documents.</text></svg>
