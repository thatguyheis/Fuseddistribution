<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"><rect width="1080" height="1080" fill="#10212b"/><rect x="90" y="100" width="900" height="880" rx="36" fill="#f7f8f8"/><text x="145" y="198" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#168c8c">WEBSITE REDIRECT AUDIT</text><text x="145" y="281" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#10212b">Trace the full path</text><g font-family="Arial,sans-serif" font-size="24" fill="#243740"><circle cx="168" cy="377" r="15" fill="#58d6ff"/><text x="210" y="386">List old URLs that matter</text><circle cx="168" cy="480" r="15" fill="#58d6ff"/><text x="210" y="489">Write down the intended page</text><circle cx="168" cy="583" r="15" fill="#58d6ff"/><text x="210" y="592">Test the final destination</text><circle cx="168" cy="686" r="15" fill="#58d6ff"/><text x="210" y="695">Spot loops and broken paths</text><circle cx="168" cy="789" r="15" fill="#58d6ff"/><text x="210" y="798">Ask an administrator to fix</text></g><path d="M146 867h785" stroke="#cad4d7" stroke-width="3"/><text x="145" y="916" font-family="Arial,sans-serif" font-size="18" fill="#546970">A redirect check is not a promise of search traffic.</text></svg>
