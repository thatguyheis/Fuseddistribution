  <text x="600" y="848" fill="rgba(175,198,207,0.82)" font-size="20" font-family="Trebuchet MS,sans-serif" text-anchor="middle">Google uses citations to verify your business is real</text>
  <text x="600" y="874" fill="rgba(175,198,207,0.82)" font-size="20" font-family="Trebuchet MS,sans-serif" text-anchor="middle">and located where you say it is. Get them right.</text>

