  <text x="600" y="1048" fill="rgba(88,214,255,0.45)" font-size="13" font-family="Trebuchet MS,sans-serif" font-weight="800" letter-spacing="0.22em" text-anchor="middle">FUSEDDISTRIBUTION.COM</text>
