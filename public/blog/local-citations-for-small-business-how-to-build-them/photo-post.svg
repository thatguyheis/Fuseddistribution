  <text x="960" y="692" fill="#ecf8fb" font-size="32" font-family="Impact,sans-serif" letter-spacing="0.04em" text-anchor="middle">LIST + REVIEW</text>
  <text x="960" y="720" fill="rgba(175,198,207,0.75)" font-size="13" font-family="Trebuchet MS,sans-serif" text-anchor="middle">Top 7 directories first.</text>
  <text x="960" y="740" fill="rgba(175,198,207,0.75)" font-size="13" font-family="Trebuchet MS,sans-serif" text-anchor="middle">Then get reviews weekly.</text>
  <text x="960" y="776" fill="#4dffb8" font-size="20" font-family="Impact,sans-serif" letter-spacing="0.06em" text-anchor="middle">87% READ REVIEWS</text>

