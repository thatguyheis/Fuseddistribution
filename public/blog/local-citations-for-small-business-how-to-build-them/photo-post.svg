  <text x="600" y="740" fill="rgba(175,198,207,0.75)" font-size="13" font-family="Trebuchet MS,sans-serif" text-anchor="middle">Identical everywhere.</text>
  <text x="600" y="776" fill="#58d6ff" font-size="20" font-family="Impact,sans-serif" letter-spacing="0.06em" text-anchor="middle">CONSISTENCY WINS</text>

