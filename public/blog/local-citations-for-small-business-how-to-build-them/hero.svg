  <circle cx="600" cy="315" r="255" fill="none" stroke="#58d6ff" stroke-width="1" opacity="0.07"/>
  <circle cx="600" cy="315" r="170" fill="none" stroke="#58d6ff" stroke-width="1" opacity="0.11"/>

  <!-- Scatter dots -->
  <circle cx="142" cy="88" r="1.5" fill="#58d6ff" opacity="0.22"/>
  <circle cx="388" cy="52" r="1" fill="#4dffb8" opacity="0.18"/>
  <circle cx="756" cy="74" r="1.5" fill="#58d6ff" opacity="0.25"/>
  <circle cx="1021" cy="118" r="1" fill="#4dffb8" opacity="0.20"/>
  <circle cx="224" cy="510" r="1.5" fill="#58d6ff" opacity="0.15"/>
  <circle cx="968" cy="482" r="1" fill="#4dffb8" opacity="0.18"/>
  <circle cx="484" cy="572" r="1.5" fill="#58d6ff" opacity="0.22"/>
  <circle cx="880" cy="540" r="1" fill="#4dffb8" opacity="0.20"/>

  <!-- Left card: GBP -->
  <rect x="42" y="148" width="280" height="148" rx="14" fill="rgba(7,18,26,0.82)" stroke="rgba(88,214,255,0.18)" stroke-width="1"/>
  <text x="62" y="182" fill="#58d6ff" font-size="11" font-family="Trebuchet MS,sans-serif" font-weight="800" letter-spacing="0.1em">GOOGLE BUSINESS PROFILE</text>
  <text x="62" y="212" fill="#ecf8fb" font-size="38" font-family="Impact,sans-serif" letter-spacing="0.03em">36%</text>
  <text x="62" y="234" fill="#afc6cf" font-size="12" font-family="Trebuchet MS,sans-serif">of Map Pack ranking weight</text>
  <text x="62" y="252" fill="rgba(175,198,207,0.55)" font-size="11" font-family="Trebuchet MS,sans-serif">Whitespark 2023</text>
  <text x="62" y="274" fill="#4dffb8" font-size="11" font-family="Trebuchet MS,sans-serif" font-weight="700">&#9679; #1 Local Signal</text>

