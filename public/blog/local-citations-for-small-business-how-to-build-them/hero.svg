  <rect x="460" y="378" width="280" height="68" rx="14" fill="rgba(88,214,255,0.08)" stroke="rgba(88,214,255,0.28)" stroke-width="1"/>
  <text x="600" y="406" fill="#58d6ff" font-size="11" font-family="Trebuchet MS,sans-serif" font-weight="800" letter-spacing="0.12em" text-anchor="middle">KEY INSIGHT</text>
  <text x="600" y="432" fill="#ecf8fb" font-size="16" font-family="Trebuchet MS,sans-serif" text-anchor="middle">46% of all Google searches have local intent</text>

  <!-- Right card: NAP -->
  <rect x="878" y="148" width="280" height="148" rx="14" fill="rgba(7,18,26,0.82)" stroke="rgba(88,214,255,0.18)" stroke-width="1"/>
  <text x="898" y="182" fill="#58d6ff" font-size="11" font-family="Trebuchet MS,sans-serif" font-weight="800" letter-spacing="0.1em">NAP CONSISTENCY</text>
  <text x="898" y="210" fill="#ecf8fb" font-size="28" font-family="Impact,sans-serif" letter-spacing="0.03em">NAME</text>
  <text x="898" y="234" fill="#afc6cf" font-size="28" font-family="Impact,sans-serif" letter-spacing="0.03em">ADDRESS</text>
  <text x="898" y="258" fill="#4dffb8" font-size="28" font-family="Impact,sans-serif" letter-spacing="0.03em">PHONE</text>
  <text x="898" y="280" fill="rgba(175,198,207,0.55)" font-size="11" font-family="Trebuchet MS,sans-serif">Must match everywhere &#8212; exactly</text>

  <!-- Right card: Directories -->
  <rect x="878" y="318" width="280" height="148" rx="14" fill="rgba(7,18,26,0.82)" stroke="rgba(88,214,255,0.12)" stroke-width="1"/>
  <text x="898" y="350" fill="#4dffb8" font-size="11" font-family="Trebuchet MS,sans-serif" font-weight="800" letter-spacing="0.1em">TOP DIRECTORIES</text>
  <text x="898" y="376" fill="rgba(175,198,207,0.9)" font-size="13" font-family="Trebuchet MS,sans-serif">&#9679; Google Business Profile</text>
  <text x="898" y="396" fill="rgba(175,198,207,0.9)" font-size="13" font-family="Trebuchet MS,sans-serif">&#9679; Apple Maps</text>
  <text x="898" y="416" fill="rgba(175,198,207,0.9)" font-size="13" font-family="Trebuchet MS,sans-serif">&#9679; Yelp &#183; Facebook</text>
  <text x="898" y="436" fill="rgba(175,198,207,0.9)" font-size="13" font-family="Trebuchet MS,sans-serif">&#9679; Bing Places</text>
  <text x="898" y="456" fill="rgba(175,198,207,0.9)" font-size="13" font-family="Trebuchet MS,sans-serif">&#9679; Industry Directories</text>

  <!-- Brand -->
  <text x="600" y="598" fill="rgba(88,214,255,0.45)" font-size="13" font-family="Trebuchet MS,sans-serif" font-weight="800" letter-spacing="0.2em" text-anchor="middle">FUSEDDISTRIBUTION.COM</text>
