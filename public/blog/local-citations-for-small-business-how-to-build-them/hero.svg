  <text x="600" y="218" fill="#ecf8fb" font-size="58" font-family="Impact,Haettenschweiler,sans-serif" letter-spacing="0.04em" text-anchor="middle" text-transform="uppercase">LOCAL CITATIONS</text>
  <text x="600" y="278" fill="#58d6ff" font-size="44" font-family="Impact,Haettenschweiler,sans-serif" letter-spacing="0.06em" text-anchor="middle">FOR SMALL BUSINESS</text>
