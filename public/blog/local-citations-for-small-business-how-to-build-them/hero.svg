  <rect x="42" y="318" width="280" height="148" rx="14" fill="rgba(7,18,26,0.82)" stroke="rgba(88,214,255,0.12)" stroke-width="1"/>
  <text x="62" y="350" fill="#4dffb8" font-size="11" font-family="Trebuchet MS,sans-serif" font-weight="800" letter-spacing="0.1em">REVIEW SIGNALS</text>
  <text x="62" y="380" fill="#ecf8fb" font-size="38" font-family="Impact,sans-serif" letter-spacing="0.03em">87%</text>
  <text x="62" y="402" fill="#afc6cf" font-size="12" font-family="Trebuchet MS,sans-serif">of consumers read reviews</text>
  <text x="62" y="420" fill="rgba(175,198,207,0.55)" font-size="11" font-family="Trebuchet MS,sans-serif">BrightLocal 2023</text>
