  <circle cx="350" cy="80" r="1" fill="#4dffb8" opacity="0.18"/>
  <circle cx="780" cy="60" r="1.5" fill="#58d6ff" opacity="0.20"/>
  <circle cx="1050" cy="140" r="1" fill="#4dffb8" opacity="0.22"/>
  <circle cx="1140" cy="90" r="1.5" fill="#58d6ff" opacity="0.15"/>
  <circle cx="55" cy="700" r="1" fill="#4dffb8" opacity="0.18"/>
  <circle cx="1155" cy="680" r="1.5" fill="#58d6ff" opacity="0.20"/>
  <circle cx="900" cy="1100" r="1" fill="#4dffb8" opacity="0.22"/>
  <circle cx="180" cy="1080" r="1.5" fill="#58d6ff" opacity="0.18"/>
  <circle cx="490" cy="1140" r="1" fill="#58d6ff" opacity="0.16"/>

