<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"><rect width="1080" height="1080" fill="#081c29"/><text x="90" y="90" fill="#58d6ff" font-size="25">Fused Distribution</text><text x="90" y="174" fill="white" font-family="Arial" font-size="50" font-weight="700">Review website changes</text><text x="90" y="229" fill="#bad0dd" font-size="29">A checklist before and after publication</text><g font-family="Arial"><rect x="90" y="290" width="900" height="110" rx="18" fill="#122d40"/><text x="125" y="335" fill="#58d6ff" font-size="30" font-weight="700">1. PREVIEW</text><text x="125" y="372" fill="#ecf5fa" font-size="26">Name the version</text><rect x="90" y="425" width="900" height="110" rx="18" fill="#122d40"/><text x="125" y="470" fill="#58d6ff" font-size="30" font-weight="700">2. TEST</text><text x="125" y="507" fill="#ecf5fa" font-size="26">Follow the customer task</text><rect x="90" y="560" width="900" height="110" rx="18" fill="#122d40"/><text x="125" y="605" fill="#58d6ff" font-size="30" font-weight="700">3. APPROVE</text><text x="125" y="642" fill="#ecf5fa" font-size="26">Record the decision</text><rect x="90" y="695" width="900" height="110" rx="18" fill="#122d40"/><text x="125" y="740" fill="#58d6ff" font-size="30" font-weight="700">4. VERIFY</text><text x="125" y="777" fill="#ecf5fa" font-size="26">Check the live result</text></g></svg>