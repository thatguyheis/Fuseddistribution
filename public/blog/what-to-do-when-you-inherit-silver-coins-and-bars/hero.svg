<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630"><rect width="1200" height="630" fill="#07141c"/><text x="72" y="92" fill="#58d6ff" font-family="Arial" font-size="22" font-weight="700" letter-spacing="3">FUSED DISTRIBUTION / PRACTICAL GUIDE</text><text x="72" y="185" fill="#ecf8fb" font-family="Arial" font-size="50" font-weight="800">INHERITED SILVER:</text><text x="72" y="245" fill="#ecf8fb" font-family="Arial" font-size="50" font-weight="800">START WITH RECORDS</text><text x="74" y="298" fill="#a8cbd2" font-family="Arial" font-size="23">Secure, inventory, value, then decide.</text><g font-family="Arial"><rect x="72" y="370" width="320" height="160" rx="18" fill="#102f39" stroke="#58d6ff" stroke-width="2"/><text x="104" y="420" fill="#9bf0d1" font-size="18" font-weight="700">01 / CONTROL</text><text x="104" y="470" fill="white" font-size="26" font-weight="700">AUTHORITY</text><text x="104" y="505" fill="#a8cbd2" font-size="18">Who may act?</text><rect x="440" y="370" width="320" height="160" rx="18" fill="#102f39" stroke="#58d6ff" stroke-width="2"/><text x="472" y="420" fill="#9bf0d1" font-size="18" font-weight="700">02 / RECORD</text><text x="472" y="470" fill="white" font-size="26" font-weight="700">INVENTORY</text><text x="472" y="505" fill="#a8cbd2" font-size="18">What is present?</text><rect x="808" y="370" width="320" height="160" rx="18" fill="#102f39" stroke="#58d6ff" stroke-width="2"/><text x="840" y="420" fill="#9bf0d1" font-size="18" font-weight="700">03 / REVIEW</text><text x="840" y="470" fill="white" font-size="26" font-weight="700">VALUATION</text><text x="840" y="505" fill="#a8cbd2" font-size="18">Who should advise?</text></g></svg>
