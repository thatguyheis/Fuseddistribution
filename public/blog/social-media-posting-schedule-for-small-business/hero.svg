<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#071522"/>
  <circle cx="1080" cy="72" r="160" fill="#12334a" opacity=".55"/>
  <text x="72" y="96" fill="#58d6ff" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3">FUSED DISTRIBUTION</text>
  <text x="72" y="190" fill="#fff" font-family="Arial,sans-serif" font-size="52" font-weight="700">A WEEKLY SOCIAL</text>
  <text x="72" y="250" fill="#fff" font-family="Arial,sans-serif" font-size="52" font-weight="700">MEDIA SCHEDULE</text>
  <text x="72" y="304" fill="#a9c9d5" font-family="Arial,sans-serif" font-size="24">A practical routine for a small business with limited time.</text>
  <g font-family="Arial,sans-serif">
    <rect x="72" y="390" width="310" height="140" rx="18" fill="#102d40" stroke="#58d6ff" stroke-width="2"/>
    <text x="100" y="430" fill="#58d6ff" font-size="18" font-weight="700">PLAN</text><text x="100" y="468" fill="#fff" font-size="22">Choose one problem</text><text x="100" y="500" fill="#a9c9d5" font-size="18">and a useful next step.</text>
    <rect x="425" y="390" width="310" height="140" rx="18" fill="#102d40" stroke="#8df0c3" stroke-width="2"/>
    <text x="453" y="430" fill="#8df0c3" font-size="18" font-weight="700">PUBLISH</text><text x="453" y="468" fill="#fff" font-size="22">Batch the repeatable</text><text x="453" y="500" fill="#a9c9d5" font-size="18">parts of the work.</text>
    <rect x="778" y="390" width="310" height="140" rx="18" fill="#102d40" stroke="#58d6ff" stroke-width="2"/>
    <text x="806" y="430" fill="#58d6ff" font-size="18" font-weight="700">REVIEW</text><text x="806" y="468" fill="#fff" font-size="22">Own responses</text><text x="806" y="500" fill="#a9c9d5" font-size="18">and learn each month.</text>
