  <use href="#star-sm" transform="translate(582,318)" fill="#58d6ff" fill-opacity="0.85"/>
  <use href="#star-sm" transform="translate(600,318)" fill="#58d6ff" fill-opacity="0.85"/>
  <use href="#star-sm" transform="translate(618,318)" fill="#58d6ff" fill-opacity="0.85"/>
  <use href="#star-sm" transform="translate(636,318)" fill="#58d6ff" fill-opacity="0.85"/>

