  <rect x="868" y="263" width="285" height="76" rx="14" fill="rgba(88,214,255,0.04)" stroke="rgba(88,214,255,0.14)" stroke-width="1"/>
  <text x="1010" y="283" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-size="10" fill="rgba(175,198,207,0.55)" text-anchor="middle" letter-spacing="3">PROOF</text>
