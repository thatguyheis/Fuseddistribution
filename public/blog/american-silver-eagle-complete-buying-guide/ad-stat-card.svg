  <text x="1150" y="618" font-family="'Trebuchet MS', sans-serif" font-size="10" fill="rgba(88,214,255,0.35)" text-anchor="end" letter-spacing="3">DISTRIBUTION</text>

  <!-- RIGHT STAT CARDS (three small cards) -->
  <rect x="660" y="110" width="490" height="116" rx="14" fill="rgba(88,214,255,0.05)" stroke="rgba(88,214,255,0.16)" stroke-width="1"/>
  <text x="905" y="148" font-family="'Trebuchet MS', sans-serif" font-size="11" fill="rgba(175,198,207,0.55)" text-anchor="middle" letter-spacing="3">BULLION PREMIUM</text>
  <text x="905" y="204" font-family="Impact, 'Arial Narrow Bold', sans-serif" font-size="50" fill="#58d6ff" text-anchor="middle" letter-spacing="2">$4-8 / OZ</text>

  <rect x="660" y="240" width="490" height="116" rx="14" fill="rgba(88,214,255,0.04)" stroke="rgba(88,214,255,0.12)" stroke-width="1"/>
  <text x="905" y="278" font-family="'Trebuchet MS', sans-serif" font-size="11" fill="rgba(175,198,207,0.55)" text-anchor="middle" letter-spacing="3">PROOF PREMIUM</text>
  <text x="905" y="334" font-family="Impact, 'Arial Narrow Bold', sans-serif" font-size="50" fill="#ecf8fb" text-anchor="middle" letter-spacing="2">$30+ / OZ</text>

  <rect x="660" y="370" width="490" height="116" rx="14" fill="rgba(77,255,184,0.04)" stroke="rgba(77,255,184,0.12)" stroke-width="1"/>
  <text x="905" y="408" font-family="'Trebuchet MS', sans-serif" font-size="11" fill="rgba(175,198,207,0.55)" text-anchor="middle" letter-spacing="3">SILVER CONTENT</text>
  <text x="905" y="464" font-family="Impact, 'Arial Narrow Bold', sans-serif" font-size="50" fill="#4dffb8" text-anchor="middle" letter-spacing="2">1 OZ .999</text>
