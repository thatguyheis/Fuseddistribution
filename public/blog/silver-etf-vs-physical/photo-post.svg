<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <radialGradient id="glow-c" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58d6ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#58d6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-tl" cx="0%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#4dffb8" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#4dffb8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1200" fill="#041018"/>
  <rect width="1200" height="1200" fill="url(#glow-c)"/>
  <rect width="1200" height="1200" fill="url(#glow-tl)"/>

  <!-- Grid lines -->
  <line x1="170" y1="0" x2="170" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="340" y1="0" x2="340" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="510" y1="0" x2="510" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="680" y1="0" x2="680" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="850" y1="0" x2="850" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="1020" y1="0" x2="1020" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>

  <!-- Rings -->
  <circle cx="600" cy="600" r="480" fill="none" stroke="#58d6ff" stroke-width="1" stroke-opacity="0.06"/>
  <circle cx="600" cy="600" r="320" fill="none" stroke="#58d6ff" stroke-width="1" stroke-opacity="0.09"/>

  <!-- Scatter dots -->
  <circle cx="130" cy="160" r="1.5" fill="#58d6ff" fill-opacity="0.22"/>
  <circle cx="340" cy="950" r="1" fill="#4dffb8" fill-opacity="0.18"/>
  <circle cx="480" cy="70" r="1.5" fill="#58d6ff" fill-opacity="0.20"/>
  <circle cx="820" cy="1090" r="1" fill="#4dffb8" fill-opacity="0.25"/>
  <circle cx="960" cy="90" r="1.5" fill="#58d6ff" fill-opacity="0.18"/>
  <circle cx="1070" cy="840" r="1" fill="#4dffb8" fill-opacity="0.22"/>
  <circle cx="180" cy="620" r="1.2" fill="#58d6ff" fill-opacity="0.15"/>

  <!-- Top zone -->
  <text x="600" y="90" font-family="Trebuchet MS, sans-serif" font-size="18" letter-spacing="0.22em" fill="rgba(175,198,207,0.55)" text-anchor="middle">SILVER INVESTING</text>
  <text x="600" y="148" font-family="Impact, Arial Narrow, sans-serif" font-size="48" letter-spacing="0.10em" fill="#58d6ff" text-anchor="middle">FUSED</text>
  <text x="600" y="176" font-family="Trebuchet MS, sans-serif" font-size="13" letter-spacing="0.18em" fill="rgba(175,198,207,0.45)" text-anchor="middle">DISTRIBUTION</text>

  <line x1="200" y1="198" x2="1000" y2="198" stroke="rgba(88,214,255,0.18)" stroke-width="1"/>

  <!-- Main headline -->
  <text x="600" y="290" font-family="Impact, Arial Narrow, sans-serif" font-size="72" letter-spacing="0.04em" fill="#ecf8fb" text-anchor="middle">SILVER ETF</text>
  <text x="600" y="360" font-family="Impact, Arial Narrow, sans-serif" font-size="44" letter-spacing="0.06em" fill="rgba(175,198,207,0.6)" text-anchor="middle">VS PHYSICAL SILVER</text>

  <!-- Big stat: 28% -->
  <text x="600" y="530" font-family="Impact, Arial Narrow, sans-serif" font-size="220" letter-spacing="0.02em" fill="#58d6ff" text-anchor="middle" opacity="0.95">28%</text>
  <text x="600" y="590" font-family="Trebuchet MS, sans-serif" font-size="22" letter-spacing="0.06em" fill="rgba(175,198,207,0.75)" text-anchor="middle">IRS COLLECTIBLES TAX RATE ON BOTH</text>
  <text x="600" y="624" font-family="Trebuchet MS, sans-serif" font-size="15" fill="rgba(175,198,207,0.45)" text-anchor="middle">SLV and PSLV are not taxed like stock ETFs &#183; IRS Section 408(m)</text>

  <!-- Comparison cards -->
  <rect x="80" y="665" width="480" height="180" rx="16" fill="rgba(7,20,28,0.75)" stroke="rgba(88,214,255,0.18)" stroke-width="1"/>
  <text x="320" y="710" font-family="Impact, Arial Narrow, sans-serif" font-size="28" letter-spacing="0.06em" fill="#58d6ff" text-anchor="middle">SLV / PSLV</text>
  <text x="320" y="738" font-family="Trebuchet MS, sans-serif" font-size="13" fill="rgba(175,198,207,0.5)" text-anchor="middle">Silver ETFs</text>
  <line x1="100" y1="752" x2="540" y2="752" stroke="rgba(88,214,255,0.10)" stroke-width="1"/>
  <text x="110" y="778" font-family="Trebuchet MS, sans-serif" font-size="13" fill="rgba(175,198,207,0.65)">Annual fee: 0.35&#8211;0.50%</text>
  <text x="110" y="802" font-family="Trebuchet MS, sans-serif" font-size="13" fill="rgba(175,198,207,0.65)">No physical delivery (retail)</text>
  <text x="110" y="826" font-family="Trebuchet MS, sans-serif" font-size="13" fill="rgba(175,198,207,0.65)">Custodian counterparty risk</text>

  <rect x="640" y="665" width="480" height="180" rx="16" fill="rgba(7,20,28,0.75)" stroke="rgba(77,255,184,0.14)" stroke-width="1"/>
  <text x="880" y="710" font-family="Impact, Arial Narrow, sans-serif" font-size="28" letter-spacing="0.06em" fill="#4dffb8" text-anchor="middle">PHYSICAL SILVER</text>
  <text x="880" y="738" font-family="Trebuchet MS, sans-serif" font-size="13" fill="rgba(175,198,207,0.5)" text-anchor="middle">Coins, rounds, bars</text>
  <line x1="660" y1="752" x2="1100" y2="752" stroke="rgba(77,255,184,0.10)" stroke-width="1"/>
  <text x="670" y="778" font-family="Trebuchet MS, sans-serif" font-size="13" fill="rgba(175,198,207,0.65)">Annual fee: $0 (home safe)</text>
  <text x="670" y="802" font-family="Trebuchet MS, sans-serif" font-size="13" fill="rgba(175,198,207,0.65)">You own the metal outright</text>
  <text x="670" y="826" font-family="Trebuchet MS, sans-serif" font-size="13" fill="rgba(175,198,207,0.65)">3&#8211;15% premium over spot</text>

  <!-- Body text -->
  <text x="600" y="910" font-family="Trebuchet MS, sans-serif" font-size="20" fill="rgba(175,198,207,0.70)" text-anchor="middle">Both options carry the same 28% IRS tax rate.</text>
  <text x="600" y="944" font-family="Trebuchet MS, sans-serif" font-size="20" fill="rgba(175,198,207,0.70)" text-anchor="middle">The real differences are fees, counterparty risk, and whether</text>
  <text x="600" y="976" font-family="Trebuchet MS, sans-serif" font-size="20" fill="rgba(175,198,207,0.70)" text-anchor="middle">you actually own the metal when it matters most.</text>

  <line x1="200" y1="1010" x2="1000" y2="1010" stroke="rgba(88,214,255,0.14)" stroke-width="1"/>

  <!-- CTA -->
  <rect x="340" y="1038" width="520" height="72" rx="18" fill="rgba(88,214,255,0.08)" stroke="rgba(88,214,255,0.30)" stroke-width="1.5"/>
  <text x="600" y="1082" font-family="Trebuchet MS, sans-serif" font-size="15" letter-spacing="0.10em" fill="rgba(175,198,207,0.75)" text-anchor="middle">Full breakdown at fuseddistribution.com</text>

  <text x="600" y="1148" font-family="Impact, Arial Narrow, sans-serif" font-size="20" letter-spacing="0.12em" fill="rgba(88,214,255,0.45)" text-anchor="middle">FUSEDDISTRIBUTION.COM</text>
</svg>
