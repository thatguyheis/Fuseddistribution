  <text x="600" y="215" font-family="Impact, Arial Narrow, sans-serif" font-size="52" letter-spacing="0.04em" fill="#ecf8fb" text-anchor="middle">SILVER ETF</text>
  <text x="600" y="268" font-family="Impact, Arial Narrow, sans-serif" font-size="34" letter-spacing="0.06em" fill="rgba(175,198,207,0.7)" text-anchor="middle">VS</text>
  <text x="600" y="326" font-family="Impact, Arial Narrow, sans-serif" font-size="52" letter-spacing="0.04em" fill="#58d6ff" text-anchor="middle">PHYSICAL SILVER</text>

  <!-- Center: Key fact -->
  <rect x="400" y="348" width="400" height="60" rx="12" fill="rgba(88,214,255,0.06)" stroke="rgba(88,214,255,0.18)" stroke-width="1"/>
  <text x="600" y="374" font-family="Trebuchet MS, sans-serif" font-size="13" fill="rgba(175,198,207,0.8)" text-anchor="middle">Both taxed at 28% max (IRS collectibles rule)</text>
  <text x="600" y="396" font-family="Trebuchet MS, sans-serif" font-size="13" fill="rgba(175,198,207,0.8)" text-anchor="middle">in taxable accounts &#183; ETF fees compound annually</text>

  <!-- Right card: Physical silver -->
  <rect x="882" y="170" width="276" height="160" rx="16" fill="rgba(7,20,28,0.75)" stroke="rgba(88,214,255,0.18)" stroke-width="1"/>
  <text x="1020" y="215" font-family="Impact, Arial Narrow, sans-serif" font-size="26" letter-spacing="0.04em" fill="#58d6ff" text-anchor="middle">PHYSICAL</text>
  <text x="1020" y="240" font-family="Trebuchet MS, sans-serif" font-size="11" fill="rgba(175,198,207,0.55)" text-anchor="middle">Coins, rounds, bars</text>
  <line x1="900" y1="252" x2="1140" y2="252" stroke="rgba(88,214,255,0.14)" stroke-width="1"/>
  <text x="910" y="273" font-family="Trebuchet MS, sans-serif" font-size="12" fill="rgba(175,198,207,0.7)">Annual fee:</text>
  <text x="1135" y="273" font-family="Impact, Arial Narrow, sans-serif" font-size="14" fill="#4dffb8" text-anchor="end">$0</text>
  <text x="910" y="293" font-family="Trebuchet MS, sans-serif" font-size="12" fill="rgba(175,198,207,0.7)">Premium over spot:</text>
  <text x="1135" y="293" font-family="Trebuchet MS, sans-serif" font-size="11" fill="rgba(175,198,207,0.55)" text-anchor="end">3&#8211;15%</text>
  <text x="910" y="313" font-family="Trebuchet MS, sans-serif" font-size="12" fill="rgba(175,198,207,0.7)">Counterparty:</text>
  <text x="1135" y="313" font-family="Impact, Arial Narrow, sans-serif" font-size="13" fill="#4dffb8" text-anchor="end">NONE</text>

  <!-- Right card 2: Tax -->
  <rect x="882" y="350" width="276" height="160" rx="16" fill="rgba(7,20,28,0.75)" stroke="rgba(77,255,184,0.14)" stroke-width="1"/>
  <text x="1020" y="395" font-family="Impact, Arial Narrow, sans-serif" font-size="26" letter-spacing="0.04em" fill="#58d6ff" text-anchor="middle">TAX RATE</text>
  <text x="1020" y="420" font-family="Trebuchet MS, sans-serif" font-size="11" fill="rgba(175,198,207,0.55)" text-anchor="middle">Long-term gains (IRS)</text>
  <line x1="900" y1="432" x2="1140" y2="432" stroke="rgba(77,255,184,0.14)" stroke-width="1"/>
  <text x="910" y="455" font-family="Trebuchet MS, sans-serif" font-size="12" fill="rgba(175,198,207,0.7)">Stock ETF max:</text>
  <text x="1135" y="455" font-family="Impact, Arial Narrow, sans-serif" font-size="14" fill="rgba(175,198,207,0.75)" text-anchor="end">20%</text>
  <text x="910" y="477" font-family="Trebuchet MS, sans-serif" font-size="12" fill="rgba(175,198,207,0.7)">SLV / PSLV max:</text>
  <text x="1135" y="477" font-family="Impact, Arial Narrow, sans-serif" font-size="14" fill="#58d6ff" text-anchor="end">28%</text>
  <text x="910" y="499" font-family="Trebuchet MS, sans-serif" font-size="12" fill="rgba(175,198,207,0.7)">Physical silver max:</text>
  <text x="1135" y="499" font-family="Impact, Arial Narrow, sans-serif" font-size="14" fill="#58d6ff" text-anchor="end">28%</text>

  <!-- Bottom URL bar -->
  <rect x="360" y="530" width="480" height="46" rx="12" fill="rgba(88,214,255,0.07)" stroke="rgba(88,214,255,0.22)" stroke-width="1"/>
  <text x="600" y="559" font-family="Trebuchet MS, sans-serif" font-size="14" letter-spacing="0.06em" fill="rgba(175,198,207,0.7)" text-anchor="middle">fuseddistribution.com/blog/silver-etf-vs-physical</text>
</svg>
