  <text x="180" y="395" font-family="Impact, Arial Narrow, sans-serif" font-size="30" letter-spacing="0.06em" fill="#4dffb8" text-anchor="middle">PSLV</text>
  <text x="180" y="420" font-family="Trebuchet MS, sans-serif" font-size="11" fill="rgba(175,198,207,0.55)" text-anchor="middle">Sprott Physical Silver</text>
  <line x1="60" y1="432" x2="300" y2="432" stroke="rgba(77,255,184,0.14)" stroke-width="1"/>
  <text x="70" y="453" font-family="Trebuchet MS, sans-serif" font-size="12" fill="rgba(175,198,207,0.7)">Annual fee:</text>
  <text x="295" y="453" font-family="Impact, Arial Narrow, sans-serif" font-size="14" fill="#4dffb8" text-anchor="end">0.51%</text>
  <text x="70" y="473" font-family="Trebuchet MS, sans-serif" font-size="12" fill="rgba(175,198,207,0.7)">Redemption:</text>
  <text x="295" y="473" font-family="Trebuchet MS, sans-serif" font-size="11" fill="rgba(175,198,207,0.55)" text-anchor="end">10,000+ oz min</text>
  <text x="70" y="493" font-family="Trebuchet MS, sans-serif" font-size="12" fill="rgba(175,198,207,0.7)">Custodian:</text>
  <text x="295" y="493" font-family="Trebuchet MS, sans-serif" font-size="11" fill="rgba(175,198,207,0.55)" text-anchor="end">Royal Canadian Mint</text>

