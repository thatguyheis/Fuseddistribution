  <rect x="42" y="170" width="276" height="160" rx="16" fill="rgba(7,20,28,0.75)" stroke="rgba(88,214,255,0.18)" stroke-width="1"/>
  <text x="180" y="215" font-family="Impact, Arial Narrow, sans-serif" font-size="30" letter-spacing="0.06em" fill="#58d6ff" text-anchor="middle">SLV</text>
  <text x="180" y="240" font-family="Trebuchet MS, sans-serif" font-size="11" fill="rgba(175,198,207,0.55)" text-anchor="middle">iShares Silver Trust</text>
  <line x1="60" y1="252" x2="300" y2="252" stroke="rgba(88,214,255,0.14)" stroke-width="1"/>
  <text x="70" y="273" font-family="Trebuchet MS, sans-serif" font-size="12" fill="rgba(175,198,207,0.7)">Annual fee:</text>
  <text x="295" y="273" font-family="Impact, Arial Narrow, sans-serif" font-size="14" fill="#58d6ff" text-anchor="end">0.50%</text>
  <text x="70" y="293" font-family="Trebuchet MS, sans-serif" font-size="12" fill="rgba(175,198,207,0.7)">Redemption:</text>
  <text x="295" y="293" font-family="Trebuchet MS, sans-serif" font-size="11" fill="rgba(175,198,207,0.55)" text-anchor="end">Institutional only</text>
  <text x="70" y="313" font-family="Trebuchet MS, sans-serif" font-size="12" fill="rgba(175,198,207,0.7)">Custodian:</text>
  <text x="295" y="313" font-family="Trebuchet MS, sans-serif" font-size="11" fill="rgba(175,198,207,0.55)" text-anchor="end">JP Morgan</text>

