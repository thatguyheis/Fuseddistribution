<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow-c" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58d6ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#58d6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-tl" cx="0%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#4dffb8" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#4dffb8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#041018"/>
  <rect width="1200" height="630" fill="url(#glow-c)"/>
  <rect width="1200" height="630" fill="url(#glow-tl)"/>

  <!-- Grid lines -->
  <line x1="170" y1="0" x2="170" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="340" y1="0" x2="340" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="510" y1="0" x2="510" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="680" y1="0" x2="680" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="850" y1="0" x2="850" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="1020" y1="0" x2="1020" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>

  <!-- Rings -->
  <circle cx="600" cy="315" r="255" fill="none" stroke="#58d6ff" stroke-width="1" stroke-opacity="0.07"/>
  <circle cx="600" cy="315" r="170" fill="none" stroke="#58d6ff" stroke-width="1" stroke-opacity="0.11"/>

  <!-- Scatter dots -->
  <circle cx="100" cy="120" r="1.5" fill="#58d6ff" fill-opacity="0.22"/>
  <circle cx="290" cy="500" r="1" fill="#4dffb8" fill-opacity="0.18"/>
  <circle cx="480" cy="55" r="1.5" fill="#58d6ff" fill-opacity="0.20"/>
  <circle cx="760" cy="570" r="1" fill="#4dffb8" fill-opacity="0.25"/>
  <circle cx="950" cy="85" r="1.5" fill="#58d6ff" fill-opacity="0.18"/>
  <circle cx="1090" cy="410" r="1" fill="#4dffb8" fill-opacity="0.22"/>
  <circle cx="220" cy="310" r="1.2" fill="#58d6ff" fill-opacity="0.15"/>
  <circle cx="1010" cy="260" r="1" fill="#58d6ff" fill-opacity="0.20"/>

  <!-- Brand mark -->
  <text x="60" y="64" font-family="Impact, Arial Narrow, sans-serif" font-size="22" letter-spacing="0.14em" fill="#58d6ff" opacity="0.85">FUSED</text>
  <text x="60" y="84" font-family="Trebuchet MS, sans-serif" font-size="11" letter-spacing="0.18em" fill="rgba(175,198,207,0.55)">DISTRIBUTION</text>

