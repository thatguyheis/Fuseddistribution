<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow-c" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58d6ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#58d6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-tl" cx="0%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#4dffb8" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#4dffb8" stop-opacity="0"/>
    </radialGradient>
    <path id="star-sm" d="M 0,-7 L 1.76,-2.43 L 6.66,-2.16 L 2.85,0.93 L 4.11,5.66 L 0,3 L -4.11,5.66 L -2.85,0.93 L -6.66,-2.16 L -1.76,-2.43 Z"/>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#041018"/>
  <rect width="1200" height="630" fill="url(#glow-c)"/>
  <rect width="1200" height="630" fill="url(#glow-tl)"/>

  <!-- Grid lines -->
  <line x1="170" y1="0" x2="170" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="340" y1="0" x2="340" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="510" y1="0" x2="510" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="680" y1="0" x2="680" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="850" y1="0" x2="850" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="1020" y1="0" x2="1020" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>

  <!-- Rings -->
  <circle cx="600" cy="315" r="255" fill="none" stroke="#58d6ff" stroke-width="1" stroke-opacity="0.07"/>
  <circle cx="600" cy="315" r="170" fill="none" stroke="#58d6ff" stroke-width="1" stroke-opacity="0.11"/>

  <!-- Scatter dots -->
  <circle cx="110" cy="72" r="1.5" fill="#58d6ff" opacity="0.22"/>
  <circle cx="360" cy="48" r="1" fill="#4dffb8" opacity="0.26"/>
  <circle cx="760" cy="65" r="1.5" fill="#58d6ff" opacity="0.18"/>
  <circle cx="960" cy="120" r="1" fill="#4dffb8" opacity="0.20"/>
  <circle cx="1080" cy="210" r="1.5" fill="#58d6ff" opacity="0.16"/>
  <circle cx="80" cy="320" r="1" fill="#58d6ff" opacity="0.24"/>
  <circle cx="220" cy="490" r="1.5" fill="#4dffb8" opacity="0.18"/>
  <circle cx="1060" cy="530" r="1" fill="#58d6ff" opacity="0.20"/>
  <circle cx="450" cy="575" r="1.5" fill="#58d6ff" opacity="0.15"/>
  <circle cx="840" cy="558" r="1" fill="#4dffb8" opacity="0.17"/>

  <!-- Left card: Peak Price -->
  <rect x="42" y="165" width="270" height="175" rx="12" fill="rgba(7,18,26,0.82)" stroke="rgba(88,214,255,0.18)" stroke-width="1"/>
  <text x="177" y="192" text-anchor="middle" font-family="Impact,sans-serif" font-size="11" letter-spacing="2" fill="#58d6ff" opacity="0.9">JAN 18, 1980 PEAK</text>
  <text x="177" y="250" text-anchor="middle" font-family="Impact,Haettenschweiler,sans-serif" font-size="52" fill="#58d6ff">$49.45</text>
  <text x="177" y="273" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="12" fill="rgba(175,198,207,0.7)">per ounce, all-time</text>
  <text x="177" y="289" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="12" fill="rgba(175,198,207,0.7)">nominal high (1980)</text>
  <line x1="58" y1="303" x2="296" y2="303" stroke="rgba(88,214,255,0.1)" stroke-width="1"/>
  <text x="177" y="323" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="11" fill="rgba(175,198,207,0.5)">Started at $1.50 in 1973</text>

  <!-- Central content zone -->
  <!-- Eyebrow -->
  <rect x="350" y="128" width="500" height="32" rx="16" fill="rgba(88,214,255,0.08)" stroke="rgba(88,214,255,0.22)" stroke-width="1"/>
  <text x="600" y="150" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="12" font-weight="800" letter-spacing="3" fill="#58d6ff">SILVER &#183; HISTORY &#183; MARKET MANIPULATION</text>

  <!-- Main title -->
  <text x="600" y="222" text-anchor="middle" font-family="Impact,Haettenschweiler,sans-serif" font-size="46" letter-spacing="1.5" fill="#ecf8fb">THE HUNT BROTHERS'</text>
  <text x="600" y="272" text-anchor="middle" font-family="Impact,Haettenschweiler,sans-serif" font-size="46" letter-spacing="1.5" fill="#58d6ff">SILVER SQUEEZE</text>
  <text x="600" y="318" text-anchor="middle" font-family="Impact,Haettenschweiler,sans-serif" font-size="36" letter-spacing="1.5" fill="rgba(236,248,251,0.85)">OF 1980</text>

  <!-- Subtext -->
  <text x="600" y="365" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="15" fill="rgba(175,198,207,0.75)">How 100 million ounces drove silver to $49</text>
  <text x="600" y="384" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="15" fill="rgba(175,198,207,0.75)">and what collapsed it in a single day.</text>

  <!-- Divider -->
  <line x1="370" y1="408" x2="830" y2="408" stroke="rgba(88,214,255,0.2)" stroke-width="1"/>

  <!-- Timeline mini-bar -->
  <text x="390" y="432" font-family="Trebuchet MS,sans-serif" font-size="11" fill="rgba(175,198,207,0.55)">1973: $1.50</text>
  <rect x="448" y="424" width="8" height="10" rx="2" fill="rgba(88,214,255,0.3)"/>
  <rect x="463" y="420" width="12" height="14" rx="2" fill="rgba(88,214,255,0.45)"/>
  <rect x="483" y="413" width="14" height="21" rx="2" fill="rgba(88,214,255,0.55)"/>
  <rect x="505" y="390" width="20" height="44" rx="2" fill="#58d6ff" opacity="0.8"/>
  <rect x="533" y="418" width="14" height="16" rx="2" fill="rgba(255,100,100,0.65)"/>
  <rect x="555" y="420" width="12" height="14" rx="2" fill="rgba(88,214,255,0.30)"/>
  <text x="590" y="432" font-family="Trebuchet MS,sans-serif" font-size="11" fill="rgba(175,198,207,0.55)">1982: $7.00</text>

  <!-- Brand mark -->
  <text x="600" y="468" text-anchor="middle" font-family="Impact,Haettenschweiler,sans-serif" font-size="13" letter-spacing="3" fill="rgba(88,214,255,0.5)">FUSED DISTRIBUTION</text>

  <!-- Right card: Silver Thursday -->
  <rect x="888" y="165" width="270" height="175" rx="12" fill="rgba(7,18,26,0.82)" stroke="rgba(255,100,100,0.25)" stroke-width="1"/>
  <text x="1023" y="192" text-anchor="middle" font-family="Impact,sans-serif" font-size="11" letter-spacing="2" fill="rgba(255,140,140,0.9)">SILVER THURSDAY</text>
  <text x="1023" y="195" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="10" fill="rgba(175,198,207,0.5)">&#160;</text>
  <text x="1023" y="220" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="11" fill="rgba(175,198,207,0.6)">March 27, 1980</text>
  <text x="1023" y="258" text-anchor="middle" font-family="Impact,Haettenschweiler,sans-serif" font-size="52" fill="rgba(255,140,140,0.9)">$10.80</text>
  <text x="1023" y="280" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="12" fill="rgba(175,198,207,0.7)">single-day collapse</text>
  <text x="1023" y="296" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="12" fill="rgba(175,198,207,0.7)">from ~$21/oz</text>
  <line x1="904" y1="311" x2="1142" y2="311" stroke="rgba(255,100,100,0.1)" stroke-width="1"/>
  <text x="1023" y="330" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="11" fill="rgba(175,198,207,0.5)">Hunts held 100M+ oz</text>

  <!-- Brand mark bottom left -->
  <text x="42" y="590" font-family="Impact,Haettenschweiler,sans-serif" font-size="22" letter-spacing="4" fill="rgba(88,214,255,0.5)">FUSED</text>
  <text x="42" y="608" font-family="Trebuchet MS,sans-serif" font-size="10" letter-spacing="2" fill="rgba(175,198,207,0.4)">DISTRIBUTION</text>

  <!-- URL -->
  <text x="1158" y="608" text-anchor="end" font-family="Trebuchet MS,sans-serif" font-size="11" fill="rgba(175,198,207,0.4)">fuseddistribution.com</text>
</svg>
