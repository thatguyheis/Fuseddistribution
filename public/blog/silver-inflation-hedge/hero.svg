<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="si-glow-c" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58d6ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#58d6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="si-glow-tl" cx="0%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#4dffb8" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#4dffb8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="si-bar-1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58d6ff"/>
      <stop offset="100%" stop-color="#4dffb8"/>
    </linearGradient>
    <linearGradient id="si-bar-2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58d6ff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#4dffb8" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="si-bar-3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58d6ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4dffb8" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="si-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1e2a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#071318" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#041018"/>
  <rect width="1200" height="630" fill="url(#si-glow-c)"/>
  <rect width="1200" height="630" fill="url(#si-glow-tl)"/>

  <!-- Grid lines -->
  <line x1="170" y1="0" x2="170" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="340" y1="0" x2="340" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="510" y1="0" x2="510" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="680" y1="0" x2="680" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="850" y1="0" x2="850" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="1020" y1="0" x2="1020" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>

  <!-- Rings -->
  <circle cx="600" cy="315" r="255" fill="none" stroke="#58d6ff" stroke-width="1" opacity="0.07"/>
  <circle cx="600" cy="315" r="170" fill="none" stroke="#58d6ff" stroke-width="1" opacity="0.11"/>

  <!-- Scatter dots -->
  <circle cx="132" cy="92" r="1.5" fill="#58d6ff" opacity="0.20"/>
  <circle cx="378" cy="56" r="1" fill="#4dffb8" opacity="0.17"/>
  <circle cx="718" cy="74" r="1.5" fill="#58d6ff" opacity="0.22"/>
  <circle cx="940" cy="108" r="1" fill="#4dffb8" opacity="0.24"/>
  <circle cx="1072" cy="68" r="1.5" fill="#58d6ff" opacity="0.18"/>
  <circle cx="218" cy="514" r="1" fill="#4dffb8" opacity="0.19"/>
  <circle cx="824" cy="542" r="1.5" fill="#58d6ff" opacity="0.21"/>
  <circle cx="1044" cy="496" r="1" fill="#58d6ff" opacity="0.15"/>
  <circle cx="492" cy="576" r="1" fill="#4dffb8" opacity="0.18"/>
  <circle cx="654" cy="84" r="1" fill="#58d6ff" opacity="0.16"/>

  <!-- LEFT STAT CARD: 270% -->
  <rect x="42" y="155" width="272" height="320" rx="18" fill="url(#si-card)" stroke="#58d6ff" stroke-width="1" stroke-opacity="0.18"/>
  <text x="178" y="208" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="11" font-weight="800" letter-spacing="0.12em" fill="#58d6ff" opacity="0.7">1970S INFLATION</text>
  <text x="178" y="298" text-anchor="middle" font-family="Impact, Haettenschweiler, Arial Narrow Bold, sans-serif" font-size="80" letter-spacing="0.02em" fill="#58d6ff">270%</text>
  <text x="178" y="330" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="12" fill="rgba(175,198,207,0.72)" letter-spacing="0.04em">silver gain</text>
  <line x1="62" y1="352" x2="294" y2="352" stroke="rgba(88,214,255,0.15)" stroke-width="1"/>
  <text x="178" y="376" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="11" font-weight="800" letter-spacing="0.10em" fill="rgba(175,198,207,0.5)">2008-2011</text>
  <text x="178" y="404" text-anchor="middle" font-family="Impact, sans-serif" font-size="36" fill="rgba(88,214,255,0.6)">+173%</text>
  <text x="178" y="424" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="11" fill="rgba(175,198,207,0.45)" letter-spacing="0.04em">silver gain</text>
  <text x="178" y="452" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="11" font-weight="800" letter-spacing="0.10em" fill="rgba(175,198,207,0.35)">2020-2022</text>
  <text x="178" y="468" text-anchor="middle" font-family="Impact, sans-serif" font-size="24" fill="rgba(88,214,255,0.35)">+107%</text>

  <!-- CENTER CHART -->
  <text x="600" y="148" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="11" font-weight="800" letter-spacing="0.16em" fill="#58d6ff" opacity="0.65">SILVER GAIN DURING MAJOR INFLATION PERIODS</text>

  <!-- Bar 1: 1972-1980, 270% -->
  <text x="365" y="196" font-family="Trebuchet MS, sans-serif" font-size="11" fill="rgba(175,198,207,0.65)">1972-1980</text>
  <rect x="365" y="204" width="300" height="28" rx="5" fill="url(#si-bar-1)"/>
  <text x="671" y="222" font-family="Impact, sans-serif" font-size="16" fill="#58d6ff">+270%</text>

  <!-- Bar 2: 2008-2011, 173% -->
  <text x="365" y="262" font-family="Trebuchet MS, sans-serif" font-size="11" fill="rgba(175,198,207,0.65)">2008-2011</text>
  <rect x="365" y="270" width="192" height="28" rx="5" fill="url(#si-bar-2)"/>
  <text x="562" y="288" font-family="Impact, sans-serif" font-size="16" fill="rgba(88,214,255,0.8)">+173%</text>

  <!-- Bar 3: 2020-2022, 107% -->
  <text x="365" y="328" font-family="Trebuchet MS, sans-serif" font-size="11" fill="rgba(175,198,207,0.65)">2020-2022</text>
  <rect x="365" y="336" width="119" height="28" rx="5" fill="url(#si-bar-3)"/>
  <text x="489" y="354" font-family="Impact, sans-serif" font-size="16" fill="rgba(88,214,255,0.6)">+107%</text>

  <!-- vs inflation comparison line -->
  <line x1="365" y1="390" x2="750" y2="390" stroke="rgba(88,214,255,0.12)" stroke-width="1"/>
  <text x="365" y="410" font-family="Trebuchet MS, sans-serif" font-size="11" fill="rgba(175,198,207,0.4)">Cumulative CPI inflation 1972-1980: 117%</text>
  <text x="365" y="428" font-family="Trebuchet MS, sans-serif" font-size="11" fill="rgba(175,198,207,0.4)">Silver beat inflation 2-to-1 in that cycle</text>

  <text x="600" y="480" text-anchor="middle" font-family="Impact, Haettenschweiler, Arial Narrow Bold, sans-serif" font-size="32" letter-spacing="0.06em" fill="#ecf8fb">PHYSICAL SILVER</text>
  <text x="600" y="512" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="13" fill="rgba(175,198,207,0.6)" letter-spacing="0.06em">AS AN INFLATION HEDGE</text>

  <!-- RIGHT STAT CARD: $49.45 -->
  <rect x="886" y="155" width="272" height="320" rx="18" fill="url(#si-card)" stroke="#4dffb8" stroke-width="1" stroke-opacity="0.18"/>
  <text x="1022" y="208" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="11" font-weight="800" letter-spacing="0.12em" fill="#4dffb8" opacity="0.7">1980 PEAK PRICE</text>
  <text x="1022" y="295" text-anchor="middle" font-family="Impact, Haettenschweiler, Arial Narrow Bold, sans-serif" font-size="56" letter-spacing="0.02em" fill="#4dffb8">$49.45</text>
  <text x="1022" y="325" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="12" fill="rgba(175,198,207,0.72)" letter-spacing="0.04em">per ounce</text>
  <text x="1022" y="348" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="11" fill="rgba(175,198,207,0.45)" letter-spacing="0.04em">up from $1.80 in 1972</text>
  <line x1="906" y1="370" x2="1138" y2="370" stroke="rgba(77,255,184,0.15)" stroke-width="1"/>
  <text x="1022" y="395" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="11" font-weight="800" letter-spacing="0.10em" fill="rgba(175,198,207,0.5)">2022 CYCLE PEAK</text>
  <text x="1022" y="425" text-anchor="middle" font-family="Impact, sans-serif" font-size="40" fill="rgba(77,255,184,0.6)">$29</text>
  <text x="1022" y="448" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="11" fill="rgba(175,198,207,0.45)" letter-spacing="0.04em">up from $14 in March 2020</text>
  <text x="1022" y="470" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="11" fill="rgba(77,255,184,0.45)">+107% in 23 months</text>
</svg>
