  <text x="600" y="710" text-anchor="middle" font-family="Impact,Haettenschweiler,sans-serif" font-size="140" letter-spacing="2" fill="#58d6ff">3&#8211;22%</text>
  <text x="600" y="758" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="18" letter-spacing="3" fill="rgba(175,198,207,0.65)">TYPICAL PREMIUM RANGE OVER SPOT</text>

  <!-- Mini stat boxes -->
  <rect x="100" y="800" width="290" height="100" rx="14" fill="rgba(7,20,28,0.72)" stroke="rgba(88,214,255,0.15)" stroke-width="1"/>
  <text x="245" y="840" text-anchor="middle" font-family="Impact,sans-serif" font-size="32" fill="#4dffb8">3&#8211;6%</text>
  <text x="245" y="870" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="12" letter-spacing="1" fill="rgba(175,198,207,0.65)">BARS PREMIUM</text>

  <rect x="455" y="800" width="290" height="100" rx="14" fill="rgba(7,20,28,0.72)" stroke="rgba(88,214,255,0.15)" stroke-width="1"/>
  <text x="600" y="840" text-anchor="middle" font-family="Impact,sans-serif" font-size="32" fill="#4dffb8">5&#8211;8%</text>
  <text x="600" y="870" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="12" letter-spacing="1" fill="rgba(175,198,207,0.65)">ROUNDS PREMIUM</text>

  <rect x="810" y="800" width="290" height="100" rx="14" fill="rgba(7,20,28,0.72)" stroke="rgba(88,214,255,0.15)" stroke-width="1"/>
  <text x="955" y="840" text-anchor="middle" font-family="Impact,sans-serif" font-size="32" fill="#58d6ff">15&#8211;22%</text>
  <text x="955" y="870" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="12" letter-spacing="1" fill="rgba(175,198,207,0.65)">EAGLE PREMIUM</text>

  <!-- Bottom excerpt -->
  <text x="600" y="975" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="20" fill="rgba(175,198,207,0.70)">Calculate cost per ounce. Compare that</text>
  <text x="600" y="1003" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="20" fill="rgba(175,198,207,0.70)">number across every dealer.</text>

  <!-- CTA button shape -->
  <rect x="300" y="1060" width="600" height="62" rx="14" fill="rgba(88,214,255,0.07)" stroke="rgba(88,214,255,0.28)" stroke-width="1"/>
  <text x="600" y="1099" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="14" font-weight="800" letter-spacing="2" fill="rgba(175,198,207,0.65)">Full breakdown at fuseddistribution.com</text>

  <!-- Stars decoration -->
  <use href="#star-sm" transform="translate(160,540)" fill="#58d6ff" opacity="0.18"/>
  <use href="#star-sm" transform="translate(1040,540)" fill="#4dffb8" opacity="0.16"/>
  <use href="#star-sm" transform="translate(310,1040)" fill="#58d6ff" opacity="0.14"/>
  <use href="#star-sm" transform="translate(890,1040)" fill="#4dffb8" opacity="0.14"/>
</svg>
