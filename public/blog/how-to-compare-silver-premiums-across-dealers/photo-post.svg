  <circle cx="600" cy="580" r="380" fill="none" stroke="#58d6ff" stroke-width="1" opacity="0.07"/>
  <circle cx="600" cy="580" r="255" fill="none" stroke="#58d6ff" stroke-width="1" opacity="0.10"/>

  <!-- Scatter dots -->
  <circle cx="142" cy="140" r="1.5" fill="#58d6ff" opacity="0.22"/>
  <circle cx="380" cy="88" r="1" fill="#4dffb8" opacity="0.28"/>
  <circle cx="720" cy="110" r="1.5" fill="#58d6ff" opacity="0.18"/>
  <circle cx="960" cy="165" r="1" fill="#4dffb8" opacity="0.24"/>
  <circle cx="1090" cy="95" r="1.5" fill="#58d6ff" opacity="0.20"/>
  <circle cx="220" cy="1050" r="1" fill="#4dffb8" opacity="0.26"/>
  <circle cx="820" cy="1090" r="1.5" fill="#58d6ff" opacity="0.18"/>
  <circle cx="1140" cy="990" r="1" fill="#4dffb8" opacity="0.22"/>
  <circle cx="65" cy="600" r="1.5" fill="#58d6ff" opacity="0.16"/>
  <circle cx="1135" cy="580" r="1" fill="#4dffb8" opacity="0.20"/>
  <circle cx="490" cy="1120" r="1" fill="#58d6ff" opacity="0.18"/>
  <circle cx="290" cy="970" r="1.5" fill="#4dffb8" opacity="0.16"/>

