  <rect x="400" y="80" width="400" height="44" rx="22" fill="rgba(88,214,255,0.08)" stroke="rgba(88,214,255,0.18)" stroke-width="1"/>
  <text x="600" y="109" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="13" font-weight="800" letter-spacing="4" fill="#58d6ff">SILVER &#183; BUYING GUIDE</text>

  <!-- Brand mark -->
  <text x="600" y="172" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="11" font-weight="800" letter-spacing="5" fill="rgba(175,198,207,0.45)">FUSED DISTRIBUTION</text>

