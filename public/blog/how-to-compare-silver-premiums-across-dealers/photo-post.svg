  <text x="600" y="320" text-anchor="middle" font-family="Impact,Haettenschweiler,sans-serif" font-size="82" letter-spacing="2" fill="#ecf8fb">COMPARE</text>
  <text x="600" y="415" text-anchor="middle" font-family="Impact,Haettenschweiler,sans-serif" font-size="72" letter-spacing="2" fill="#58d6ff">SILVER</text>
  <text x="600" y="505" text-anchor="middle" font-family="Impact,Haettenschweiler,sans-serif" font-size="72" letter-spacing="2" fill="#58d6ff">PREMIUMS</text>
  <text x="600" y="570" text-anchor="middle" font-family="Impact,Haettenschweiler,sans-serif" font-size="46" letter-spacing="3" fill="rgba(175,198,207,0.65)">ACROSS DEALERS</text>

  <!-- Divider -->
  <line x1="200" y1="610" x2="1000" y2="610" stroke="rgba(88,214,255,0.14)" stroke-width="1"/>

