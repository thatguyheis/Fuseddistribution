  <text x="134" y="729" font-family="'Trebuchet MS',sans-serif" font-size="14" fill="rgba(77,255,184,0.28)">silverinstitute.org/silver-investment/buying-guide</text>

  <text x="100" y="772" font-family="'Trebuchet MS',sans-serif" font-size="26" font-weight="700" fill="rgba(232,244,248,0.70)">Silver Buying Guide: Premiums and Dealer Comparison</text>
  <text x="100" y="806" font-family="'Trebuchet MS',sans-serif" font-size="21" fill="rgba(175,198,207,0.55)">Industry data on silver premiums by product type. How dealers</text>
