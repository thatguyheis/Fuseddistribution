<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <radialGradient id="glow-c" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#58d6ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#041018" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-tl" cx="0%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#4dffb8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#041018" stop-opacity="0"/>
    </radialGradient>
    <path id="star-sm" d="M 0,-7 L 1.76,-2.43 L 6.66,-2.16 L 2.85,0.93 L 4.11,5.66 L 0,3 L -4.11,5.66 L -2.85,0.93 L -6.66,-2.16 L -1.76,-2.43 Z"/>
  </defs>

  <rect width="1200" height="1200" fill="#041018"/>
  <rect width="1200" height="1200" fill="url(#glow-c)"/>
  <rect width="1200" height="1200" fill="url(#glow-tl)"/>

  <!-- Grid lines -->
  <line x1="170" y1="0" x2="170" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="340" y1="0" x2="340" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="510" y1="0" x2="510" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="680" y1="0" x2="680" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="850" y1="0" x2="850" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="1020" y1="0" x2="1020" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>

  <!-- Rings -->
  <circle cx="600" cy="600" r="420" fill="none" stroke="#58d6ff" stroke-width="1" opacity="0.06"/>
  <circle cx="600" cy="600" r="280" fill="none" stroke="#58d6ff" stroke-width="1" opacity="0.09"/>

  <!-- Scatter dots -->
  <circle cx="120" cy="150" r="1.4" fill="#58d6ff" opacity="0.22"/>
  <circle cx="380" cy="80"  r="1.0" fill="#4dffb8" opacity="0.18"/>
  <circle cx="820" cy="100" r="1.3" fill="#58d6ff" opacity="0.20"/>
  <circle cx="1060" cy="180" r="1.1" fill="#4dffb8" opacity="0.17"/>
  <circle cx="90" cy="700" r="1.2" fill="#4dffb8" opacity="0.19"/>
  <circle cx="1110" cy="650" r="1.3" fill="#58d6ff" opacity="0.22"/>
  <circle cx="340" cy="1080" r="1.0" fill="#4dffb8" opacity="0.15"/>
  <circle cx="880" cy="1060" r="1.2" fill="#58d6ff" opacity="0.18"/>

  <!-- TOP ZONE: eyebrow + brand -->
  <text x="600" y="100" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="22" fill="rgba(88,214,255,0.6)" text-anchor="middle" letter-spacing="5">FUSED TECHNOLOGY SOLUTIONS</text>
  <line x1="200" y1="120" x2="1000" y2="120" stroke="rgba(88,214,255,0.15)" stroke-width="1"/>
  <text x="600" y="165" font-family="'Trebuchet MS','Segoe UI',sans-serif" font-size="18" fill="rgba(175,198,207,0.55)" text-anchor="middle" letter-spacing="4">LOCAL BUSINESS · REPUTATION</text>

  <!-- CENTER ZONE: big stat -->
  <text x="600" y="400" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="220" fill="#58d6ff" text-anchor="middle" letter-spacing="2" opacity="0.95">45%</text>
  <text x="600" y="460" font-family="'Trebuchet MS','Segoe UI',sans-serif" font-size="26" fill="rgba(175,198,207,0.75)" text-anchor="middle" letter-spacing="2">OF CUSTOMERS MORE LIKELY TO VISIT</text>
  <text x="600" y="494" font-family="'Trebuchet MS','Segoe UI',sans-serif" font-size="20" fill="rgba(175,198,207,0.45)" text-anchor="middle" letter-spacing="2">WHEN YOU RESPOND TO NEGATIVE REVIEWS</text>

  <!-- Stars -->
  <g transform="translate(528,530)" fill="#58d6ff" opacity="0.85">
    <use href="#star-sm"/>
    <use href="#star-sm" transform="translate(22,0)"/>
    <use href="#star-sm" transform="translate(44,0)"/>
    <use href="#star-sm" transform="translate(66,0)"/>
    <use href="#star-sm" transform="translate(88,0)" fill="#afc6cf" opacity="0.35"/>
  </g>

  <!-- Title block -->
  <text x="600" y="620" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="64" fill="#ecf8fb" text-anchor="middle" letter-spacing="2">HOW TO RESPOND TO</text>
  <text x="600" y="692" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="64" fill="#58d6ff" text-anchor="middle" letter-spacing="2">NEGATIVE REVIEWS</text>

  <line x1="200" y1="720" x2="1000" y2="720" stroke="rgba(88,214,255,0.12)" stroke-width="1"/>

  <!-- Sub stat line -->
  <text x="600" y="780" font-family="'Trebuchet MS','Segoe UI',sans-serif" font-size="22" fill="rgba(175,198,207,0.65)" text-anchor="middle">89% of customers read how you respond before visiting</text>

  <!-- BOTTOM ZONE: CTA box -->
  <rect x="160" y="1010" width="880" height="100" rx="20" fill="rgba(7,20,28,0.9)" stroke="rgba(88,214,255,0.3)" stroke-width="1.5"/>
  <text x="600" y="1053" font-family="'Trebuchet MS','Segoe UI',sans-serif" font-size="18" fill="rgba(175,198,207,0.6)" text-anchor="middle" letter-spacing="2">FULL BREAKDOWN AT</text>
  <text x="600" y="1085" font-family="Impact,'Arial Narrow Bold',sans-serif" font-size="24" fill="#58d6ff" text-anchor="middle" letter-spacing="1">FUSEDDISTRIBUTION.COM</text>
</svg>
