<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#081c29"/><text x="86" y="83" fill="#58d6ff" font-family="Arial" font-size="25">Fused Distribution</text><text x="86" y="159" fill="#f2f8fb" font-family="Arial" font-size="54" font-weight="700">Map old website URLs</text><text x="86" y="211" fill="#b7cbd4" font-family="Arial" font-size="28">Give every address a decision and a test result</text><g font-family="Arial"><rect x="88" y="270" width="1424" height="116" rx="18" fill="#122d40"/><text x="122" y="317" fill="#58d6ff" font-size="30" font-weight="700">01  INVENTORY</text><text x="480" y="339" fill="#ecf5fa" font-size="27">List old pages from several sources</text><rect x="88" y="410" width="1424" height="116" rx="18" fill="#122d40"/><text x="122" y="457" fill="#58d6ff" font-size="30" font-weight="700">02  DECIDE</text><text x="480" y="479" fill="#ecf5fa" font-size="27">Choose a relevant destination</text><rect x="88" y="550" width="1424" height="116" rx="18" fill="#122d40"/><text x="122" y="597" fill="#58d6ff" font-size="30" font-weight="700">03  IMPLEMENT</text><text x="480" y="619" fill="#ecf5fa" font-size="27">Update redirects and internal links</text><rect x="88" y="690" width="1424" height="116" rx="18" fill="#122d40"/><text x="122" y="737" fill="#58d6ff" font-size="30" font-weight="700">04  TEST</text><text x="480" y="759" fill="#ecf5fa" font-size="27">Record the destination and page result</text></g></svg>