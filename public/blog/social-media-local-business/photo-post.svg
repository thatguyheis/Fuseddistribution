<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58d6ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#58d6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58d6ff"/>
      <stop offset="100%" stop-color="#4dffb8"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1e2a" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#071318" stop-opacity="0.96"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="#041018"/>
  <rect width="1080" height="1080" fill="url(#bg-glow)"/>

  <!-- Grid -->
  <line x1="216" y1="0" x2="216" y2="1080" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
  <line x1="432" y1="0" x2="432" y2="1080" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
  <line x1="648" y1="0" x2="648" y2="1080" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
  <line x1="864" y1="0" x2="864" y2="1080" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>

  <!-- Brand -->
  <text x="540" y="80" text-anchor="middle" font-family="Impact,Arial Narrow Bold,sans-serif" font-size="36" fill="#58d6ff" letter-spacing="4" opacity="0.9">FUSED TECHNOLOGY SOLUTIONS</text>

  <!-- Title -->
  <text x="540" y="160" text-anchor="middle" font-family="Impact,Arial Narrow Bold,sans-serif" font-size="52" fill="#ecf8fb" letter-spacing="2">SOCIAL MEDIA FOR</text>
  <text x="540" y="218" text-anchor="middle" font-family="Impact,Arial Narrow Bold,sans-serif" font-size="52" fill="#58d6ff" letter-spacing="2">LOCAL BUSINESS</text>
  <text x="540" y="264" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="22" fill="rgba(175,198,207,0.65)" letter-spacing="1">WHAT ACTUALLY WORKS IN 2026</text>

  <!-- Divider -->
  <rect x="340" y="284" width="400" height="2" rx="1" fill="url(#bar)" opacity="0.5"/>

  <!-- Stat 1 -->
  <rect x="60" y="312" width="300" height="180" rx="16" fill="url(#card-grad)" stroke="rgba(88,214,255,0.2)" stroke-width="1"/>
  <text x="210" y="380" text-anchor="middle" font-family="Impact,Arial Narrow Bold,sans-serif" font-size="64" fill="#58d6ff">1.65%</text>
  <rect x="90" y="396" width="240" height="1.5" rx="1" fill="rgba(88,214,255,0.2)"/>
  <text x="210" y="424" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="15" fill="rgba(175,198,207,0.8)" letter-spacing="1">FACEBOOK ORGANIC</text>
  <text x="210" y="446" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="15" fill="rgba(175,198,207,0.8)" letter-spacing="1">REACH PER POST</text>
  <text x="210" y="472" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="12" fill="rgba(88,214,255,0.45)">Sprout Social, 2026</text>

  <!-- Stat 2 -->
  <rect x="390" y="312" width="300" height="180" rx="16" fill="url(#card-grad)" stroke="rgba(77,255,184,0.25)" stroke-width="1.5"/>
  <text x="540" y="380" text-anchor="middle" font-family="Impact,Arial Narrow Bold,sans-serif" font-size="64" fill="#4dffb8">$8.17</text>
  <rect x="420" y="396" width="240" height="1.5" rx="1" fill="rgba(77,255,184,0.2)"/>
  <text x="540" y="424" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="15" fill="rgba(175,198,207,0.8)" letter-spacing="1">RETURN PER $1</text>
  <text x="540" y="446" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="15" fill="rgba(175,198,207,0.8)" letter-spacing="1">ON FACEBOOK ADS</text>
  <text x="540" y="472" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="12" fill="rgba(77,255,184,0.45)">XtendedView, 2026</text>

