  <text x="160" y="580" text-anchor="end" font-family="Trebuchet MS,sans-serif" font-size="15" fill="rgba(175,198,207,0.7)">Facebook</text>
  <rect x="172" y="564" width="736" height="28" rx="5" fill="rgba(255,255,255,0.04)"/>
  <rect x="172" y="564" width="346" height="28" rx="5" fill="url(#bar)" opacity="0.65"/>
  <text x="526" y="582" font-family="Impact,sans-serif" font-size="17" fill="rgba(236,248,251,0.9)" dx="8">1.65%</text>

  <!-- Instagram bar -->
  <text x="160" y="638" text-anchor="end" font-family="Trebuchet MS,sans-serif" font-size="15" fill="rgba(175,198,207,0.7)">Instagram</text>
  <rect x="172" y="622" width="736" height="28" rx="5" fill="rgba(255,255,255,0.04)"/>
  <rect x="172" y="622" width="736" height="28" rx="5" fill="url(#bar)" opacity="0.82"/>
  <text x="914" y="640" font-family="Impact,sans-serif" font-size="17" fill="rgba(236,248,251,0.9)" dx="6">3.5%</text>

  <!-- Rule box -->
  <rect x="60" y="700" width="960" height="200" rx="18" fill="rgba(88,214,255,0.04)" stroke="rgba(88,214,255,0.14)" stroke-width="1"/>
  <text x="540" y="748" text-anchor="middle" font-family="Impact,Arial Narrow Bold,sans-serif" font-size="22" fill="#58d6ff" letter-spacing="2">THE 20-MINUTE WEEKLY ROUTINE</text>
  <text x="540" y="784" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="17" fill="rgba(175,198,207,0.75)">1. Take 2-3 job photos this week</text>
  <text x="540" y="812" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="17" fill="rgba(175,198,207,0.75)">2. Post one to Google Business Profile</text>
  <text x="540" y="840" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="17" fill="rgba(175,198,207,0.75)">3. Post one to your best social platform</text>
  <text x="540" y="868" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="17" fill="rgba(175,198,207,0.75)">4. Reply to comments same day</text>

  <!-- Bottom -->
  <text x="540" y="980" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="16" fill="rgba(88,214,255,0.4)" letter-spacing="2">FUSEDDISTRIBUTION.COM/BLOG</text>
  <text x="540" y="1010" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="14" fill="rgba(175,198,207,0.3)" letter-spacing="1">Full breakdown — link in bio</text>
</svg>
