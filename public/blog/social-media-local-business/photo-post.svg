  <rect x="720" y="312" width="300" height="180" rx="16" fill="url(#card-grad)" stroke="rgba(88,214,255,0.2)" stroke-width="1"/>
  <text x="870" y="380" text-anchor="middle" font-family="Impact,Arial Narrow Bold,sans-serif" font-size="64" fill="#58d6ff">70%</text>
  <rect x="750" y="396" width="240" height="1.5" rx="1" fill="rgba(88,214,255,0.2)"/>
  <text x="870" y="424" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="15" fill="rgba(175,198,207,0.8)" letter-spacing="1">MORE LOCATION</text>
