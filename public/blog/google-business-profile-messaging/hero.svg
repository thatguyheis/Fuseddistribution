  <circle cx="72" cy="0" r="10" fill="rgba(88,214,255,0.15)" stroke="#58d6ff" stroke-width="1" stroke-opacity="0.4" transform="translate(906,228)"/>
  <text x="978" y="233" font-family="Trebuchet MS,sans-serif" font-size="11" fill="#afc6cf">1. Open Google Maps app</text>
  <text x="918" y="228" text-anchor="middle" font-family="Impact,sans-serif" font-size="12" fill="#58d6ff">1</text>
  <circle cx="72" cy="0" r="10" fill="rgba(88,214,255,0.15)" stroke="#58d6ff" stroke-width="1" stroke-opacity="0.4" transform="translate(906,258)"/>
  <text x="978" y="263" font-family="Trebuchet MS,sans-serif" font-size="11" fill="#afc6cf">2. Tap your Business Profile</text>
  <text x="918" y="258" text-anchor="middle" font-family="Impact,sans-serif" font-size="12" fill="#58d6ff">2</text>
  <circle cx="72" cy="0" r="10" fill="rgba(88,214,255,0.15)" stroke="#58d6ff" stroke-width="1" stroke-opacity="0.4" transform="translate(906,288)"/>
  <text x="978" y="293" font-family="Trebuchet MS,sans-serif" font-size="11" fill="#afc6cf">3. Toggle Messages ON</text>
  <text x="918" y="288" text-anchor="middle" font-family="Impact,sans-serif" font-size="12" fill="#58d6ff">3</text>
  <line x1="894" y1="312" x2="1142" y2="312" stroke="rgba(88,214,255,0.1)" stroke-width="1"/>
  <text x="1018" y="332" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="11" fill="rgba(175,198,207,0.55)">24-hr response required</text>
  <text x="1018" y="350" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="11" fill="rgba(175,198,207,0.55)">to keep feature active</text>

  <!-- Brand mark bottom left -->
  <text x="42" y="590" font-family="Impact,Haettenschweiler,sans-serif" font-size="22" letter-spacing="4" fill="rgba(88,214,255,0.5)">FUSED</text>
  <text x="42" y="608" font-family="Trebuchet MS,sans-serif" font-size="10" letter-spacing="2" fill="rgba(175,198,207,0.4)">TECHNOLOGY SOLUTIONS</text>

