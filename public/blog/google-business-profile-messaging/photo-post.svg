  <!-- Scatter dots -->
  <circle cx="142" cy="100" r="1.5" fill="#58d6ff" opacity="0.22"/>
  <circle cx="380" cy="68" r="1" fill="#4dffb8" opacity="0.28"/>
  <circle cx="900" cy="88" r="1.5" fill="#58d6ff" opacity="0.18"/>
  <circle cx="1080" cy="250" r="1" fill="#4dffb8" opacity="0.20"/>
  <circle cx="88" cy="600" r="1.5" fill="#58d6ff" opacity="0.18"/>
  <circle cx="1100" cy="700" r="1" fill="#4dffb8" opacity="0.16"/>
  <circle cx="200" cy="900" r="1.5" fill="#58d6ff" opacity="0.14"/>
  <circle cx="1050" cy="950" r="1" fill="#58d6ff" opacity="0.18"/>
  <circle cx="450" cy="1100" r="1.5" fill="#4dffb8" opacity="0.15"/>
  <circle cx="780" cy="1080" r="1" fill="#58d6ff" opacity="0.17"/>

