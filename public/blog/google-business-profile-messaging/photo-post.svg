  <rect x="200" y="990" width="800" height="60" rx="14" fill="rgba(88,214,255,0.05)" stroke="rgba(88,214,255,0.25)" stroke-width="1.5"/>
  <text x="600" y="1027" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="18" font-weight="700" fill="#58d6ff" letter-spacing="1">Full breakdown at fuseddistribution.com</text>

  <text x="600" y="1100" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="15" fill="rgba(175,198,207,0.45)">fuseddistribution.com/blog/google-business-profile-messaging/</text>
