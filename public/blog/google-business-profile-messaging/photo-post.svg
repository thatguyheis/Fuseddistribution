  <rect x="300" y="60" width="600" height="38" rx="19" fill="rgba(88,214,255,0.08)" stroke="rgba(88,214,255,0.22)" stroke-width="1"/>
  <text x="600" y="85" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="13" font-weight="800" letter-spacing="3" fill="#58d6ff">GOOGLE BUSINESS PROFILE &#183; LOCAL BUSINESS</text>

  <text x="600" y="145" text-anchor="middle" font-family="Impact,Haettenschweiler,sans-serif" font-size="28" letter-spacing="6" fill="rgba(88,214,255,0.6)">FUSED</text>

  <!-- CENTER ZONE: Big stat -->
  <text x="600" y="370" text-anchor="middle" font-family="Impact,Haettenschweiler,sans-serif" font-size="200" letter-spacing="2" fill="#58d6ff">45%</text>

  <text x="600" y="430" text-anchor="middle" font-family="Impact,Haettenschweiler,sans-serif" font-size="32" letter-spacing="2" fill="#ecf8fb">CHAT RESPONSE RATE</text>
