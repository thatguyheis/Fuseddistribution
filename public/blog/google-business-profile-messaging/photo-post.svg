  <rect x="80" y="850" width="310" height="90" rx="14" fill="rgba(88,214,255,0.06)" stroke="rgba(88,214,255,0.14)" stroke-width="1"/>
  <text x="235" y="887" text-anchor="middle" font-family="Impact,Haettenschweiler,sans-serif" font-size="34" fill="#58d6ff">3 MIN</text>
  <text x="235" y="913" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="13" fill="rgba(175,198,207,0.7)">to enable</text>

  <rect x="445" y="850" width="310" height="90" rx="14" fill="rgba(88,214,255,0.06)" stroke="rgba(88,214,255,0.14)" stroke-width="1"/>
  <text x="600" y="887" text-anchor="middle" font-family="Impact,Haettenschweiler,sans-serif" font-size="34" fill="#58d6ff">24 HR</text>
  <text x="600" y="913" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="13" fill="rgba(175,198,207,0.7)">response window</text>

  <rect x="810" y="850" width="310" height="90" rx="14" fill="rgba(88,214,255,0.06)" stroke="rgba(88,214,255,0.14)" stroke-width="1"/>
  <text x="965" y="887" text-anchor="middle" font-family="Impact,Haettenschweiler,sans-serif" font-size="34" fill="#4dffb8">FREE</text>
  <text x="965" y="913" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="13" fill="rgba(175,198,207,0.7)">no cost, no app</text>

