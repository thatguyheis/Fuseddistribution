  <text x="600" y="770" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="22" fill="rgba(175,198,207,0.75)">Free to enable. 3 minutes to set up.</text>
  <text x="600" y="800" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="22" fill="rgba(175,198,207,0.75)">Converts Google visitors into booked customers.</text>

