<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#071522"/>
  <circle cx="1080" cy="72" r="160" fill="#12334a" opacity=".55"/>
  <text x="72" y="96" fill="#58d6ff" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3">FUSED DISTRIBUTION</text>
  <text x="72" y="190" fill="#fff" font-family="Arial,sans-serif" font-size="52" font-weight="700">WEBSITE SPEED</text>
  <text x="72" y="250" fill="#fff" font-family="Arial,sans-serif" font-size="52" font-weight="700">MEASURE. REPAIR. VERIFY.</text>
  <text x="72" y="304" fill="#a9c9d5" font-family="Arial,sans-serif" font-size="24">Improve the customer task, then check the evidence.</text>
  <g font-family="Arial,sans-serif">
    <rect x="72" y="390" width="310" height="140" rx="18" fill="#102d40" stroke="#58d6ff" stroke-width="2"/>
    <text x="100" y="430" fill="#58d6ff" font-size="18" font-weight="700">MEASURE</text><text x="100" y="468" fill="#fff" font-size="22">Start with a task</text><text x="100" y="500" fill="#a9c9d5" font-size="18">and record a baseline.</text>
    <rect x="425" y="390" width="310" height="140" rx="18" fill="#102d40" stroke="#8df0c3" stroke-width="2"/>
    <text x="453" y="430" fill="#8df0c3" font-size="18" font-weight="700">REPAIR</text><text x="453" y="468" fill="#fff" font-size="22">Change one thing</text><text x="453" y="500" fill="#a9c9d5" font-size="18">and preserve a fallback.</text>
    <rect x="778" y="390" width="310" height="140" rx="18" fill="#102d40" stroke="#58d6ff" stroke-width="2"/>
    <text x="806" y="430" fill="#58d6ff" font-size="18" font-weight="700">VERIFY</text><text x="806" y="468" fill="#fff" font-size="22">Test the journey</text><text x="806" y="500" fill="#a9c9d5" font-size="18">and record the result.</text>
  </g>
</svg>
