  <!-- Big stat -->
  <text x="600" y="424" text-anchor="middle" font-family="Impact, Arial Narrow Bold, sans-serif" font-size="104" letter-spacing="-2" fill="#58d6ff">~30%</text>
  <text x="600" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" letter-spacing="3" fill="rgba(175,198,207,0.65)">ANNUAL VOLATILITY, ROUGHLY TWICE GOLD'S</text>
  <text x="600" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="rgba(175,198,207,0.5)" letter-spacing="1">SPOT VS FUTURES &#183; TREND &#183; TRUE COST PER OUNCE</text>

  <!-- Right card: true cost math -->
  <rect x="886" y="185" width="272" height="240" rx="14" fill="rgba(7,20,28,0.82)" stroke="rgba(88,214,255,0.16)" stroke-width="1"/>
  <rect x="886" y="185" width="272" height="4" rx="2" fill="#4dffb8" opacity="0.6"/>
  <text x="1022" y="222" text-anchor="middle" font-family="Impact, Arial Narrow Bold, sans-serif" font-size="11" letter-spacing="2" fill="#4dffb8" opacity="0.8">TRUE COST PER OUNCE</text>
  <text x="1022" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="rgba(175,198,207,0.75)">Spot price: $32.00</text>
  <text x="1022" y="284" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="rgba(175,198,207,0.75)">1 oz coin: $36.00</text>
  <rect x="910" y="302" width="224" height="1" rx="1" fill="rgba(88,214,255,0.15)"/>
  <text x="1022" y="340" text-anchor="middle" font-family="Impact, Arial Narrow Bold, sans-serif" font-size="30" fill="#58d6ff">12.5%</text>
  <text x="1022" y="364" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="rgba(175,198,207,0.6)">premium over spot</text>
  <text x="1022" y="398" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="rgba(88,214,255,0.5)">The chart is never the price you pay</text>

  <!-- Bottom brand bar -->
  <rect x="0" y="590" width="1200" height="40" fill="rgba(4,16,24,0.9)"/>
  <text x="600" y="614" text-anchor="middle" font-family="Impact, Arial Narrow Bold, sans-serif" font-size="13" letter-spacing="4" fill="rgba(88,214,255,0.5)">FUSEDDISTRIBUTION.COM</text>
</svg>
