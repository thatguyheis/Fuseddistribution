  <text x="600" y="170" text-anchor="middle" font-family="Impact, Arial Narrow Bold, sans-serif" font-size="13" letter-spacing="4" fill="#4dffb8" opacity="0.85">SILVER PRICING GUIDE &#183; 2026</text>
  <text x="600" y="246" text-anchor="middle" font-family="Impact, Arial Narrow Bold, sans-serif" font-size="58" letter-spacing="2" fill="#ecf8fb">HOW TO READ SILVER</text>
