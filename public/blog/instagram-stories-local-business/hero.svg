<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow-c" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58d6ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#58d6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-tl" cx="0%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#4dffb8" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#4dffb8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#041018"/>
  <rect width="1200" height="630" fill="url(#glow-c)"/>
  <rect width="1200" height="630" fill="url(#glow-tl)"/>

  <!-- Grid lines -->
  <line x1="170" y1="0" x2="170" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="340" y1="0" x2="340" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="510" y1="0" x2="510" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="680" y1="0" x2="680" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="850" y1="0" x2="850" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="1020" y1="0" x2="1020" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>

  <!-- Rings -->
  <circle cx="600" cy="315" r="255" stroke="#58d6ff" stroke-opacity="0.07" stroke-width="1" fill="none"/>
  <circle cx="600" cy="315" r="170" stroke="#58d6ff" stroke-opacity="0.11" stroke-width="1" fill="none"/>

  <!-- Scatter dots -->
  <circle cx="142" cy="88" r="1.5" fill="#58d6ff" fill-opacity="0.22"/>
  <circle cx="890" cy="54" r="1" fill="#4dffb8" fill-opacity="0.28"/>
  <circle cx="1058" cy="187" r="1.5" fill="#58d6ff" fill-opacity="0.18"/>
  <circle cx="74" cy="402" r="1" fill="#4dffb8" fill-opacity="0.20"/>
  <circle cx="1130" cy="480" r="1.5" fill="#58d6ff" fill-opacity="0.25"/>
  <circle cx="318" cy="570" r="1" fill="#4dffb8" fill-opacity="0.17"/>
  <circle cx="760" cy="598" r="1.5" fill="#58d6ff" fill-opacity="0.20"/>
  <circle cx="445" cy="42" r="1" fill="#58d6ff" fill-opacity="0.28"/>
  <circle cx="980" cy="340" r="1.5" fill="#4dffb8" fill-opacity="0.15"/>
  <circle cx="205" cy="295" r="1" fill="#58d6ff" fill-opacity="0.22"/>

  <!-- Left card: 1 IN 3 -->
  <rect x="42" y="220" width="260" height="130" rx="14" fill="rgba(7,22,32,0.82)" stroke="rgba(88,214,255,0.18)" stroke-width="1"/>
  <text x="172" y="272" text-anchor="middle" font-family="Impact, 'Arial Narrow Bold', sans-serif" font-size="52" fill="#4dffb8" letter-spacing="2">1 IN 3</text>
  <text x="172" y="296" text-anchor="middle" font-family="'Trebuchet MS', sans-serif" font-size="12" fill="rgba(175,198,207,0.7)" letter-spacing="2" text-transform="uppercase">TOP STORIES FROM BUSINESSES</text>
  <text x="172" y="314" text-anchor="middle" font-family="'Trebuchet MS', sans-serif" font-size="11" fill="rgba(175,198,207,0.45)" letter-spacing="1">Meta, 2023</text>

  <!-- Right card: 58% -->
  <rect x="898" y="220" width="260" height="130" rx="14" fill="rgba(7,22,32,0.82)" stroke="rgba(88,214,255,0.18)" stroke-width="1"/>
  <text x="1028" y="272" text-anchor="middle" font-family="Impact, 'Arial Narrow Bold', sans-serif" font-size="52" fill="#58d6ff" letter-spacing="2">58%</text>
  <text x="1028" y="296" text-anchor="middle" font-family="'Trebuchet MS', sans-serif" font-size="12" fill="rgba(175,198,207,0.7)" letter-spacing="2" text-transform="uppercase">MORE INTERESTED AFTER STORIES</text>
  <text x="1028" y="314" text-anchor="middle" font-family="'Trebuchet MS', sans-serif" font-size="11" fill="rgba(175,198,207,0.45)" letter-spacing="1">Facebook IQ, 2021</text>

  <!-- Center: main stat + title -->
  <text x="600" y="175" text-anchor="middle" font-family="Impact, 'Arial Narrow Bold', sans-serif" font-size="18" fill="rgba(88,214,255,0.6)" letter-spacing="5">INSTAGRAM STORIES</text>
  <text x="600" y="275" text-anchor="middle" font-family="Impact, 'Arial Narrow Bold', sans-serif" font-size="118" fill="#ecf8fb" letter-spacing="2">500M</text>
  <text x="600" y="310" text-anchor="middle" font-family="'Trebuchet MS', sans-serif" font-size="16" fill="rgba(175,198,207,0.75)" letter-spacing="4">DAILY VIEWERS WORLDWIDE</text>

  <!-- Bottom label -->
  <text x="600" y="420" text-anchor="middle" font-family="Impact, 'Arial Narrow Bold', sans-serif" font-size="22" fill="rgba(77,255,184,0.8)" letter-spacing="3">FOR LOCAL BUSINESS</text>

  <!-- Horizontal divider line center -->
  <line x1="420" y1="390" x2="780" y2="390" stroke="rgba(88,214,255,0.18)" stroke-width="1"/>

  <!-- Brand watermark -->
  <text x="600" y="590" text-anchor="middle" font-family="Impact, 'Arial Narrow Bold', sans-serif" font-size="14" fill="rgba(88,214,255,0.3)" letter-spacing="6">FUSEDDISTRIBUTION.COM</text>
</svg>
