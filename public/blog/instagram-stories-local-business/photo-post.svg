<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <radialGradient id="glow-c" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58d6ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#58d6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-tl" cx="0%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#4dffb8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#4dffb8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1200" fill="#041018"/>
  <rect width="1200" height="1200" fill="url(#glow-c)"/>
  <rect width="1200" height="1200" fill="url(#glow-tl)"/>

  <!-- Grid lines -->
  <line x1="170" y1="0" x2="170" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="340" y1="0" x2="340" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="510" y1="0" x2="510" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="680" y1="0" x2="680" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="850" y1="0" x2="850" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="1020" y1="0" x2="1020" y2="1200" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>

  <!-- Rings -->
  <circle cx="600" cy="600" r="420" stroke="#58d6ff" stroke-opacity="0.06" stroke-width="1" fill="none"/>
  <circle cx="600" cy="600" r="280" stroke="#58d6ff" stroke-opacity="0.10" stroke-width="1" fill="none"/>

  <!-- Scatter dots -->
  <circle cx="130" cy="110" r="1.5" fill="#58d6ff" fill-opacity="0.22"/>
  <circle cx="1060" cy="80" r="1" fill="#4dffb8" fill-opacity="0.28"/>
  <circle cx="1120" cy="340" r="1.5" fill="#58d6ff" fill-opacity="0.18"/>
  <circle cx="68" cy="700" r="1" fill="#4dffb8" fill-opacity="0.20"/>
  <circle cx="1150" cy="900" r="1.5" fill="#58d6ff" fill-opacity="0.25"/>
  <circle cx="310" cy="1100" r="1" fill="#4dffb8" fill-opacity="0.17"/>
  <circle cx="820" cy="1140" r="1.5" fill="#58d6ff" fill-opacity="0.20"/>
  <circle cx="460" cy="55" r="1" fill="#58d6ff" fill-opacity="0.28"/>
  <circle cx="990" cy="640" r="1.5" fill="#4dffb8" fill-opacity="0.15"/>

  <!-- Top zone: category + brand -->
  <text x="600" y="108" text-anchor="middle" font-family="Impact, 'Arial Narrow Bold', sans-serif" font-size="22" fill="rgba(88,214,255,0.55)" letter-spacing="6">SOCIAL MEDIA FOR LOCAL BUSINESS</text>
  <text x="600" y="158" text-anchor="middle" font-family="Impact, 'Arial Narrow Bold', sans-serif" font-size="38" fill="#58d6ff" letter-spacing="8">FUSED</text>
  <line x1="200" y1="178" x2="1000" y2="178" stroke="rgba(88,214,255,0.18)" stroke-width="1"/>

  <!-- Center zone: big stat -->
  <text x="600" y="400" text-anchor="middle" font-family="Impact, 'Arial Narrow Bold', sans-serif" font-size="240" fill="#ecf8fb" letter-spacing="2" opacity="0.97">50%</text>
  <text x="600" y="460" text-anchor="middle" font-family="'Trebuchet MS', sans-serif" font-size="26" fill="rgba(175,198,207,0.8)" letter-spacing="4">OF STORY VIEWERS VISIT YOUR WEBSITE</text>

  <!-- Secondary line -->
  <line x1="200" y1="500" x2="1000" y2="500" stroke="rgba(88,214,255,0.12)" stroke-width="1"/>

  <!-- Title block -->
  <text x="600" y="580" text-anchor="middle" font-family="Impact, 'Arial Narrow Bold', sans-serif" font-size="58" fill="#ecf8fb" letter-spacing="2">INSTAGRAM STORIES</text>
  <text x="600" y="650" text-anchor="middle" font-family="Impact, 'Arial Narrow Bold', sans-serif" font-size="58" fill="#4dffb8" letter-spacing="2">FOR LOCAL BUSINESS</text>

  <!-- Supporting stats row -->
  <rect x="100" y="700" width="290" height="100" rx="12" fill="rgba(88,214,255,0.06)" stroke="rgba(88,214,255,0.18)" stroke-width="1"/>
  <text x="245" y="745" text-anchor="middle" font-family="Impact, 'Arial Narrow Bold', sans-serif" font-size="38" fill="#58d6ff">500M</text>
  <text x="245" y="775" text-anchor="middle" font-family="'Trebuchet MS', sans-serif" font-size="13" fill="rgba(175,198,207,0.65)" letter-spacing="2">DAILY VIEWERS</text>

  <rect x="455" y="700" width="290" height="100" rx="12" fill="rgba(88,214,255,0.06)" stroke="rgba(88,214,255,0.18)" stroke-width="1"/>
  <text x="600" y="745" text-anchor="middle" font-family="Impact, 'Arial Narrow Bold', sans-serif" font-size="38" fill="#4dffb8">1 IN 3</text>
  <text x="600" y="775" text-anchor="middle" font-family="'Trebuchet MS', sans-serif" font-size="13" fill="rgba(175,198,207,0.65)" letter-spacing="2">FROM BUSINESSES</text>

  <rect x="810" y="700" width="290" height="100" rx="12" fill="rgba(88,214,255,0.06)" stroke="rgba(88,214,255,0.18)" stroke-width="1"/>
  <text x="955" y="745" text-anchor="middle" font-family="Impact, 'Arial Narrow Bold', sans-serif" font-size="38" fill="#58d6ff">58%</text>
  <text x="955" y="775" text-anchor="middle" font-family="'Trebuchet MS', sans-serif" font-size="13" fill="rgba(175,198,207,0.65)" letter-spacing="2">MORE BRAND INTEREST</text>

  <!-- Bottom zone: excerpt + CTA -->
  <line x1="100" y1="840" x2="1100" y2="840" stroke="rgba(88,214,255,0.12)" stroke-width="1"/>
  <text x="600" y="900" text-anchor="middle" font-family="'Trebuchet MS', sans-serif" font-size="22" fill="rgba(175,198,207,0.75)">4 Story features that turn followers into booked customers.</text>
  <text x="600" y="935" text-anchor="middle" font-family="'Trebuchet MS', sans-serif" font-size="22" fill="rgba(175,198,207,0.75)">Polls, questions, countdowns, and link stickers.</text>

  <!-- CTA button shape -->
  <rect x="300" y="990" width="600" height="72" rx="16" fill="rgba(88,214,255,0.08)" stroke="rgba(88,214,255,0.35)" stroke-width="1.5"/>
  <text x="600" y="1034" text-anchor="middle" font-family="Impact, 'Arial Narrow Bold', sans-serif" font-size="22" fill="#58d6ff" letter-spacing="3">FULL BREAKDOWN AT FUSEDDISTRIBUTION.COM</text>

  <!-- Brand bottom -->
  <text x="600" y="1150" text-anchor="middle" font-family="Impact, 'Arial Narrow Bold', sans-serif" font-size="14" fill="rgba(88,214,255,0.28)" letter-spacing="5">FUSED TECHNOLOGY SOLUTIONS</text>
</svg>
