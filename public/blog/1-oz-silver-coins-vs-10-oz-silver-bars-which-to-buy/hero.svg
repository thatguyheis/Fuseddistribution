  <rect x="468" y="400" width="264" height="68" rx="14" fill="rgba(77,255,184,0.08)" stroke="rgba(77,255,184,0.22)" stroke-width="1"/>
  <text x="600" y="429" text-anchor="middle" font-family="Impact,Haettenschweiler,Arial Narrow Bold,sans-serif" font-size="30" fill="#4dffb8">~$416 DIFFERENCE</text>
  <text x="600" y="454" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="12" fill="rgba(175,198,207,0.55)">on 100 oz at same spot price</text>

  <!-- RIGHT CARD: 10 oz bar -->
  <rect x="863" y="128" width="295" height="320" rx="18" fill="rgba(11,28,42,0.78)" stroke="rgba(77,255,184,0.18)" stroke-width="1"/>

