  <rect x="82" y="146" width="215" height="26" rx="13" fill="rgba(88,214,255,0.10)" stroke="rgba(88,214,255,0.25)" stroke-width="1"/>
  <text x="189" y="164" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="11" font-weight="800" letter-spacing="3" fill="#58d6ff">1 OZ COIN</text>

  <!-- Left big number -->
  <text x="189" y="265" text-anchor="middle" font-family="Impact,Haettenschweiler,Arial Narrow Bold,sans-serif" font-size="88" fill="#ecf8fb">12</text>
  <text x="189" y="302" text-anchor="middle" font-family="Impact,Haettenschweiler,Arial Narrow Bold,sans-serif" font-size="22" letter-spacing="2" fill="#58d6ff">TO 22% PREMIUM</text>
  <text x="189" y="328" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="13" fill="rgba(175,198,207,0.70)">over spot price</text>

  <!-- Left divider -->
  <line x1="68" y1="348" x2="310" y2="348" stroke="rgba(88,214,255,0.10)" stroke-width="1"/>

