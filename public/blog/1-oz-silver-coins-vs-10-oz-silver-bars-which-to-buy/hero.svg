  <text x="189" y="398" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="15" fill="#ecf8fb" font-weight="700">$35.84 &#8211; $39.04 / oz</text>
  <text x="189" y="420" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="12" fill="rgba(175,198,207,0.45)">at $32 spot</text>

  <!-- CENTER ZONE -->
  <!-- Center label top -->
  <text x="600" y="178" text-anchor="middle" font-family="Impact,Haettenschweiler,Arial Narrow Bold,sans-serif" font-size="22" letter-spacing="5" fill="rgba(175,198,207,0.40)">1 OZ COINS</text>

