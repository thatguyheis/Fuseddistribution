  <rect x="903" y="146" width="215" height="26" rx="13" fill="rgba(77,255,184,0.10)" stroke="rgba(77,255,184,0.25)" stroke-width="1"/>
  <text x="1010" y="164" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="11" font-weight="800" letter-spacing="3" fill="#4dffb8">10 OZ BAR</text>

  <!-- Right big number -->
  <text x="1010" y="265" text-anchor="middle" font-family="Impact,Haettenschweiler,Arial Narrow Bold,sans-serif" font-size="88" fill="#ecf8fb">4</text>
  <text x="1010" y="302" text-anchor="middle" font-family="Impact,Haettenschweiler,Arial Narrow Bold,sans-serif" font-size="22" letter-spacing="2" fill="#4dffb8">TO 6% PREMIUM</text>
  <text x="1010" y="328" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="13" fill="rgba(175,198,207,0.70)">over spot price</text>

  <!-- Right divider -->
  <line x1="889" y1="348" x2="1131" y2="348" stroke="rgba(77,255,184,0.10)" stroke-width="1"/>

  <!-- Right bottom detail -->
  <text x="1010" y="374" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="11" fill="rgba(175,198,207,0.55)" letter-spacing="2">GENERIC BULLION BAR</text>
  <text x="1010" y="398" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="15" fill="#ecf8fb" font-weight="700">$33.28 &#8211; $33.92 / oz</text>
  <text x="1010" y="420" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="12" fill="rgba(175,198,207,0.45)">at $32 spot</text>

  <!-- Bottom brand -->
  <text x="600" y="592" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="13" font-weight="800" letter-spacing="4" fill="rgba(175,198,207,0.35)">FUSEDDISTRIBUTION.COM</text>
</svg>
