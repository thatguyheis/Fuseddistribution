<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="cg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0d3a54" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#041018" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gg" cx="8%" cy="12%" r="40%">
      <stop offset="0%" stop-color="#4dffb8" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#041018" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#041018"/>
  <rect width="1200" height="630" fill="url(#cg)"/>
  <rect width="1200" height="630" fill="url(#gg)"/>

  <!-- Grid lines -->
  <line x1="170" y1="0" x2="170" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="340" y1="0" x2="340" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="510" y1="0" x2="510" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="680" y1="0" x2="680" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="850" y1="0" x2="850" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
  <line x1="1020" y1="0" x2="1020" y2="630" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>

  <!-- Rings -->
  <circle cx="600" cy="315" r="255" fill="none" stroke="#58d6ff" stroke-width="1" stroke-opacity="0.07"/>
  <circle cx="600" cy="315" r="170" fill="none" stroke="#58d6ff" stroke-width="1" stroke-opacity="0.11"/>

  <!-- Scatter dots -->
  <circle cx="120" cy="80" r="1.5" fill="#58d6ff" fill-opacity="0.22"/>
  <circle cx="240" cy="200" r="1" fill="#4dffb8" fill-opacity="0.18"/>
  <circle cx="380" cy="520" r="1.5" fill="#58d6ff" fill-opacity="0.15"/>
  <circle cx="560" cy="58" r="1" fill="#4dffb8" fill-opacity="0.25"/>
  <circle cx="780" cy="575" r="1.5" fill="#58d6ff" fill-opacity="0.20"/>
  <circle cx="950" cy="90" r="1" fill="#4dffb8" fill-opacity="0.22"/>
  <circle cx="1085" cy="320" r="1.5" fill="#58d6ff" fill-opacity="0.18"/>
  <circle cx="440" cy="440" r="1" fill="#58d6ff" fill-opacity="0.15"/>
  <circle cx="820" cy="160" r="1.5" fill="#4dffb8" fill-opacity="0.20"/>
  <circle cx="160" cy="445" r="1" fill="#58d6ff" fill-opacity="0.25"/>

  <!-- LEFT CARD: 1 oz coin -->
  <rect x="42" y="128" width="295" height="320" rx="18" fill="rgba(11,28,42,0.78)" stroke="rgba(88,214,255,0.18)" stroke-width="1"/>

