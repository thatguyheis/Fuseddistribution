<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Track cost per buyer</title>
  <desc id="desc">A fictional campaign receipt flows through six customer icons into a calculator showing a cost per buyer.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06131c"/><stop offset="1" stop-color="#102934"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#58d6ff"/><stop offset="1" stop-color="#4dffb8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="840" cy="290" r="305" fill="#58d6ff" opacity=".045"/>
  <path d="M0 520 C190 430 275 625 455 530 S775 420 950 515 S1115 590 1200 505 V630 H0Z" fill="#58d6ff" opacity=".035"/>
  <text x="64" y="68" fill="#58d6ff" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="5">FUSED DISTRIBUTION</text>
  <text x="64" y="144" fill="#ecf8fb" font-family="Arial,sans-serif" font-size="26" font-weight="700" letter-spacing="2">A WEEKLY WORKSHEET</text>
  <text x="64" y="216" fill="#f8fdff" font-family="Arial,sans-serif" font-size="55" font-weight="800">TRACK COST</text>
  <text x="64" y="278" fill="#f8fdff" font-family="Arial,sans-serif" font-size="55" font-weight="800">PER BUYER</text>
  <text x="64" y="329" fill="#a9c6d1" font-family="Arial,sans-serif" font-size="23">One campaign. One clear calculation.</text>
  <rect x="64" y="371" width="275" height="42" rx="21" fill="#09222c" stroke="#58d6ff" stroke-opacity=".55"/>
  <text x="201" y="399" text-anchor="middle" fill="#58d6ff" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1">FICTIONAL EXAMPLE</text>

  <g filter="url(#shadow)">
    <path d="M80 442 H273 L303 471 V575 H80Z" fill="#f1f7f8"/>
    <path d="M273 442 V472 H303" fill="#d5e7eb"/>
    <text x="101" y="478" fill="#28414b" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1">CAMPAIGN COST</text>
    <text x="101" y="531" fill="#0b2029" font-family="Arial,sans-serif" font-size="44" font-weight="800">$240</text>
    <path d="M101 550 H269" stroke="#a8bdc4" stroke-width="2" stroke-dasharray="5 6"/>
    <text x="101" y="570" fill="#48616a" font-family="Arial,sans-serif" font-size="13">ONE LOCAL PROMOTION</text>
  </g>

  <path d="M327 511 H376" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <path d="M365 498 L381 511 L365 524" fill="none" stroke="#4dffb8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(403 380)">
    <text x="70" y="-7" text-anchor="middle" fill="#a9c6d1" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1">FIRST TIME BUYERS</text>
    <g fill="#58d6ff">
      <circle cx="20" cy="33" r="10"/><path d="M4 70c2-15 8-22 16-22s14 7 16 22z"/>
      <circle cx="70" cy="33" r="10"/><path d="M54 70c2-15 8-22 16-22s14 7 16 22z"/>
      <circle cx="120" cy="33" r="10"/><path d="M104 70c2-15 8-22 16-22s14 7 16 22z"/>
    </g>
    <g fill="#4dffb8">
      <circle cx="20" cy="103" r="10"/><path d="M4 140c2-15 8-22 16-22s14 7 16 22z"/>
      <circle cx="70" cy="103" r="10"/><path d="M54 140c2-15 8-22 16-22s14 7 16 22z"/>
      <circle cx="120" cy="103" r="10"/><path d="M104 140c2-15 8-22 16-22s14 7 16 22z"/>
    </g>
    <text x="70" y="178" text-anchor="middle" fill="#f8fdff" font-family="Arial,sans-serif" font-size="34" font-weight="800">6</text>
    <text x="70" y="198" text-anchor="middle" fill="#a9c6d1" font-family="Arial,sans-serif" font-size="11">ATTRIBUTED BUYERS</text>
  </g>

  <path d="M565 511 H622" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <path d="M611 498 L627 511 L611 524" fill="none" stroke="#4dffb8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(650 425)" filter="url(#shadow)">
    <rect width="194" height="176" rx="24" fill="#12333d" stroke="#58d6ff" stroke-opacity=".7" stroke-width="2"/>
    <rect x="19" y="18" width="156" height="48" rx="10" fill="#06131c"/>
    <text x="97" y="48" text-anchor="middle" fill="#4dffb8" font-family="Arial,sans-serif" font-size="26" font-weight="800">$40</text>
    <g fill="#58d6ff" opacity=".8">
      <rect x="22" y="82" width="32" height="24" rx="6"/><rect x="63" y="82" width="32" height="24" rx="6"/><rect x="104" y="82" width="32" height="24" rx="6"/><rect x="145" y="82" width="27" height="24" rx="6"/>
      <rect x="22" y="119" width="32" height="24" rx="6"/><rect x="63" y="119" width="32" height="24" rx="6"/><rect x="104" y="119" width="32" height="24" rx="6"/><rect x="145" y="119" width="27" height="24" rx="6"/>
    </g>
    <text x="97" y="163" text-anchor="middle" fill="#ecf8fb" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1">PER BUYER</text>
  </g>
  <text x="64" y="611" fill="#7395a1" font-family="Arial,sans-serif" font-size="13">Conceptual worksheet. The example amounts and count are fictional.</text>
</svg>
