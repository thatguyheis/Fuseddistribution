<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Track cost per buyer</title>
  <desc id="desc">A fictional campaign cost is divided by six attributed first time customers to show an estimated cost per buyer.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06131c"/><stop offset="1" stop-color="#102934"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#58d6ff"/><stop offset="1" stop-color="#4dffb8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#background)"/>
  <circle cx="860" cy="720" r="400" fill="#58d6ff" opacity=".05"/>
  <text x="72" y="92" fill="#58d6ff" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="6">FUSED DISTRIBUTION</text>
  <text x="72" y="190" fill="#ecf8fb" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="3">A WEEKLY WORKSHEET</text>
  <text x="72" y="282" fill="#f8fdff" font-family="Arial,sans-serif" font-size="68" font-weight="800">TRACK COST</text>
  <text x="72" y="360" fill="#f8fdff" font-family="Arial,sans-serif" font-size="68" font-weight="800">PER BUYER</text>
  <text x="72" y="416" fill="#a9c6d1" font-family="Arial,sans-serif" font-size="26">One campaign. One clear calculation.</text>
  <rect x="72" y="462" width="300" height="48" rx="24" fill="#09222c" stroke="#58d6ff" stroke-opacity=".55"/>
  <text x="222" y="493" text-anchor="middle" fill="#58d6ff" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="1">FICTIONAL EXAMPLE</text>
  <g filter="url(#shadow)">
    <path d="M104 585 H358 L397 624 V794 H104Z" fill="#f1f7f8"/>
    <path d="M358 585 V624 H397" fill="#d5e7eb"/>
    <text x="134" y="640" fill="#28414b" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="1">CAMPAIGN COST</text>
    <text x="134" y="715" fill="#0b2029" font-family="Arial,sans-serif" font-size="62" font-weight="800">$240</text>
    <path d="M134 743 H356" stroke="#a8bdc4" stroke-width="3" stroke-dasharray="7 8"/>
    <text x="134" y="777" fill="#48616a" font-family="Arial,sans-serif" font-size="16">ONE LOCAL PROMOTION</text>
  </g>
  <text x="600" y="694" text-anchor="middle" fill="url(#accent)" font-family="Arial,sans-serif" font-size="54" font-weight="800">÷</text>
  <g transform="translate(758 592)">
    <text x="110" y="-7" text-anchor="middle" fill="#a9c6d1" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1">FIRST TIME BUYERS</text>
    <g fill="#58d6ff">
      <circle cx="40" cy="47" r="12"/><path d="M20 89c2-18 10-27 20-27s18 9 20 27z"/>
      <circle cx="110" cy="47" r="12"/><path d="M90 89c2-18 10-27 20-27s18 9 20 27z"/>
      <circle cx="180" cy="47" r="12"/><path d="M160 89c2-18 10-27 20-27s18 9 20 27z"/>
    </g>
    <g fill="#4dffb8">
      <circle cx="40" cy="133" r="12"/><path d="M20 175c2-18 10-27 20-27s18 9 20 27z"/>
      <circle cx="110" cy="133" r="12"/><path d="M90 175c2-18 10-27 20-27s18 9 20 27z"/>
      <circle cx="180" cy="133" r="12"/><path d="M160 175c2-18 10-27 20-27s18 9 20 27z"/>
    </g>
    <text x="110" y="220" text-anchor="middle" fill="#f8fdff" font-family="Arial,sans-serif" font-size="44" font-weight="800">6</text>
    <text x="110" y="247" text-anchor="middle" fill="#a9c6d1" font-family="Arial,sans-serif" font-size="14">ATTRIBUTED BUYERS</text>
  </g>
  <path d="M196 855 H1004" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <g transform="translate(350 892)" filter="url(#shadow)">
    <rect width="500" height="156" rx="28" fill="#12333d" stroke="#58d6ff" stroke-opacity=".7" stroke-width="2"/>
    <text x="250" y="59" text-anchor="middle" fill="#a9c6d1" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2">ESTIMATED COST PER BUYER</text>
    <text x="250" y="124" text-anchor="middle" fill="#4dffb8" font-family="Arial,sans-serif" font-size="61" font-weight="800">$40</text>
  </g>
  <text x="600" y="1115" text-anchor="middle" fill="#a9c6d1" font-family="Arial,sans-serif" font-size="18">Conceptual worksheet. Example values are fictional, not a benchmark.</text>
</svg>
