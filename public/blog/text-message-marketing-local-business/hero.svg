  <text x="600" y="495" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-size="14" fill="rgba(175,198,207,0.55)" letter-spacing="0.04em">Source: SimpleTexting 2024 · Mailchimp 2024 · Hootsuite 2024</text>

