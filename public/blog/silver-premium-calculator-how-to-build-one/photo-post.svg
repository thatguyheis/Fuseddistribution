<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"><rect width="1080" height="1080" rx="36" fill="#07141c"/><text x="72" y="120" fill="#58d6ff" font-family="Arial" font-size="24" font-weight="700" letter-spacing="3">SILVER COST CHECK</text><text x="72" y="235" fill="#ecf8fb" font-family="Arial" font-size="62" font-weight="800">BUILD THE</text><text x="72" y="305" fill="#ecf8fb" font-family="Arial" font-size="62" font-weight="800">CALCULATOR</text><g font-family="Arial"><rect x="72" y="400" width="936" height="120" rx="18" fill="#102f39" stroke="#58d6ff" stroke-width="2"/><text x="112" y="475" fill="#9bf0d1" font-size="30" font-weight="700">1</text><text x="170" y="475" fill="#fff" font-size="30" font-weight="700">CONVERT TO FINE TROY OUNCES</text><rect x="72" y="560" width="936" height="120" rx="18" fill="#102f39" stroke="#58d6ff" stroke-width="2"/><text x="112" y="635" fill="#9bf0d1" font-size="30" font-weight="700">2</text><text x="170" y="635" fill="#fff" font-size="30" font-weight="700">ADD THE DELIVERED COST</text><rect x="72" y="720" width="936" height="120" rx="18" fill="#102f39" stroke="#58d6ff" stroke-width="2"/><text x="112" y="795" fill="#9bf0d1" font-size="30" font-weight="700">3</text><text x="170" y="795" fill="#fff" font-size="30" font-weight="700">DIVIDE AND CHECK THE FORMULA</text></g><text x="72" y="955" fill="#a8cbd2" font-family="Arial" font-size="24">Same unit. Full cost. Clear source.</text></svg>
