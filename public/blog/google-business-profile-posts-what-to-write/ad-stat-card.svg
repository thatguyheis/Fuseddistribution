<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <radialGradient id="gs-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58d6ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#58d6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gs-glow2" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#4dffb8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#4dffb8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1200" fill="#041018"/>
  <rect width="1200" height="1200" fill="url(#gs-glow)"/>
  <rect width="1200" height="1200" fill="url(#gs-glow2)"/>

  <!-- Grid lines -->
  <line x1="0" y1="300" x2="1200" y2="300" stroke="rgba(88,214,255,0.04)" stroke-width="1"/>
  <line x1="0" y1="600" x2="1200" y2="600" stroke="rgba(88,214,255,0.04)" stroke-width="1"/>
  <line x1="0" y1="900" x2="1200" y2="900" stroke="rgba(88,214,255,0.04)" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="1200" stroke="rgba(88,214,255,0.04)" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="1200" stroke="rgba(88,214,255,0.04)" stroke-width="1"/>
  <line x1="900" y1="0" x2="900" y2="1200" stroke="rgba(88,214,255,0.04)" stroke-width="1"/>

  <!-- Top label -->
  <text x="600" y="280" text-anchor="middle" font-family="'Trebuchet MS',sans-serif"
    font-size="28" font-weight="700" letter-spacing="6" fill="rgba(175,198,207,0.60)">GOOGLE BUSINESS PROFILE POSTS</text>

  <!-- Giant stat -->
  <text x="600" y="545" text-anchor="middle" font-family="'Trebuchet MS',sans-serif"
    font-size="200" font-weight="700" fill="#58d6ff">7 DAYS</text>

  <!-- Unit line -->
  <text x="600" y="638" text-anchor="middle" font-family="'Trebuchet MS',sans-serif"
    font-size="56" font-weight="700" fill="#4dffb8">THEN YOUR POST DISAPPEARS</text>

  <!-- Context line 1 -->
  <text x="600" y="730" text-anchor="middle" font-family="'Trebuchet MS',sans-serif"
    font-size="38" fill="#e8f4f8">one service + one job photo + one reason to call</text>

  <!-- Context line 2 -->
  <text x="600" y="790" text-anchor="middle" font-family="'Trebuchet MS',sans-serif"
    font-size="28" fill="rgba(175,198,207,0.70)">weekly, 15 minutes, beats company news every time</text>

  <!-- Divider -->
  <line x1="400" y1="860" x2="800" y2="860" stroke="rgba(88,214,255,0.20)" stroke-width="1"/>

  <!-- Sub-stat -->
  <text x="600" y="920" text-anchor="middle" font-family="'Trebuchet MS',sans-serif"
    font-size="26" fill="rgba(175,198,207,0.55)">profiles with photos get 42% more direction requests</text>

  <!-- Brand wordmark -->
  <text x="1150" y="1160" text-anchor="end" font-family="'Trebuchet MS',sans-serif"
    font-size="22" fill="rgba(88,214,255,0.50)">fuseddistribution.com</text>

  <!-- Bottom left accent -->
  <text x="50" y="1160" text-anchor="start" font-family="'Trebuchet MS',sans-serif"
    font-size="20" fill="rgba(77,255,184,0.35)">FUSED TECHNOLOGY SOLUTIONS</text>
</svg>
