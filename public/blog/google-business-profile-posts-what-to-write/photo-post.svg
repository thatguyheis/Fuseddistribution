<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <radialGradient id="gpp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58d6ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#58d6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gpp-glow2" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#4dffb8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#4dffb8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1200" fill="#041018"/>
  <rect width="1200" height="1200" fill="url(#gpp-glow)"/>
  <rect width="1200" height="1200" fill="url(#gpp-glow2)"/>

  <!-- Grid lines -->
  <line x1="0" y1="300" x2="1200" y2="300" stroke="rgba(88,214,255,0.04)" stroke-width="1"/>
  <line x1="0" y1="600" x2="1200" y2="600" stroke="rgba(88,214,255,0.04)" stroke-width="1"/>
  <line x1="0" y1="900" x2="1200" y2="900" stroke="rgba(88,214,255,0.04)" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="1200" stroke="rgba(88,214,255,0.04)" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="1200" stroke="rgba(88,214,255,0.04)" stroke-width="1"/>
  <line x1="900" y1="0" x2="900" y2="1200" stroke="rgba(88,214,255,0.04)" stroke-width="1"/>

  <!-- Scatter dots -->
  <circle cx="160" cy="180" r="1.5" fill="#58d6ff" opacity="0.25"/>
  <circle cx="1010" cy="240" r="1.3" fill="#4dffb8" opacity="0.20"/>
  <circle cx="240" cy="1020" r="1.4" fill="#58d6ff" opacity="0.18"/>
  <circle cx="980" cy="1060" r="1.2" fill="#4dffb8" opacity="0.22"/>

  <!-- Top: eyebrow + brand -->
  <text x="600" y="150" text-anchor="middle" font-family="Impact, Arial Narrow Bold, sans-serif" font-size="26" letter-spacing="8" fill="#4dffb8" opacity="0.85">GOOGLE &#183; LOCAL BUSINESS</text>
  <text x="600" y="200" text-anchor="middle" font-family="Impact, Arial Narrow Bold, sans-serif" font-size="34" letter-spacing="10" fill="rgba(88,214,255,0.55)">FUSED</text>

  <!-- Title -->
  <text x="600" y="330" text-anchor="middle" font-family="Impact, Arial Narrow Bold, sans-serif" font-size="68" letter-spacing="2" fill="#ecf8fb">GOOGLE BUSINESS PROFILE</text>
  <text x="600" y="416" text-anchor="middle" font-family="Impact, Arial Narrow Bold, sans-serif" font-size="68" letter-spacing="2" fill="#ecf8fb">POSTS: WHAT TO WRITE</text>

  <!-- Key stat -->
  <text x="600" y="660" text-anchor="middle" font-family="Impact, Arial Narrow Bold, sans-serif" font-size="170" letter-spacing="-2" fill="#58d6ff">7 DAYS</text>
  <text x="600" y="724" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" letter-spacing="3" fill="rgba(175,198,207,0.75)">BEFORE GOOGLE ROTATES YOUR POST OUT OF VIEW</text>

  <!-- Divider -->
  <line x1="400" y1="780" x2="800" y2="780" stroke="rgba(88,214,255,0.20)" stroke-width="1"/>

  <!-- Supporting lines -->
  <text x="600" y="838" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#ecf8fb">One service. One job photo. One reason to call.</text>
  <text x="600" y="890" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="rgba(175,198,207,0.70)">That weekly formula beats company news every time.</text>

  <!-- CTA button -->
  <rect x="270" y="980" width="660" height="84" rx="42" fill="rgba(7,20,28,0.85)" stroke="#58d6ff" stroke-width="2"/>
  <text x="600" y="1033" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#58d6ff">Full breakdown at fuseddistribution.com</text>

  <!-- Bottom brand -->
  <text x="600" y="1150" text-anchor="middle" font-family="Impact, Arial Narrow Bold, sans-serif" font-size="22" letter-spacing="6" fill="rgba(88,214,255,0.45)">FUSEDDISTRIBUTION.COM/BLOG</text>
</svg>
