<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280"><rect width="100%" height="100%" fill="#081d29"/><text x="45" y="120" fill="#58d6ff" font-size="34" font-family="Arial" font-weight="700">THE BUILDING SURVIVED</text><path d="M105 280 V850" stroke="#58d6ff" stroke-width="5"/><circle cx="105" cy="300" r="12" fill="#58d6ff"/><text x="150" y="310" fill="#fff" font-size="52" font-family="Arial" font-weight="700">1904</text><text x="150" y="365" fill="#fff" font-size="30" font-family="Arial" font-weight="700">Last New Orleans Morgans</text><circle cx="105" cy="540" r="12" fill="#58d6ff"/><text x="150" y="550" fill="#fff" font-size="52" font-family="Arial" font-weight="700">1909</text><text x="150" y="605" fill="#fff" font-size="30" font-family="Arial" font-weight="700">Coin production ends</text><circle cx="105" cy="780" r="12" fill="#58d6ff"/><text x="150" y="790" fill="#fff" font-size="52" font-family="Arial" font-weight="700">1981</text><text x="150" y="845" fill="#fff" font-size="30" font-family="Arial" font-weight="700">Opens as state museum</text><text x="45" y="1000" fill="#b9d2dc" font-size="22" font-family="Arial" font-weight="700">U.S. Mint / Louisiana State Museum</text></svg>